<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-lamp" data-rd-animate="hover"><style>.rd-a-lamp{overflow:visible}.rd-a-lamp *{transform-box:view-box}.rd-a-lamp .p0{transform-origin:12px 8px}@media (prefers-reduced-motion:no-preference){.rd-a-lamp[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-lamp[data-rd-animate="parent"] .p0,.rd-a-lamp[data-rd-animate="play"] .p0,.rd-a-lamp[data-rd-animate="loop"] .p0{animation:rd-lamp-f0 calc(0.8s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-lamp[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-lamp-f0{0%,100%{scale:1}45%{scale:1.08}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><path d="M12 13.5v6M8.5 20.5h7"/><g><g class="p0" style="--k:0;--s:1"><path d="M8 3.5h8l3 10H5z"/></g></g></g></svg>
