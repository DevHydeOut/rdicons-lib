<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-sparkle" data-rd-animate="hover"><style>.rd-a-sparkle{overflow:visible}.rd-a-sparkle *{transform-box:view-box}.rd-a-sparkle .a{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-sparkle[data-rd-animate="hover"]:hover .a,:hover>.rd-a-sparkle[data-rd-animate="parent"] .a,.rd-a-sparkle[data-rd-animate="play"] .a,.rd-a-sparkle[data-rd-animate="loop"] .a{animation:rd-sparkle-m calc(0.7s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-sparkle[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-sparkle-m{0%,100%{scale:1}35%{scale:.88}65%{scale:1.1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><path d="M12 3.5l1.8 6.7 6.7 1.8-6.7 1.8L12 20.5l-1.8-6.7L3.5 12l6.7-1.8z"/></g></g></svg>
