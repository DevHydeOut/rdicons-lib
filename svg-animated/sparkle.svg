<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-sparkle" data-rd-animate="hover"><style>.rd-a-sparkle{overflow:visible}.rd-a-sparkle *{transform-box:view-box}.rd-a-sparkle .p0{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-sparkle[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-sparkle[data-rd-animate="parent"] .p0,.rd-a-sparkle[data-rd-animate="play"] .p0,.rd-a-sparkle[data-rd-animate="loop"] .p0{animation:rd-sparkle-f0 calc(0.8s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-sparkle[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-sparkle-f0{0%{rotate:0deg}100%{rotate:90deg}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g><g class="p0" style="--k:0;--s:1"><path d="M12 3.5l1.8 6.7 6.7 1.8-6.7 1.8L12 20.5l-1.8-6.7L3.5 12l6.7-1.8z"/></g></g></g></svg>
