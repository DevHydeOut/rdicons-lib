<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-user-circle" data-rd-animate="hover"><style>.rd-a-user-circle{overflow:visible}.rd-a-user-circle *{transform-box:view-box}.rd-a-user-circle .p0{transform-box:fill-box;transform-origin:center}.rd-a-user-circle .p1{transform-origin:12px 18px}@media (prefers-reduced-motion:no-preference){.rd-a-user-circle[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-user-circle[data-rd-animate="parent"] .p0,.rd-a-user-circle[data-rd-animate="play"] .p0,.rd-a-user-circle[data-rd-animate="loop"] .p0{animation:rd-user-circle-f0 calc(0.9s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-user-circle[data-rd-animate="hover"]:hover .p1,:hover>.rd-a-user-circle[data-rd-animate="parent"] .p1,.rd-a-user-circle[data-rd-animate="play"] .p1,.rd-a-user-circle[data-rd-animate="loop"] .p1{animation:rd-user-circle-f1 calc(0.7s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1);animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-user-circle[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-user-circle-f0{0%,100%{translate:0 0}50%{translate:0 calc(var(--s)*1.8px)}}@keyframes rd-user-circle-f1{0%,100%{scale:1 1}40%{scale:1.1 .86}70%{scale:.95 1.06}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><circle cx="12" cy="12" r="8.5"/><g><g class="p0" style="--k:0;--s:1"><circle cx="12" cy="10" r="2.8"/></g></g><g><g class="p1" style="--k:0;--s:1"><path d="M6.5 18.2c1-2.2 3-3.2 5.5-3.2s4.5 1 5.5 3.2"/></g></g></g></svg>
