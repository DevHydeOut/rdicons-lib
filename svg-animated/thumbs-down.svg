<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-thumbs-down" data-rd-animate="hover"><style>.rd-a-thumbs-down{overflow:visible}.rd-a-thumbs-down *{transform-box:view-box}.rd-a-thumbs-down .hand{transform-origin:7px 5px}@media (prefers-reduced-motion:no-preference){.rd-a-thumbs-down[data-rd-animate="hover"]:hover .hand,:hover>.rd-a-thumbs-down[data-rd-animate="parent"] .hand,.rd-a-thumbs-down[data-rd-animate="play"] .hand,.rd-a-thumbs-down[data-rd-animate="loop"] .hand{animation:rd-thumbs-down-tilt calc(0.7s*var(--rd-speed,1)) ease-in-out}.rd-a-thumbs-down[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-thumbs-down-tilt{0%,100%{rotate:0deg}35%{rotate:14deg}65%{rotate:-4deg}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><path d="M4.5 12.5a.5.5 0 0 0 .5.5h2V4.5H5a.5.5 0 0 0-.5.5z"/><path class="hand" d="M7 13l3.4 6.4a1.8 1.8 0 0 0 3.3-1.2L13 14.5h5.1a2 2 0 0 0 2-2.4l-1-6A2 2 0 0 0 17.1 4.5H7"/></g></svg>
