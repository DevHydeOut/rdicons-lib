<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-zap" data-rd-animate="hover"><style>.rd-a-zap{overflow:visible}.rd-a-zap *{transform-box:view-box}.rd-a-zap .bolt{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-zap[data-rd-animate="hover"]:hover .bolt,:hover>.rd-a-zap[data-rd-animate="parent"] .bolt,.rd-a-zap[data-rd-animate="play"] .bolt,.rd-a-zap[data-rd-animate="loop"] .bolt{animation:rd-zap-zap calc(0.7s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-zap[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-zap-zap{0%,100%{scale:1;rotate:0deg}30%{scale:1.18;rotate:-5deg}58%{scale:.96;rotate:2deg}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="bolt"><path d="M13 3.5L5.5 13.5h6L11 20.5l7.5-10h-6z"/></g></g></svg>
