<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-egg" data-rd-animate="hover"><style>.rd-a-egg{overflow:visible}.rd-a-egg *{transform-box:view-box}.rd-a-egg .a{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-egg[data-rd-animate="hover"]:hover .a,:hover>.rd-a-egg[data-rd-animate="parent"] .a,.rd-a-egg[data-rd-animate="play"] .a,.rd-a-egg[data-rd-animate="loop"] .a{animation:rd-egg-m calc(0.7s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-egg[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-egg-m{0%,100%{scale:1}35%{scale:.88}65%{scale:1.1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><path d="M12 3.5c3.5 0 6.5 5.5 6.5 10a6.5 6.5 0 0 1-13 0c0-4.5 3-10 6.5-10z"/></g></g></svg>
