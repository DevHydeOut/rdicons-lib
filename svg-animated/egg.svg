<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-egg" data-rd-animate="hover"><style>.rd-a-egg{overflow:visible}.rd-a-egg *{transform-box:view-box}.rd-a-egg .d{stroke-dasharray:1 2}@media (prefers-reduced-motion:no-preference){.rd-a-egg[data-rd-animate="hover"]:hover .d,:hover>.rd-a-egg[data-rd-animate="parent"] .d,.rd-a-egg[data-rd-animate="play"] .d,.rd-a-egg[data-rd-animate="loop"] .d{animation:rd-egg-draw calc(0.75s*var(--rd-speed,1)) ease-out;animation-delay:calc(var(--k)*.1s*var(--rd-speed,1))}.rd-a-egg[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-egg-draw{0%{stroke-dashoffset:1.2}100%{stroke-dashoffset:0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="d" style="--k:0"><path pathLength="1" d="M12 3.5c3.5 0 6.5 5.5 6.5 10a6.5 6.5 0 0 1-13 0c0-4.5 3-10 6.5-10z"/></g></g></svg>
