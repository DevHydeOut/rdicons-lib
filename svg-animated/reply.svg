<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-reply" data-rd-animate="hover"><style>.rd-a-reply{overflow:visible}.rd-a-reply *{transform-box:view-box}.rd-a-reply .d{stroke-dasharray:1 2}@media (prefers-reduced-motion:no-preference){.rd-a-reply[data-rd-animate="hover"]:hover .d,:hover>.rd-a-reply[data-rd-animate="parent"] .d,.rd-a-reply[data-rd-animate="play"] .d,.rd-a-reply[data-rd-animate="loop"] .d{animation:rd-reply-draw calc(0.75s*var(--rd-speed,1)) ease-out;animation-delay:calc(var(--k)*.1s*var(--rd-speed,1))}.rd-a-reply[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-reply-draw{0%{stroke-dashoffset:1.2}100%{stroke-dashoffset:0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="d" style="--k:0"><path pathLength="1" d="M9.5 5L4 10.5 9.5 16"/></g><g class="d" style="--k:1"><path pathLength="1" d="M4 10.5h9a6.5 6.5 0 0 1 6.5 6.5v2.5"/></g></g></svg>
