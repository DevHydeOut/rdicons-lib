<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-lock" data-rd-animate="hover"><style>.rd-a-lock{overflow:visible}.rd-a-lock *{transform-box:view-box}.rd-a-lock .lbody{transform-origin:12px 20.5px}@media (prefers-reduced-motion:no-preference){.rd-a-lock[data-rd-animate="hover"]:hover .shackle,:hover>.rd-a-lock[data-rd-animate="parent"] .shackle,.rd-a-lock[data-rd-animate="play"] .shackle,.rd-a-lock[data-rd-animate="loop"] .shackle{animation:rd-lock-snap calc(0.85s*var(--rd-speed,1)) ease-in-out}.rd-a-lock[data-rd-animate="hover"]:hover .lbody,:hover>.rd-a-lock[data-rd-animate="parent"] .lbody,.rd-a-lock[data-rd-animate="play"] .lbody,.rd-a-lock[data-rd-animate="loop"] .lbody{animation:rd-lock-squash calc(0.85s*var(--rd-speed,1)) ease-in-out}.rd-a-lock[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-lock-snap{0%,100%{translate:0 0}25%,55%{translate:0 -2.7px}72%{translate:0 .5px}86%{translate:0 -.3px}}@keyframes rd-lock-squash{0%,66%,100%{scale:1 1}74%{scale:1.03 .94}88%{scale:.995 1.01}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="lbody"><rect x="4.5" y="10.5" width="15" height="10" rx="4"/><path d="M12 14.8v1.8"/></g><path class="shackle" d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></g></svg>
