<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-radar" data-rd-animate="hover"><style>.rd-a-radar{overflow:visible}.rd-a-radar *{transform-box:view-box}.rd-a-radar .sweep{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-radar[data-rd-animate="hover"]:hover .sweep,:hover>.rd-a-radar[data-rd-animate="parent"] .sweep,.rd-a-radar[data-rd-animate="play"] .sweep,.rd-a-radar[data-rd-animate="loop"] .sweep{animation:rd-radar-sweep calc(1s*var(--rd-speed,1)) linear}.rd-a-radar[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-radar-sweep{0%{rotate:0deg}100%{rotate:360deg}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.2"/><path class="sweep" d="M12 12l5.2-5.2"/><path d="M12 12h.01"/></g></svg>
