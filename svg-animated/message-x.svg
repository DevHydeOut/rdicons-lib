<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-message-x" data-rd-animate="hover"><style>.rd-a-message-x{overflow:visible}.rd-a-message-x *{transform-box:view-box}.rd-a-message-x .base{transform-origin:12px 12px}.rd-a-message-x .badge{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:no-preference){.rd-a-message-x[data-rd-animate="hover"]:hover .base,:hover>.rd-a-message-x[data-rd-animate="parent"] .base,.rd-a-message-x[data-rd-animate="play"] .base,.rd-a-message-x[data-rd-animate="loop"] .base{animation:rd-message-x-base calc(0.7s*var(--rd-speed,1)) ease-in-out}.rd-a-message-x[data-rd-animate="hover"]:hover .badge,:hover>.rd-a-message-x[data-rd-animate="parent"] .badge,.rd-a-message-x[data-rd-animate="play"] .badge,.rd-a-message-x[data-rd-animate="loop"] .badge{animation:rd-message-x-badge calc(0.8s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-message-x[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-message-x-base{0%,100%{scale:1}40%{scale:.96}}@keyframes rd-message-x-badge{0%,100%{scale:1;opacity:1}22%{scale:.1;opacity:0}62%{scale:1.3;opacity:1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="base"><path d="M12 3.5A8 8 0 1 1 8 18.43L4.5 19.5l.570-4A8 8 0 0 1 12 3.5z"/></g><g class="badge"><path d="M9.5 9l5 5M14.5 9l-5 5"/></g></g></svg>
