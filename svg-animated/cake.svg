<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-cake" data-rd-animate="hover"><style>.rd-a-cake{overflow:visible}.rd-a-cake *{transform-box:view-box}.rd-a-cake .p0{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:no-preference){.rd-a-cake[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-cake[data-rd-animate="parent"] .p0,.rd-a-cake[data-rd-animate="play"] .p0,.rd-a-cake[data-rd-animate="loop"] .p0{animation:rd-cake-f0 calc(0.6s*var(--rd-speed,1)) linear;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-cake[data-rd-animate="hover"]:hover .p1,:hover>.rd-a-cake[data-rd-animate="parent"] .p1,.rd-a-cake[data-rd-animate="play"] .p1,.rd-a-cake[data-rd-animate="loop"] .p1{animation:rd-cake-f1 calc(0.9s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-cake[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-cake-f0{0%,100%{scale:1;opacity:1}25%{scale:1.6 .6;opacity:.6}55%{scale:.8 1.3;opacity:1}}@keyframes rd-cake-f1{0%,100%{translate:0 0}50%{translate:calc(var(--s)*2.6px) 0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><path d="M4 20.5h16"/><path d="M5 20.5V13a1.5 1.5 0 0 1 1.5-1.5h11A1.5 1.5 0 0 1 19 13v7.5"/><path d="M12 11.5v-3"/><g><g class="p0" style="--k:0;--s:1"><path d="M12 5.5h.01"/></g></g><g><g class="p1" style="--k:0;--s:1"><path d="M5 16c1.7 1.5 3.3 1.5 5 0s3.3-1.5 5 0 2.7 1 4 0"/></g></g></g></svg>
