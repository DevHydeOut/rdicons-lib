<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-network" data-rd-animate="hover"><style>.rd-a-network{overflow:visible}.rd-a-network *{transform-box:view-box}.rd-a-network .p0{transform-box:fill-box;transform-origin:center}.rd-a-network .p1{stroke-dasharray:1 2}@media (prefers-reduced-motion:no-preference){.rd-a-network[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-network[data-rd-animate="parent"] .p0,.rd-a-network[data-rd-animate="play"] .p0,.rd-a-network[data-rd-animate="loop"] .p0{animation:rd-network-f0 calc(0.5s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1);animation-delay:calc((0s + var(--k)*0.15s)*var(--rd-speed,1))}.rd-a-network[data-rd-animate="hover"]:hover .p1,:hover>.rd-a-network[data-rd-animate="parent"] .p1,.rd-a-network[data-rd-animate="play"] .p1,.rd-a-network[data-rd-animate="loop"] .p1{animation:rd-network-f1 calc(0.75s*var(--rd-speed,1)) ease-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-network[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-network-f0{0%,100%{scale:1}40%{scale:1.5}}@keyframes rd-network-f1{0%{stroke-dashoffset:1.2}100%{stroke-dashoffset:0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g><g class="p0" style="--k:0;--s:1"><circle cx="12" cy="5.5" r="2.5"/></g><g class="p0" style="--k:1;--s:1"><circle cx="5.5" cy="18.5" r="2.5"/></g><g class="p0" style="--k:2;--s:1"><circle cx="18.5" cy="18.5" r="2.5"/></g></g><g><g class="p1" style="--k:0;--s:1"><path pathLength="1" d="M12 8v3.5M12 11.5H5.5V16M12 11.5h6.5V16"/></g></g></g></svg>
