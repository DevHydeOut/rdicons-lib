<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-pause-circle" data-rd-animate="hover"><style>.rd-a-pause-circle{overflow:visible}.rd-a-pause-circle *{transform-box:view-box}.rd-a-pause-circle .base{transform-origin:12px 12px}.rd-a-pause-circle .badge{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:no-preference){.rd-a-pause-circle[data-rd-animate="hover"]:hover .base,:hover>.rd-a-pause-circle[data-rd-animate="parent"] .base,.rd-a-pause-circle[data-rd-animate="play"] .base,.rd-a-pause-circle[data-rd-animate="loop"] .base{animation:rd-pause-circle-base calc(0.7s*var(--rd-speed,1)) ease-in-out}.rd-a-pause-circle[data-rd-animate="hover"]:hover .badge,:hover>.rd-a-pause-circle[data-rd-animate="parent"] .badge,.rd-a-pause-circle[data-rd-animate="play"] .badge,.rd-a-pause-circle[data-rd-animate="loop"] .badge{animation:rd-pause-circle-badge calc(0.8s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-pause-circle[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-pause-circle-base{0%,100%{scale:1}40%{scale:.96}}@keyframes rd-pause-circle-badge{0%,100%{scale:1;opacity:1}22%{scale:.1;opacity:0}62%{scale:1.3;opacity:1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="base"><circle cx="12" cy="12" r="8.5"/></g><g class="badge"><path d="M10 9v6M14 9v6"/></g></g></svg>
