<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-candy" data-rd-animate="hover"><style>.rd-a-candy{overflow:visible}.rd-a-candy *{transform-box:view-box}.rd-a-candy .a{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-candy[data-rd-animate="hover"]:hover .a,:hover>.rd-a-candy[data-rd-animate="parent"] .a,.rd-a-candy[data-rd-animate="play"] .a,.rd-a-candy[data-rd-animate="loop"] .a{animation:rd-candy-m calc(0.8s*var(--rd-speed,1)) ease-in-out}.rd-a-candy[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-candy-m{0%,100%{rotate:0deg}35%{rotate:-12deg}70%{rotate:9deg}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><ellipse cx="12" cy="12" rx="4.8" ry="4.5"/><path d="M7.2 12L3.5 8.5v7z"/><path d="M16.8 12l3.7-3.5v7z"/></g></g></svg>
