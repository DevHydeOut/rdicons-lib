<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-option" data-rd-animate="hover"><style>.rd-a-option{overflow:visible}.rd-a-option *{transform-box:view-box}.rd-a-option .d{stroke-dasharray:1 2}@media (prefers-reduced-motion:no-preference){.rd-a-option[data-rd-animate="hover"]:hover .d,:hover>.rd-a-option[data-rd-animate="parent"] .d,.rd-a-option[data-rd-animate="play"] .d,.rd-a-option[data-rd-animate="loop"] .d{animation:rd-option-draw calc(0.75s*var(--rd-speed,1)) ease-out;animation-delay:calc(var(--k)*.1s*var(--rd-speed,1))}.rd-a-option[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-option-draw{0%{stroke-dashoffset:1.2}100%{stroke-dashoffset:0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="d" style="--k:0"><path pathLength="1" d="M3.5 5.5h4.5l8 13h4.5"/></g><g class="d" style="--k:1"><path pathLength="1" d="M13.5 5.5h7"/></g></g></svg>
