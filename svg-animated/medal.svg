<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-medal" data-rd-animate="hover"><style>.rd-a-medal{overflow:visible}.rd-a-medal *{transform-box:view-box}.rd-a-medal .p0{transform-box:fill-box;transform-origin:center}.rd-a-medal .p1{transform-origin:12px 13.5px}@media (prefers-reduced-motion:no-preference){.rd-a-medal[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-medal[data-rd-animate="parent"] .p0,.rd-a-medal[data-rd-animate="play"] .p0,.rd-a-medal[data-rd-animate="loop"] .p0{animation:rd-medal-f0 calc(0.8s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-medal[data-rd-animate="hover"]:hover .p1,:hover>.rd-a-medal[data-rd-animate="parent"] .p1,.rd-a-medal[data-rd-animate="play"] .p1,.rd-a-medal[data-rd-animate="loop"] .p1{animation:rd-medal-f1 calc(1s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-medal[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-medal-f0{0%,100%{scale:1}45%{scale:1.08}}@keyframes rd-medal-f1{0%,100%{rotate:0deg}30%{rotate:calc(var(--s)*8deg)}65%{rotate:calc(var(--s)*-6deg)}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g><g class="p0" style="--k:0;--s:1"><circle cx="12" cy="9" r="5.5"/></g></g><g><g class="p1" style="--k:0;--s:1"><path d="M8.5 13.5L7 20.5l5-2.5 5 2.5-1.5-7"/></g></g></g></svg>
