<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-rss" data-rd-animate="hover"><style>.rd-a-rss{overflow:visible}.rd-a-rss *{transform-box:view-box}.rd-a-rss .p0{stroke-dasharray:1 2}.rd-a-rss .p1{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:no-preference){.rd-a-rss[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-rss[data-rd-animate="parent"] .p0,.rd-a-rss[data-rd-animate="play"] .p0,.rd-a-rss[data-rd-animate="loop"] .p0{animation:rd-rss-f0 calc(0.75s*var(--rd-speed,1)) ease-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-rss[data-rd-animate="hover"]:hover .p1,:hover>.rd-a-rss[data-rd-animate="parent"] .p1,.rd-a-rss[data-rd-animate="play"] .p1,.rd-a-rss[data-rd-animate="loop"] .p1{animation:rd-rss-f1 calc(0.5s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1);animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-rss[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-rss-f0{0%{stroke-dashoffset:1.2}100%{stroke-dashoffset:0}}@keyframes rd-rss-f1{0%,100%{scale:1}40%{scale:1.5}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g><g class="p0" style="--k:0;--s:1"><path pathLength="1" d="M5 5.5A13.5 13.5 0 0 1 18.5 19M5 11a8 8 0 0 1 8 8"/></g></g><g><g class="p1" style="--k:0;--s:1"><path d="M5.5 19h.01"/></g></g></g></svg>
