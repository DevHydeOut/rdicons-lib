<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-nut" data-rd-animate="hover"><style>.rd-a-nut{overflow:visible}.rd-a-nut *{transform-box:view-box}.rd-a-nut .p0{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-nut[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-nut[data-rd-animate="parent"] .p0,.rd-a-nut[data-rd-animate="play"] .p0,.rd-a-nut[data-rd-animate="loop"] .p0{animation:rd-nut-f0 calc(0.8s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-nut[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-nut-f0{0%{rotate:0deg}100%{rotate:60deg}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g><g class="p0" style="--k:0;--s:1"><path d="M12 3.5l7.5 4.25v8.5L12 20.5l-7.5-4.25v-8.5z"/><circle cx="12" cy="12" r="3"/></g></g></g></svg>
