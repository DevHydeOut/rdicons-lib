<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-headset" data-rd-animate="hover"><style>.rd-a-headset{overflow:visible}.rd-a-headset *{transform-box:view-box}.rd-a-headset .p0{transform-box:fill-box;transform-origin:center}.rd-a-headset .p1{transform-origin:20px 17.5px}@media (prefers-reduced-motion:no-preference){.rd-a-headset[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-headset[data-rd-animate="parent"] .p0,.rd-a-headset[data-rd-animate="play"] .p0,.rd-a-headset[data-rd-animate="loop"] .p0{animation:rd-headset-f0 calc(0.8s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-headset[data-rd-animate="hover"]:hover .p1,:hover>.rd-a-headset[data-rd-animate="parent"] .p1,.rd-a-headset[data-rd-animate="play"] .p1,.rd-a-headset[data-rd-animate="loop"] .p1{animation:rd-headset-f1 calc(1s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-headset[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-headset-f0{0%,100%{scale:1}45%{scale:1.08}}@keyframes rd-headset-f1{0%,100%{rotate:0deg}30%{rotate:calc(var(--s)*8deg)}65%{rotate:calc(var(--s)*-6deg)}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><path d="M4.5 14v-2a7.5 7.5 0 0 1 15 0v2"/><g><g class="p0" style="--k:0;--s:1"><rect x="3.5" y="13" width="3.5" height="6" rx="1.5"/><rect x="17" y="13" width="3.5" height="6" rx="1.5"/></g></g><g><g class="p1" style="--k:0;--s:1"><path d="M20.5 17.5v1a2.5 2.5 0 0 1-2.5 2.5h-3"/></g></g></g></svg>
