<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-mic" data-rd-animate="hover"><style>.rd-a-mic{overflow:visible}.rd-a-mic *{transform-box:view-box}.rd-a-mic .a{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-mic[data-rd-animate="hover"]:hover .a,:hover>.rd-a-mic[data-rd-animate="parent"] .a,.rd-a-mic[data-rd-animate="play"] .a,.rd-a-mic[data-rd-animate="loop"] .a{animation:rd-mic-m calc(0.6s*var(--rd-speed,1)) linear}.rd-a-mic[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-mic-m{0%,100%{rotate:0deg}15%{rotate:-9deg}35%{rotate:9deg}55%{rotate:-6deg}75%{rotate:4deg}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><rect x="9" y="3.5" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5v3M9 20.5h6"/></g></g></svg>
