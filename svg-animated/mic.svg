<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-mic" data-rd-animate="hover"><style>.rd-a-mic{overflow:visible}.rd-a-mic *{transform-box:view-box}.rd-a-mic .p0{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:no-preference){.rd-a-mic[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-mic[data-rd-animate="parent"] .p0,.rd-a-mic[data-rd-animate="play"] .p0,.rd-a-mic[data-rd-animate="loop"] .p0{animation:rd-mic-f0 calc(0.8s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-mic[data-rd-animate="hover"]:hover .p1,:hover>.rd-a-mic[data-rd-animate="parent"] .p1,.rd-a-mic[data-rd-animate="play"] .p1,.rd-a-mic[data-rd-animate="loop"] .p1{animation:rd-mic-f1 calc(0.7s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-mic[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-mic-f0{0%,100%{scale:1}45%{scale:1.08}}@keyframes rd-mic-f1{0%,100%{opacity:1}40%{opacity:.15}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g><g class="p0" style="--k:0;--s:1"><rect x="9" y="3.5" width="6" height="11" rx="3"/></g></g><g><g class="p1" style="--k:0;--s:1"><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5v3M9 20.5h6"/></g></g></g></svg>
