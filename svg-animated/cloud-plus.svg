<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-cloud-plus" data-rd-animate="hover"><style>.rd-a-cloud-plus{overflow:visible}.rd-a-cloud-plus *{transform-box:view-box}.rd-a-cloud-plus .base{transform-origin:12px 12px}.rd-a-cloud-plus .badge{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:no-preference){.rd-a-cloud-plus[data-rd-animate="hover"]:hover .base,:hover>.rd-a-cloud-plus[data-rd-animate="parent"] .base,.rd-a-cloud-plus[data-rd-animate="play"] .base,.rd-a-cloud-plus[data-rd-animate="loop"] .base{animation:rd-cloud-plus-base calc(0.7s*var(--rd-speed,1)) ease-in-out}.rd-a-cloud-plus[data-rd-animate="hover"]:hover .badge,:hover>.rd-a-cloud-plus[data-rd-animate="parent"] .badge,.rd-a-cloud-plus[data-rd-animate="play"] .badge,.rd-a-cloud-plus[data-rd-animate="loop"] .badge{animation:rd-cloud-plus-badge calc(0.8s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-cloud-plus[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-cloud-plus-base{0%,100%{scale:1}40%{scale:.96}}@keyframes rd-cloud-plus-badge{0%,100%{scale:1;opacity:1}22%{scale:.1;opacity:0}62%{scale:1.3;opacity:1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="base"><path d="M7 19.5a4.5 4.5 0 0 1-.7-8.9 6 6 0 0 1 11.5-1.1 4.5 4.5 0 0 1-.8 10z"/></g><g class="badge"><path d="M12 12v5M9.5 14.5h5"/></g></g></svg>
