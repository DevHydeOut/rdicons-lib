<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-bar-chart-horizontal" data-rd-animate="hover"><style>.rd-a-bar-chart-horizontal{overflow:visible}.rd-a-bar-chart-horizontal *{transform-box:view-box}.rd-a-bar-chart-horizontal .d{stroke-dasharray:1 2}@media (prefers-reduced-motion:no-preference){.rd-a-bar-chart-horizontal[data-rd-animate="hover"]:hover .d,:hover>.rd-a-bar-chart-horizontal[data-rd-animate="parent"] .d,.rd-a-bar-chart-horizontal[data-rd-animate="play"] .d,.rd-a-bar-chart-horizontal[data-rd-animate="loop"] .d{animation:rd-bar-chart-horizontal-draw calc(0.75s*var(--rd-speed,1)) ease-out;animation-delay:calc(var(--k)*.1s*var(--rd-speed,1))}.rd-a-bar-chart-horizontal[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-bar-chart-horizontal-draw{0%{stroke-dashoffset:1.2}100%{stroke-dashoffset:0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="d" style="--k:0"><path pathLength="1" d="M4 3.5v17"/></g><g class="d" style="--k:1"><path pathLength="1" d="M7 7h8"/></g><g class="d" style="--k:2"><path pathLength="1" d="M7 12h11"/></g><g class="d" style="--k:3"><path pathLength="1" d="M7 17h5"/></g></g></svg>
