<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-gantt-chart" data-rd-animate="hover"><style>.rd-a-gantt-chart{overflow:visible}.rd-a-gantt-chart *{transform-box:view-box}.rd-a-gantt-chart .d{stroke-dasharray:1 2}@media (prefers-reduced-motion:no-preference){.rd-a-gantt-chart[data-rd-animate="hover"]:hover .d,:hover>.rd-a-gantt-chart[data-rd-animate="parent"] .d,.rd-a-gantt-chart[data-rd-animate="play"] .d,.rd-a-gantt-chart[data-rd-animate="loop"] .d{animation:rd-gantt-chart-draw calc(0.75s*var(--rd-speed,1)) ease-out;animation-delay:calc(var(--k)*.1s*var(--rd-speed,1))}.rd-a-gantt-chart[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-gantt-chart-draw{0%{stroke-dashoffset:1.2}100%{stroke-dashoffset:0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="d" style="--k:0"><path pathLength="1" d="M4.5 6h7"/></g><g class="d" style="--k:1"><path pathLength="1" d="M8.5 10.5h8"/></g><g class="d" style="--k:2"><path pathLength="1" d="M12.5 15h7"/></g><g class="d" style="--k:3"><path pathLength="1" d="M4.5 19.5h5"/></g></g></svg>
