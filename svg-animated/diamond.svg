<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-diamond" data-rd-animate="hover"><style>.rd-a-diamond{overflow:visible}.rd-a-diamond *{transform-box:view-box}.rd-a-diamond .d{stroke-dasharray:1 2}@media (prefers-reduced-motion:no-preference){.rd-a-diamond[data-rd-animate="hover"]:hover .d,:hover>.rd-a-diamond[data-rd-animate="parent"] .d,.rd-a-diamond[data-rd-animate="play"] .d,.rd-a-diamond[data-rd-animate="loop"] .d{animation:rd-diamond-draw calc(0.75s*var(--rd-speed,1)) ease-out;animation-delay:calc(var(--k)*.1s*var(--rd-speed,1))}.rd-a-diamond[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-diamond-draw{0%{stroke-dashoffset:1.2}100%{stroke-dashoffset:0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="d" style="--k:0"><path pathLength="1" d="M12 3.5l8.5 8.5-8.5 8.5L3.5 12z"/></g></g></svg>
