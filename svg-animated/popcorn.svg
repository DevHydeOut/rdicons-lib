<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-popcorn" data-rd-animate="hover"><style>.rd-a-popcorn{overflow:visible}.rd-a-popcorn *{transform-box:view-box}@media (prefers-reduced-motion:no-preference){.rd-a-popcorn[data-rd-animate="hover"]:hover .a,:hover>.rd-a-popcorn[data-rd-animate="parent"] .a,.rd-a-popcorn[data-rd-animate="play"] .a,.rd-a-popcorn[data-rd-animate="loop"] .a{animation:rd-popcorn-m calc(0.8s*var(--rd-speed,1)) ease-in-out}.rd-a-popcorn[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-popcorn-m{0%,100%{translate:0 0}30%{translate:0 -3px}55%{translate:0 0}72%{translate:0 -1px}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><path d="M6 10.5l1.5 10h9l1.5-10z"/><path d="M10 10.5l.5 10M14 10.5l-.5 10"/><circle cx="8" cy="8" r="2.2"/><circle cx="12" cy="7" r="2.5"/><circle cx="16" cy="8" r="2.2"/></g></g></svg>
