<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-parentheses" data-rd-animate="hover"><style>.rd-a-parentheses{overflow:visible}.rd-a-parentheses *{transform-box:view-box}.rd-a-parentheses .d{stroke-dasharray:1 2}@media (prefers-reduced-motion:no-preference){.rd-a-parentheses[data-rd-animate="hover"]:hover .d,:hover>.rd-a-parentheses[data-rd-animate="parent"] .d,.rd-a-parentheses[data-rd-animate="play"] .d,.rd-a-parentheses[data-rd-animate="loop"] .d{animation:rd-parentheses-draw calc(0.75s*var(--rd-speed,1)) ease-out;animation-delay:calc(var(--k)*.1s*var(--rd-speed,1))}.rd-a-parentheses[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-parentheses-draw{0%{stroke-dashoffset:1.2}100%{stroke-dashoffset:0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="d" style="--k:0"><path pathLength="1" d="M9 4.5c-3 4-3 11 0 15"/></g><g class="d" style="--k:1"><path pathLength="1" d="M15 4.5c3 4 3 11 0 15"/></g></g></svg>
