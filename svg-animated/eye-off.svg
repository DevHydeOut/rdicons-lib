<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-eye-off" data-rd-animate="hover"><style>.rd-a-eye-off{overflow:visible}.rd-a-eye-off *{transform-box:view-box}.rd-a-eye-off .p0{stroke-dasharray:1 2}.rd-a-eye-off .p1{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:no-preference){.rd-a-eye-off[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-eye-off[data-rd-animate="parent"] .p0,.rd-a-eye-off[data-rd-animate="play"] .p0,.rd-a-eye-off[data-rd-animate="loop"] .p0{animation:rd-eye-off-f0 calc(0.75s*var(--rd-speed,1)) ease-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-eye-off[data-rd-animate="hover"]:hover .p1,:hover>.rd-a-eye-off[data-rd-animate="parent"] .p1,.rd-a-eye-off[data-rd-animate="play"] .p1,.rd-a-eye-off[data-rd-animate="loop"] .p1{animation:rd-eye-off-f1 calc(0.5s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-eye-off[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-eye-off-f0{0%{stroke-dashoffset:1.2}100%{stroke-dashoffset:0}}@keyframes rd-eye-off-f1{0%,100%{scale:1 1}45%{scale:1 .1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><path d="M3 12c2-4 5-6.5 9-6.5s7 2.5 9 6.5c-2 4-5 6.5-9 6.5S5 16 3 12z"/><g><g class="p0" style="--k:0;--s:1"><path pathLength="1" d="M4.5 4.5l15 15"/></g></g><g><g class="p1" style="--k:0;--s:1"><circle cx="12" cy="12" r="3"/></g></g></g></svg>
