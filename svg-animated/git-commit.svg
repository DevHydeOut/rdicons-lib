<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-git-commit" data-rd-animate="hover"><style>.rd-a-git-commit{overflow:visible}.rd-a-git-commit *{transform-box:view-box}.rd-a-git-commit .a{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-git-commit[data-rd-animate="hover"]:hover .a,:hover>.rd-a-git-commit[data-rd-animate="parent"] .a,.rd-a-git-commit[data-rd-animate="play"] .a,.rd-a-git-commit[data-rd-animate="loop"] .a{animation:rd-git-commit-m calc(0.7s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-git-commit[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-git-commit-m{0%,100%{scale:1}35%{scale:.88}65%{scale:1.1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><circle cx="12" cy="12" r="3.5"/><path d="M3.5 12h5M15.5 12h5"/></g></g></svg>
