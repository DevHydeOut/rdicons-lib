<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-git-commit" data-rd-animate="hover"><style>.rd-a-git-commit{overflow:visible}.rd-a-git-commit *{transform-box:view-box}.rd-a-git-commit .p0{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:no-preference){.rd-a-git-commit[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-git-commit[data-rd-animate="parent"] .p0,.rd-a-git-commit[data-rd-animate="play"] .p0,.rd-a-git-commit[data-rd-animate="loop"] .p0{animation:rd-git-commit-f0 calc(0.8s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-git-commit[data-rd-animate="hover"]:hover .p1,:hover>.rd-a-git-commit[data-rd-animate="parent"] .p1,.rd-a-git-commit[data-rd-animate="play"] .p1,.rd-a-git-commit[data-rd-animate="loop"] .p1{animation:rd-git-commit-f1 calc(0.9s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-git-commit[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-git-commit-f0{0%,100%{scale:1}45%{scale:1.08}}@keyframes rd-git-commit-f1{0%,100%{translate:0 0}50%{translate:calc(var(--s)*2.6px) 0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g><g class="p0" style="--k:0;--s:1"><circle cx="12" cy="12" r="3.5"/></g></g><g><g class="p1" style="--k:0;--s:1"><path d="M3.5 12h5"/></g><g class="p1" style="--k:1;--s:-1"><path d="M15.5 12h5"/></g></g></g></svg>
