<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-login" data-rd-animate="hover"><style>.rd-a-login{overflow:visible}.rd-a-login *{transform-box:view-box}.rd-a-login .d{stroke-dasharray:1 2}@media (prefers-reduced-motion:no-preference){.rd-a-login[data-rd-animate="hover"]:hover .d,:hover>.rd-a-login[data-rd-animate="parent"] .d,.rd-a-login[data-rd-animate="play"] .d,.rd-a-login[data-rd-animate="loop"] .d{animation:rd-login-draw calc(0.75s*var(--rd-speed,1)) ease-out;animation-delay:calc(var(--k)*.1s*var(--rd-speed,1))}.rd-a-login[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-login-draw{0%{stroke-dashoffset:1.2}100%{stroke-dashoffset:0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="d" style="--k:0"><path pathLength="1" d="M14 20h3.5a2.5 2.5 0 0 0 2.5-2.5v-11A2.5 2.5 0 0 0 17.5 4H14"/></g><g class="d" style="--k:1"><path pathLength="1" d="M9.5 8l-4 4 4 4"/></g><g class="d" style="--k:2"><path pathLength="1" d="M5.5 12H15"/></g></g></svg>
