<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-upload-cloud" data-rd-animate="hover"><style>.rd-a-upload-cloud{overflow:visible}.rd-a-upload-cloud *{transform-box:view-box}@media (prefers-reduced-motion:no-preference){.rd-a-upload-cloud[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-upload-cloud[data-rd-animate="parent"] .p0,.rd-a-upload-cloud[data-rd-animate="play"] .p0,.rd-a-upload-cloud[data-rd-animate="loop"] .p0{animation:rd-upload-cloud-f0 calc(1s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-upload-cloud[data-rd-animate="hover"]:hover .p1,:hover>.rd-a-upload-cloud[data-rd-animate="parent"] .p1,.rd-a-upload-cloud[data-rd-animate="play"] .p1,.rd-a-upload-cloud[data-rd-animate="loop"] .p1{animation:rd-upload-cloud-f1 calc(0.8s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1);animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-upload-cloud[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-upload-cloud-f0{0%,100%{translate:0 0}50%{translate:0 -2px}}@keyframes rd-upload-cloud-f1{0%,100%{translate:0 0}40%{translate:0 -2.6px}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g><g class="p0" style="--k:0;--s:1"><path d="M7 17.5a3.5 3.5 0 0 1-.4-7 5.5 5.5 0 0 1 10.8-.7A3.6 3.6 0 0 1 17 17.5"/></g></g><g><g class="p1" style="--k:0;--s:1"><path d="M12 19v-8.5M8.5 14l3.5-3.5 3.5 3.5"/></g></g></g></svg>
