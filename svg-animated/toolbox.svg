<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-toolbox" data-rd-animate="hover"><style>.rd-a-toolbox{overflow:visible}.rd-a-toolbox *{transform-box:view-box}.rd-a-toolbox .p1{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:no-preference){.rd-a-toolbox[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-toolbox[data-rd-animate="parent"] .p0,.rd-a-toolbox[data-rd-animate="play"] .p0,.rd-a-toolbox[data-rd-animate="loop"] .p0{animation:rd-toolbox-f0 calc(0.7s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1);animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-toolbox[data-rd-animate="hover"]:hover .p1,:hover>.rd-a-toolbox[data-rd-animate="parent"] .p1,.rd-a-toolbox[data-rd-animate="play"] .p1,.rd-a-toolbox[data-rd-animate="loop"] .p1{animation:rd-toolbox-f1 calc(0.5s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1);animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-toolbox[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-toolbox-f0{0%,100%{translate:0 0}40%{translate:0 -2px}}@keyframes rd-toolbox-f1{0%,100%{scale:1}40%{scale:1.5}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><rect x="3.5" y="8" width="17" height="12.5" rx="3"/><path d="M3.5 13.5h17"/><g><g class="p0" style="--k:0;--s:1"><path d="M9 8V6a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></g></g><g><g class="p1" style="--k:0;--s:1"><rect x="10.5" y="12" width="3" height="3" rx="1"/></g></g></g></svg>
