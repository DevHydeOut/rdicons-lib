<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-share" data-rd-animate="hover"><style>.rd-a-share{overflow:visible}.rd-a-share *{transform-box:view-box}.rd-a-share .p0{transform-box:fill-box;transform-origin:center}.rd-a-share .p1{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:no-preference){.rd-a-share[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-share[data-rd-animate="parent"] .p0,.rd-a-share[data-rd-animate="play"] .p0,.rd-a-share[data-rd-animate="loop"] .p0{animation:rd-share-f0 calc(0.5s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1);animation-delay:calc((0s + var(--k)*0.12s)*var(--rd-speed,1))}.rd-a-share[data-rd-animate="hover"]:hover .p1,:hover>.rd-a-share[data-rd-animate="parent"] .p1,.rd-a-share[data-rd-animate="play"] .p1,.rd-a-share[data-rd-animate="loop"] .p1{animation:rd-share-f1 calc(0.5s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1);animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-share[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-share-f0{0%,100%{scale:1}40%{scale:1.5}}@keyframes rd-share-f1{0%,100%{scale:1}40%{scale:1.5}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><path d="M8.2 10.8l7.6-3.6M8.2 13.2l7.6 3.6"/><g><g class="p0" style="--k:0;--s:1"><circle cx="18" cy="6" r="2.5"/></g><g class="p0" style="--k:1;--s:1"><circle cx="18" cy="18" r="2.5"/></g></g><g><g class="p1" style="--k:0;--s:1"><circle cx="6" cy="12" r="2.5"/></g></g></g></svg>
