<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-map-pin" data-rd-animate="hover"><style>.rd-a-map-pin{overflow:visible}.rd-a-map-pin *{transform-box:view-box}.rd-a-map-pin .pin{transform-origin:12px 21px}.rd-a-map-pin .dot{transform-origin:12px 10px}@media (prefers-reduced-motion:no-preference){.rd-a-map-pin[data-rd-animate="hover"]:hover .pin,:hover>.rd-a-map-pin[data-rd-animate="parent"] .pin,.rd-a-map-pin[data-rd-animate="play"] .pin,.rd-a-map-pin[data-rd-animate="loop"] .pin{animation:rd-map-pin-hop calc(0.8s*var(--rd-speed,1)) ease-out}.rd-a-map-pin[data-rd-animate="hover"]:hover .dot,:hover>.rd-a-map-pin[data-rd-animate="parent"] .dot,.rd-a-map-pin[data-rd-animate="play"] .dot,.rd-a-map-pin[data-rd-animate="loop"] .dot{animation:rd-map-pin-dot calc(0.8s*var(--rd-speed,1)) ease-in-out}.rd-a-map-pin[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-map-pin-hop{0%,100%{translate:0 0;scale:1 1}30%{translate:0 -3.5px;scale:.94 1.06}55%{translate:0 0;scale:1.08 .92}75%{translate:0 -1px;scale:1 1}}@keyframes rd-map-pin-dot{0%,100%{scale:1}40%{scale:.4}60%{scale:1.3}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="pin"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle class="dot" cx="12" cy="10" r="2.4"/></g></g></svg>
