<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-sigma" data-rd-animate="hover"><style>.rd-a-sigma{overflow:visible}.rd-a-sigma *{transform-box:view-box}.rd-a-sigma .d{stroke-dasharray:1 2}@media (prefers-reduced-motion:no-preference){.rd-a-sigma[data-rd-animate="hover"]:hover .d,:hover>.rd-a-sigma[data-rd-animate="parent"] .d,.rd-a-sigma[data-rd-animate="play"] .d,.rd-a-sigma[data-rd-animate="loop"] .d{animation:rd-sigma-draw calc(0.75s*var(--rd-speed,1)) ease-out;animation-delay:calc(var(--k)*.1s*var(--rd-speed,1))}.rd-a-sigma[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-sigma-draw{0%{stroke-dashoffset:1.2}100%{stroke-dashoffset:0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="d" style="--k:0"><path pathLength="1" d="M18 4.5H6.5l6 7.5-6 7.5H18"/></g></g></svg>
