<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-traffic-cone" data-rd-animate="hover"><style>.rd-a-traffic-cone{overflow:visible}.rd-a-traffic-cone *{transform-box:view-box}.rd-a-traffic-cone .p0{transform-origin:12px 19px}@media (prefers-reduced-motion:no-preference){.rd-a-traffic-cone[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-traffic-cone[data-rd-animate="parent"] .p0,.rd-a-traffic-cone[data-rd-animate="play"] .p0,.rd-a-traffic-cone[data-rd-animate="loop"] .p0{animation:rd-traffic-cone-f0 calc(0.9s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-traffic-cone[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-traffic-cone-f0{0%,100%{rotate:0deg}35%{rotate:-7deg}70%{rotate:5deg}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><path d="M4.5 20h15"/><path d="M8.2 12h7.6M7 16h10"/><g><g class="p0" style="--k:0;--s:1"><path d="M10 4h4l4 15H6z"/></g></g></g></svg>
