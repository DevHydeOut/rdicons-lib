<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-ladder" data-rd-animate="hover"><style>.rd-a-ladder{overflow:visible}.rd-a-ladder *{transform-box:view-box}@media (prefers-reduced-motion:no-preference){.rd-a-ladder[data-rd-animate="hover"]:hover .a,:hover>.rd-a-ladder[data-rd-animate="parent"] .a,.rd-a-ladder[data-rd-animate="play"] .a,.rd-a-ladder[data-rd-animate="loop"] .a{animation:rd-ladder-m calc(0.7s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-ladder[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-ladder-m{0%,100%{translate:0 0}40%{translate:0 -2.6px}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><path d="M8 3.5v17M16 3.5v17"/><path d="M8 7.5h8M8 12h8M8 16.5h8"/></g></g></svg>
