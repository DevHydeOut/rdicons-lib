<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-bot" data-rd-animate="hover"><style>.rd-a-bot{overflow:visible}.rd-a-bot *{transform-box:view-box}.rd-a-bot .p0{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:no-preference){.rd-a-bot[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-bot[data-rd-animate="parent"] .p0,.rd-a-bot[data-rd-animate="play"] .p0,.rd-a-bot[data-rd-animate="loop"] .p0{animation:rd-bot-f0 calc(0.5s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-bot[data-rd-animate="hover"]:hover .p1,:hover>.rd-a-bot[data-rd-animate="parent"] .p1,.rd-a-bot[data-rd-animate="play"] .p1,.rd-a-bot[data-rd-animate="loop"] .p1{animation:rd-bot-f1 calc(0.7s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1);animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-bot[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-bot-f0{0%,100%{scale:1 1}45%{scale:1 .1}}@keyframes rd-bot-f1{0%,100%{translate:0 0}40%{translate:0 -2px}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><rect x="5" y="8" width="14" height="11" rx="4"/><path d="M10 16.5h4"/><path d="M2.5 13v2.5M21.5 13v2.5"/><g><g class="p0" style="--k:0;--s:1"><path d="M9 13.5h.01"/></g><g class="p0" style="--k:1;--s:1"><path d="M15 13.5h.01"/></g></g><g><g class="p1" style="--k:0;--s:1"><path d="M12 4.5V8"/></g></g></g></svg>
