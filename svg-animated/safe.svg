<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-safe" data-rd-animate="hover"><style>.rd-a-safe{overflow:visible}.rd-a-safe *{transform-box:view-box}.rd-a-safe .p0{transform-box:fill-box;transform-origin:center}.rd-a-safe .p1{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-safe[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-safe[data-rd-animate="parent"] .p0,.rd-a-safe[data-rd-animate="play"] .p0,.rd-a-safe[data-rd-animate="loop"] .p0{animation:rd-safe-f0 calc(0.8s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-safe[data-rd-animate="hover"]:hover .p1,:hover>.rd-a-safe[data-rd-animate="parent"] .p1,.rd-a-safe[data-rd-animate="play"] .p1,.rd-a-safe[data-rd-animate="loop"] .p1{animation:rd-safe-f1 calc(0.9s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-safe[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-safe-f0{0%,100%{scale:1;opacity:1}50%{scale:1.25;opacity:.3}}@keyframes rd-safe-f1{0%{rotate:0deg}100%{rotate:360deg}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><path d="M19.67 6.4A4 4 0 0 1 20 8V16A4 4 0 0 1 16 20H8A4 4 0 0 1 4 16V8A4 4 0 0 1 8 4H16A4 4 0 0 1 17.6 4.33"/><path d="M7.5 20v1.5M16.5 20v1.5"/><g><g class="p0" style="--k:0;--s:1"><circle cx="12" cy="12" r="3.5"/></g></g><g><g class="p1" style="--k:0;--s:1"><path d="M12 8.5v1.5"/></g></g></g></svg>
