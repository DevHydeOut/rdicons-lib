<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-balloon" data-rd-animate="hover"><style>.rd-a-balloon{overflow:visible}.rd-a-balloon *{transform-box:view-box}.rd-a-balloon .p0{transform-origin:12px 17.5px}.rd-a-balloon .p1{transform-origin:12px 17.5px}@media (prefers-reduced-motion:no-preference){.rd-a-balloon[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-balloon[data-rd-animate="parent"] .p0,.rd-a-balloon[data-rd-animate="play"] .p0,.rd-a-balloon[data-rd-animate="loop"] .p0{animation:rd-balloon-f0 calc(0.9s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-balloon[data-rd-animate="hover"]:hover .p1,:hover>.rd-a-balloon[data-rd-animate="parent"] .p1,.rd-a-balloon[data-rd-animate="play"] .p1,.rd-a-balloon[data-rd-animate="loop"] .p1{animation:rd-balloon-f1 calc(1s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-balloon[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-balloon-f0{0%,100%{rotate:0deg}35%{rotate:-7deg}70%{rotate:5deg}}@keyframes rd-balloon-f1{0%,100%{rotate:0deg}30%{rotate:calc(var(--s)*8deg)}65%{rotate:calc(var(--s)*-6deg)}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g><g class="p0" style="--k:0;--s:1"><path d="M12 3.5a6 6 0 0 1 6 6c0 4-3 7-6 8-3-1-6-4-6-8a6 6 0 0 1 6-6z"/></g></g><g><g class="p1" style="--k:0;--s:1"><path d="M12 17.5v4"/></g></g></g></svg>
