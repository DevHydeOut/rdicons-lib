<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-balloon" data-rd-animate="hover"><style>.rd-a-balloon{overflow:visible}.rd-a-balloon *{transform-box:view-box}.rd-a-balloon .a{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-balloon[data-rd-animate="hover"]:hover .a,:hover>.rd-a-balloon[data-rd-animate="parent"] .a,.rd-a-balloon[data-rd-animate="play"] .a,.rd-a-balloon[data-rd-animate="loop"] .a{animation:rd-balloon-m calc(0.8s*var(--rd-speed,1)) ease-in-out}.rd-a-balloon[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-balloon-m{0%,100%{scale:1}30%{scale:1.2}55%{scale:.95}75%{scale:1.07}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><path d="M12 3.5a6 6 0 0 1 6 6c0 4-3 7-6 8-3-1-6-4-6-8a6 6 0 0 1 6-6z"/><path d="M12 17.5v4"/></g></g></svg>
