<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-arrow-up" data-rd-animate="hover"><style>.rd-a-arrow-up{overflow:visible}.rd-a-arrow-up *{transform-box:view-box}@media (prefers-reduced-motion:no-preference){.rd-a-arrow-up[data-rd-animate="hover"]:hover .a,:hover>.rd-a-arrow-up[data-rd-animate="parent"] .a,.rd-a-arrow-up[data-rd-animate="play"] .a,.rd-a-arrow-up[data-rd-animate="loop"] .a{animation:rd-arrow-up-m calc(0.7s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-arrow-up[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-arrow-up-m{0%,100%{translate:0 0}40%{translate:0 -2.6px}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><path d="M12 19.5v-15M6 10.5l6-6 6 6"/></g></g></svg>
