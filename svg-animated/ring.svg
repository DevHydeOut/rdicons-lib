<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-ring" data-rd-animate="hover"><style>.rd-a-ring{overflow:visible}.rd-a-ring *{transform-box:view-box}.rd-a-ring .a{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-ring[data-rd-animate="hover"]:hover .a,:hover>.rd-a-ring[data-rd-animate="parent"] .a,.rd-a-ring[data-rd-animate="play"] .a,.rd-a-ring[data-rd-animate="loop"] .a{animation:rd-ring-m calc(0.7s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-ring[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-ring-m{0%,100%{scale:1}45%{scale:1.16}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><circle cx="12" cy="15" r="5.5"/><path d="M9.5 7l1.5-2.5h2L14.5 7 12 9.5z"/></g></g></svg>
