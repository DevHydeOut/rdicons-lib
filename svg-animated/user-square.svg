<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-user-square" data-rd-animate="hover"><style>.rd-a-user-square{overflow:visible}.rd-a-user-square *{transform-box:view-box}.rd-a-user-square .p0{transform-box:fill-box;transform-origin:center}.rd-a-user-square .p1{transform-origin:12px 19px}@media (prefers-reduced-motion:no-preference){.rd-a-user-square[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-user-square[data-rd-animate="parent"] .p0,.rd-a-user-square[data-rd-animate="play"] .p0,.rd-a-user-square[data-rd-animate="loop"] .p0{animation:rd-user-square-f0 calc(0.9s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-user-square[data-rd-animate="hover"]:hover .p1,:hover>.rd-a-user-square[data-rd-animate="parent"] .p1,.rd-a-user-square[data-rd-animate="play"] .p1,.rd-a-user-square[data-rd-animate="loop"] .p1{animation:rd-user-square-f1 calc(0.7s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1);animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-user-square[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-user-square-f0{0%,100%{translate:0 0}50%{translate:0 calc(var(--s)*1.8px)}}@keyframes rd-user-square-f1{0%,100%{scale:1 1}40%{scale:1.1 .86}70%{scale:.95 1.06}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><path d="M20.17 5.9A4 4 0 0 1 20.5 7.5V16.5A4 4 0 0 1 16.5 20.5H7.5A4 4 0 0 1 3.5 16.5V7.5A4 4 0 0 1 7.5 3.5H16.5A4 4 0 0 1 18.1 3.83"/><g><g class="p0" style="--k:0;--s:1"><circle cx="12" cy="10" r="3"/></g></g><g><g class="p1" style="--k:0;--s:1"><path d="M6.5 19c1-2.5 3-3.5 5.5-3.5s4.5 1 5.5 3.5"/></g></g></g></svg>
