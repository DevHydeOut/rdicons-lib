<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-cloud-alert" data-rd-animate="hover"><style>.rd-a-cloud-alert{overflow:visible}.rd-a-cloud-alert *{transform-box:view-box}.rd-a-cloud-alert .base{transform-origin:12px 12px}.rd-a-cloud-alert .badge{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:no-preference){.rd-a-cloud-alert[data-rd-animate="hover"]:hover .base,:hover>.rd-a-cloud-alert[data-rd-animate="parent"] .base,.rd-a-cloud-alert[data-rd-animate="play"] .base,.rd-a-cloud-alert[data-rd-animate="loop"] .base{animation:rd-cloud-alert-base calc(0.7s*var(--rd-speed,1)) ease-in-out}.rd-a-cloud-alert[data-rd-animate="hover"]:hover .badge,:hover>.rd-a-cloud-alert[data-rd-animate="parent"] .badge,.rd-a-cloud-alert[data-rd-animate="play"] .badge,.rd-a-cloud-alert[data-rd-animate="loop"] .badge{animation:rd-cloud-alert-badge calc(0.8s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-cloud-alert[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-cloud-alert-base{0%,100%{scale:1}40%{scale:.96}}@keyframes rd-cloud-alert-badge{0%,100%{scale:1;opacity:1}22%{scale:.1;opacity:0}62%{scale:1.3;opacity:1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="base"><path d="M6.4 19.5a4.5 4.5 0 0 1 -0.7 -8.9a6 6 0 0 1 11.5 -1.1a4.5 4.5 0 0 1 -0.8 10z"/></g><g class="badge"><path d="M12 11.5v3"/><path d="M12 17h.01"/></g></g></svg>
