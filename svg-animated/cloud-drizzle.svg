<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-cloud-drizzle" data-rd-animate="hover"><style>.rd-a-cloud-drizzle{overflow:visible}.rd-a-cloud-drizzle *{transform-box:view-box}@media (prefers-reduced-motion:no-preference){.rd-a-cloud-drizzle[data-rd-animate="hover"]:hover .drops,:hover>.rd-a-cloud-drizzle[data-rd-animate="parent"] .drops,.rd-a-cloud-drizzle[data-rd-animate="play"] .drops,.rd-a-cloud-drizzle[data-rd-animate="loop"] .drops{animation:rd-cloud-drizzle-m calc(0.9s*var(--rd-speed,1)) ease-in-out}.rd-a-cloud-drizzle[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-cloud-drizzle-m{0%,100%{translate:0 0;opacity:1}40%{translate:0 2.5px;opacity:.15}60%{translate:0 -1px;opacity:1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><path d="M7 14a4.5 4.5 0 0 1-.7-8.9 6 6 0 0 1 11.5-1.1A4.5 4.5 0 0 1 17 14"/><g class="drops"><path d="M8 17v1M12 17v1M16 17v1M10 20.5v1M14 20.5v1"/></g></g></svg>
