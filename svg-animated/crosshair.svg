<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-crosshair" data-rd-animate="hover"><style>.rd-a-crosshair{overflow:visible}.rd-a-crosshair *{transform-box:view-box}.rd-a-crosshair .ticks{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-crosshair[data-rd-animate="hover"]:hover .ticks,:hover>.rd-a-crosshair[data-rd-animate="parent"] .ticks,.rd-a-crosshair[data-rd-animate="play"] .ticks,.rd-a-crosshair[data-rd-animate="loop"] .ticks{animation:rd-crosshair-in calc(0.8s*var(--rd-speed,1)) ease-in-out}.rd-a-crosshair[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-crosshair-in{0%,100%{scale:1}40%{scale:.72}70%{scale:1.06}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><circle cx="12" cy="12" r="8"/><path class="ticks" d="M12 2.5v4M12 17.5v4M2.5 12h4M17.5 12h4"/></g></svg>
