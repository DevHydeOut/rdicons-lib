<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-radar-chart" data-rd-animate="hover"><style>.rd-a-radar-chart{overflow:visible}.rd-a-radar-chart *{transform-box:view-box}.rd-a-radar-chart .p0{stroke-dasharray:1 2}.rd-a-radar-chart .p1{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-radar-chart[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-radar-chart[data-rd-animate="parent"] .p0,.rd-a-radar-chart[data-rd-animate="play"] .p0,.rd-a-radar-chart[data-rd-animate="loop"] .p0{animation:rd-radar-chart-f0 calc(0.75s*var(--rd-speed,1)) ease-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-radar-chart[data-rd-animate="hover"]:hover .p1,:hover>.rd-a-radar-chart[data-rd-animate="parent"] .p1,.rd-a-radar-chart[data-rd-animate="play"] .p1,.rd-a-radar-chart[data-rd-animate="loop"] .p1{animation:rd-radar-chart-f1 calc(0.8s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-radar-chart[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-radar-chart-f0{0%{stroke-dashoffset:1.2}100%{stroke-dashoffset:0}}@keyframes rd-radar-chart-f1{0%,100%{scale:1}45%{scale:1.08}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g><g class="p0" style="--k:0;--s:1"><path pathLength="1" d="M12 12V3.5M12 12l8.5-2.3M12 12l5.3 8M12 12L6.7 20M12 12L3.5 9.7"/></g></g><g><g class="p1" style="--k:0;--s:1"><path d="M12 3.5l8.5 6.2-3.2 10.3H6.7L3.5 9.7z"/></g></g></g></svg>
