<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-diameter" data-rd-animate="hover"><style>.rd-a-diameter{overflow:visible}.rd-a-diameter *{transform-box:view-box}.rd-a-diameter .a{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-diameter[data-rd-animate="hover"]:hover .a,:hover>.rd-a-diameter[data-rd-animate="parent"] .a,.rd-a-diameter[data-rd-animate="play"] .a,.rd-a-diameter[data-rd-animate="loop"] .a{animation:rd-diameter-m calc(0.9s*var(--rd-speed,1)) ease-in-out}.rd-a-diameter[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-diameter-m{0%{rotate:0deg}100%{rotate:360deg}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><circle cx="12" cy="12" r="5.5"/><path d="M4.5 19.5l15-15"/></g></g></svg>
