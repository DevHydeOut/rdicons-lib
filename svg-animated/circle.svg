<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-circle" data-rd-animate="hover"><style>.rd-a-circle{overflow:visible}.rd-a-circle *{transform-box:view-box}.rd-a-circle .d{stroke-dasharray:1 2}@media (prefers-reduced-motion:no-preference){.rd-a-circle[data-rd-animate="hover"]:hover .d,:hover>.rd-a-circle[data-rd-animate="parent"] .d,.rd-a-circle[data-rd-animate="play"] .d,.rd-a-circle[data-rd-animate="loop"] .d{animation:rd-circle-draw calc(0.75s*var(--rd-speed,1)) ease-out;animation-delay:calc(var(--k)*.1s*var(--rd-speed,1))}.rd-a-circle[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-circle-draw{0%{stroke-dashoffset:1.2}100%{stroke-dashoffset:0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="d" style="--k:0"><circle pathLength="1" cx="12" cy="12" r="8.5"/></g></g></svg>
