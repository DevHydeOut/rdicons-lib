<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-heart-pulse" data-rd-animate="hover"><style>.rd-a-heart-pulse{overflow:visible}.rd-a-heart-pulse *{transform-box:view-box}.rd-a-heart-pulse .p0{stroke-dasharray:1 2}.rd-a-heart-pulse .p1{transform-origin:12px 13px}@media (prefers-reduced-motion:no-preference){.rd-a-heart-pulse[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-heart-pulse[data-rd-animate="parent"] .p0,.rd-a-heart-pulse[data-rd-animate="play"] .p0,.rd-a-heart-pulse[data-rd-animate="loop"] .p0{animation:rd-heart-pulse-f0 calc(0.75s*var(--rd-speed,1)) ease-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-heart-pulse[data-rd-animate="hover"]:hover .p1,:hover>.rd-a-heart-pulse[data-rd-animate="parent"] .p1,.rd-a-heart-pulse[data-rd-animate="play"] .p1,.rd-a-heart-pulse[data-rd-animate="loop"] .p1{animation:rd-heart-pulse-f1 calc(0.8s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-heart-pulse[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-heart-pulse-f0{0%{stroke-dashoffset:1.2}100%{stroke-dashoffset:0}}@keyframes rd-heart-pulse-f1{0%,100%{scale:1}45%{scale:1.08}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g><g class="p0" style="--k:0;--s:1"><path pathLength="1" d="M7 12h2.5l1.5-3 2 6 1.5-3H17"/></g></g><g><g class="p1" style="--k:0;--s:1"><path d="M12 20.2s-8-4.7-8-10.5A4.5 4.5 0 0 1 12 7a4.5 4.5 0 0 1 8 2.7c0 5.8-8 10.5-8 10.5z"/></g></g></g></svg>
