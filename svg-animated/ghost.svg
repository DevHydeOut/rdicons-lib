<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-ghost" data-rd-animate="hover"><style>.rd-a-ghost{overflow:visible}.rd-a-ghost *{transform-box:view-box}.rd-a-ghost .p1{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:no-preference){.rd-a-ghost[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-ghost[data-rd-animate="parent"] .p0,.rd-a-ghost[data-rd-animate="play"] .p0,.rd-a-ghost[data-rd-animate="loop"] .p0{animation:rd-ghost-f0 calc(1s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-ghost[data-rd-animate="hover"]:hover .p1,:hover>.rd-a-ghost[data-rd-animate="parent"] .p1,.rd-a-ghost[data-rd-animate="play"] .p1,.rd-a-ghost[data-rd-animate="loop"] .p1{animation:rd-ghost-f1 calc(0.5s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-ghost[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-ghost-f0{0%,100%{translate:0 0}50%{translate:0 -2px}}@keyframes rd-ghost-f1{0%,100%{scale:1 1}45%{scale:1 .1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g><g class="p0" style="--k:0;--s:1"><path d="M5.5 20.5v-10a6.5 6.5 0 0 1 13 0v10l-2.2-2-2.1 2-2.2-2-2.2 2-2.1-2z"/></g></g><g><g class="p1" style="--k:0;--s:1"><path d="M9.5 10.5h.01"/></g><g class="p1" style="--k:1;--s:1"><path d="M14.5 10.5h.01"/></g></g></g></svg>
