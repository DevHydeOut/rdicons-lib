<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-check-circle" data-rd-animate="hover"><style>.rd-a-check-circle{overflow:visible}.rd-a-check-circle *{transform-box:view-box}.rd-a-check-circle .draw{stroke-dasharray:1 2;stroke-dashoffset:0}@media (prefers-reduced-motion:no-preference){.rd-a-check-circle[data-rd-animate="hover"]:hover .ring,:hover>.rd-a-check-circle[data-rd-animate="parent"] .ring,.rd-a-check-circle[data-rd-animate="play"] .ring,.rd-a-check-circle[data-rd-animate="loop"] .ring{animation:rd-check-circle-draw calc(0.6s*var(--rd-speed,1)) ease-out}.rd-a-check-circle[data-rd-animate="hover"]:hover .tick,:hover>.rd-a-check-circle[data-rd-animate="parent"] .tick,.rd-a-check-circle[data-rd-animate="play"] .tick,.rd-a-check-circle[data-rd-animate="loop"] .tick{animation:rd-check-circle-draw calc(0.4s*var(--rd-speed,1)) ease-out calc(0.35s*var(--rd-speed,1)) backwards}.rd-a-check-circle[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-check-circle-draw{0%{stroke-dashoffset:1}100%{stroke-dashoffset:0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><circle class="draw ring" pathLength="1" cx="12" cy="12" r="8.5"/><path class="draw tick" pathLength="1" d="M8 12.3l2.8 2.8L16 9.5"/></g></svg>
