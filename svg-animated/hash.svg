<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-hash" data-rd-animate="hover"><style>.rd-a-hash{overflow:visible}.rd-a-hash *{transform-box:view-box}.rd-a-hash .a{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-hash[data-rd-animate="hover"]:hover .a,:hover>.rd-a-hash[data-rd-animate="parent"] .a,.rd-a-hash[data-rd-animate="play"] .a,.rd-a-hash[data-rd-animate="loop"] .a{animation:rd-hash-m calc(0.7s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-hash[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-hash-m{0%,100%{scale:1}35%{scale:.88}65%{scale:1.1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><path d="M5 9h14M5 15h14M10 4.5L8 19.5M16 4.5l-2 15"/></g></g></svg>
