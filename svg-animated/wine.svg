<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-wine" data-rd-animate="hover"><style>.rd-a-wine{overflow:visible}.rd-a-wine *{transform-box:view-box}.rd-a-wine .p0{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-wine[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-wine[data-rd-animate="parent"] .p0,.rd-a-wine[data-rd-animate="play"] .p0,.rd-a-wine[data-rd-animate="loop"] .p0{animation:rd-wine-f0 calc(0.9s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-wine[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-wine-f0{0%,100%{rotate:0deg}35%{rotate:-7deg}70%{rotate:5deg}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><path d="M12 12.5V20M8.5 20.5h7M8 8h8"/><g><g class="p0" style="--k:0;--s:1"><path d="M8 3.5h8v5a4 4 0 0 1-8 0z"/></g></g></g></svg>
