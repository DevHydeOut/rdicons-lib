<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-shopping-basket" data-rd-animate="hover"><style>.rd-a-shopping-basket{overflow:visible}.rd-a-shopping-basket *{transform-box:view-box}.rd-a-shopping-basket .p0{transform-origin:12px 19px}.rd-a-shopping-basket .p1{transform-origin:12px 9.5px}@media (prefers-reduced-motion:no-preference){.rd-a-shopping-basket[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-shopping-basket[data-rd-animate="parent"] .p0,.rd-a-shopping-basket[data-rd-animate="play"] .p0,.rd-a-shopping-basket[data-rd-animate="loop"] .p0{animation:rd-shopping-basket-f0 calc(0.7s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1);animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-shopping-basket[data-rd-animate="hover"]:hover .p1,:hover>.rd-a-shopping-basket[data-rd-animate="parent"] .p1,.rd-a-shopping-basket[data-rd-animate="play"] .p1,.rd-a-shopping-basket[data-rd-animate="loop"] .p1{animation:rd-shopping-basket-f1 calc(1s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-shopping-basket[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-shopping-basket-f0{0%,100%{scale:1 1}40%{scale:1.1 .86}70%{scale:.95 1.06}}@keyframes rd-shopping-basket-f1{0%,100%{rotate:0deg}30%{rotate:calc(var(--s)*8deg)}65%{rotate:calc(var(--s)*-6deg)}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><path d="M9.5 13v3.5M14.5 13v3.5"/><g><g class="p0" style="--k:0;--s:1"><path d="M4 9.5h16l-1.5 9a2 2 0 0 1-2 1.5H7.5a2 2 0 0 1-2-1.5z"/></g></g><g><g class="p1" style="--k:0;--s:1"><path d="M8 9.5l3-5M16 9.5l-3-5"/></g></g></g></svg>
