<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-road" data-rd-animate="hover"><style>.rd-a-road{overflow:visible}.rd-a-road *{transform-box:view-box}@media (prefers-reduced-motion:no-preference){.rd-a-road[data-rd-animate="hover"]:hover .a,:hover>.rd-a-road[data-rd-animate="parent"] .a,.rd-a-road[data-rd-animate="play"] .a,.rd-a-road[data-rd-animate="loop"] .a{animation:rd-road-m calc(0.8s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-road[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-road-m{0%,100%{translate:0 0}40%{translate:0 -2.6px}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><path d="M8.5 3.5L4.5 20.5M15.5 3.5l4 17"/><path d="M12 4.5v3M12 10.5v3M12 16.5v3.5"/></g></g></svg>
