<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-text-cursor" data-rd-animate="hover"><style>.rd-a-text-cursor{overflow:visible}.rd-a-text-cursor *{transform-box:view-box}.rd-a-text-cursor .a{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-text-cursor[data-rd-animate="hover"]:hover .a,:hover>.rd-a-text-cursor[data-rd-animate="parent"] .a,.rd-a-text-cursor[data-rd-animate="play"] .a,.rd-a-text-cursor[data-rd-animate="loop"] .a{animation:rd-text-cursor-m calc(0.7s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-text-cursor[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-text-cursor-m{0%,100%{scale:1}35%{scale:.88}65%{scale:1.1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><path d="M9 4.5h6M12 4.5v15M9 19.5h6"/></g></g></svg>
