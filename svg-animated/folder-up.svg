<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-folder-up" data-rd-animate="hover"><style>.rd-a-folder-up{overflow:visible}.rd-a-folder-up *{transform-box:view-box}.rd-a-folder-up .base{transform-origin:12px 12px}.rd-a-folder-up .badge{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:no-preference){.rd-a-folder-up[data-rd-animate="hover"]:hover .base,:hover>.rd-a-folder-up[data-rd-animate="parent"] .base,.rd-a-folder-up[data-rd-animate="play"] .base,.rd-a-folder-up[data-rd-animate="loop"] .base{animation:rd-folder-up-base calc(0.7s*var(--rd-speed,1)) ease-in-out}.rd-a-folder-up[data-rd-animate="hover"]:hover .badge,:hover>.rd-a-folder-up[data-rd-animate="parent"] .badge,.rd-a-folder-up[data-rd-animate="play"] .badge,.rd-a-folder-up[data-rd-animate="loop"] .badge{animation:rd-folder-up-badge calc(0.8s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-folder-up[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-folder-up-base{0%,100%{scale:1}40%{scale:.96}}@keyframes rd-folder-up-badge{0%,100%{translate:0 0}35%{translate:0 -2px}65%{translate:0 0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="base"><path d="M20.13 8.61A4 4 0 0 1 20.5 10.3v6.2a4 4 0 0 1-4 4h-9a4 4 0 0 1-4-4v-9a4 4 0 0 1 4-4h1.6a3 3 0 0 1 2.2 1l.7.8a3 3 0 0 0 2.2 1h2.3a4 4 0 0 1 1.69.37"/></g><g class="badge"><path d="M12 17v-5.5M9.5 13.5l2.5-2.5 2.5 2.5"/></g></g></svg>
