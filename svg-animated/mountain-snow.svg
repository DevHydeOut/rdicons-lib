<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-mountain-snow" data-rd-animate="hover"><style>.rd-a-mountain-snow{overflow:visible}.rd-a-mountain-snow *{transform-box:view-box}.rd-a-mountain-snow .base{transform-origin:12px 12px}.rd-a-mountain-snow .badge{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:no-preference){.rd-a-mountain-snow[data-rd-animate="hover"]:hover .base,:hover>.rd-a-mountain-snow[data-rd-animate="parent"] .base,.rd-a-mountain-snow[data-rd-animate="play"] .base,.rd-a-mountain-snow[data-rd-animate="loop"] .base{animation:rd-mountain-snow-base calc(0.7s*var(--rd-speed,1)) ease-in-out}.rd-a-mountain-snow[data-rd-animate="hover"]:hover .badge,:hover>.rd-a-mountain-snow[data-rd-animate="parent"] .badge,.rd-a-mountain-snow[data-rd-animate="play"] .badge,.rd-a-mountain-snow[data-rd-animate="loop"] .badge{animation:rd-mountain-snow-badge calc(0.8s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-mountain-snow[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-mountain-snow-base{0%,100%{scale:1}40%{scale:.96}}@keyframes rd-mountain-snow-badge{0%,100%{scale:1;opacity:1}22%{scale:.1;opacity:0}62%{scale:1.3;opacity:1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="base"><path d="M2.5 19.5l6.5-11 4 6.5 2-3.2 6 7.7z"/></g><g class="badge"><path d="M6.7 12.8l2.3-1.8 1.5 1.3 1.7-1.7"/></g></g></svg>
