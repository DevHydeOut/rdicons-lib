<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-timer" data-rd-animate="hover"><style>.rd-a-timer{overflow:visible}.rd-a-timer *{transform-box:view-box}.rd-a-timer .hand{transform-origin:12px 13.5px}@media (prefers-reduced-motion:no-preference){.rd-a-timer[data-rd-animate="hover"]:hover .hand,:hover>.rd-a-timer[data-rd-animate="parent"] .hand,.rd-a-timer[data-rd-animate="play"] .hand,.rd-a-timer[data-rd-animate="loop"] .hand{animation:rd-timer-m calc(0.9s*var(--rd-speed,1)) ease-in-out}.rd-a-timer[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-timer-m{0%{rotate:0deg}100%{rotate:360deg}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><circle cx="12" cy="13.5" r="7.5"/><path d="M10 2.5h4M12 2.5v3.5"/><path class="hand" d="M12 13.5l2.5-2.5"/></g></svg>
