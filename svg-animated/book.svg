<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-book" data-rd-animate="hover"><style>.rd-a-book{overflow:visible}.rd-a-book *{transform-box:view-box}.rd-a-book .p0{transform-origin:12px 20px}@media (prefers-reduced-motion:no-preference){.rd-a-book[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-book[data-rd-animate="parent"] .p0,.rd-a-book[data-rd-animate="play"] .p0,.rd-a-book[data-rd-animate="loop"] .p0{animation:rd-book-f0 calc(0.7s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1);animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-book[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-book-f0{0%,100%{scale:1 1}40%{scale:1.1 .86}70%{scale:.95 1.06}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><path d="M4.5 19a2 2 0 0 0 2 2h13"/><g><g class="p0" style="--k:0;--s:1"><path d="M4.5 5.5A2 2 0 0 1 6.5 3.5H19.5V17H6.5a2 2 0 0 0-2 2z"/></g></g></g></svg>
