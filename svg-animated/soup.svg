<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-soup" data-rd-animate="hover"><style>.rd-a-soup{overflow:visible}.rd-a-soup *{transform-box:view-box}.rd-a-soup .p1{transform-origin:12px 19px}@media (prefers-reduced-motion:no-preference){.rd-a-soup[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-soup[data-rd-animate="parent"] .p0,.rd-a-soup[data-rd-animate="play"] .p0,.rd-a-soup[data-rd-animate="loop"] .p0{animation:rd-soup-f0 calc(1s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0.15s)*var(--rd-speed,1))}.rd-a-soup[data-rd-animate="hover"]:hover .p1,:hover>.rd-a-soup[data-rd-animate="parent"] .p1,.rd-a-soup[data-rd-animate="play"] .p1,.rd-a-soup[data-rd-animate="loop"] .p1{animation:rd-soup-f1 calc(0.7s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1);animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-soup[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-soup-f0{0%,100%{translate:0 0;opacity:1}50%{translate:0 -2px;opacity:.2}}@keyframes rd-soup-f1{0%,100%{scale:1 1}40%{scale:1.1 .86}70%{scale:.95 1.06}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g><g class="p0" style="--k:0;--s:1"><path d="M8 8.5c.6-.8.6-1.7 0-2.5"/></g><g class="p0" style="--k:1;--s:1"><path d="M12 8.5c.6-.8.6-1.7 0-2.5"/></g><g class="p0" style="--k:2;--s:1"><path d="M16 8.5c.6-.8.6-1.7 0-2.5"/></g></g><g><g class="p1" style="--k:0;--s:1"><path d="M3.5 11h17a8.5 8.5 0 0 1-17 0z"/></g></g></g></svg>
