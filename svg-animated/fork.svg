<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-fork" data-rd-animate="hover"><style>.rd-a-fork{overflow:visible}.rd-a-fork *{transform-box:view-box}.rd-a-fork .a{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-fork[data-rd-animate="hover"]:hover .a,:hover>.rd-a-fork[data-rd-animate="parent"] .a,.rd-a-fork[data-rd-animate="play"] .a,.rd-a-fork[data-rd-animate="loop"] .a{animation:rd-fork-m calc(0.8s*var(--rd-speed,1)) ease-in-out}.rd-a-fork[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-fork-m{0%,100%{rotate:0deg}35%{rotate:-12deg}70%{rotate:9deg}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><path d="M8 3.5v4.5a4 4 0 0 0 8 0V3.5"/><path d="M12 3.5v17"/></g></g></svg>
