<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-inbox" data-rd-animate="hover"><style>.rd-a-inbox{overflow:visible}.rd-a-inbox *{transform-box:view-box}.rd-a-inbox .tray{transform-origin:12px 20px}@media (prefers-reduced-motion:no-preference){.rd-a-inbox[data-rd-animate="hover"]:hover .rim,:hover>.rd-a-inbox[data-rd-animate="parent"] .rim,.rd-a-inbox[data-rd-animate="play"] .rim,.rd-a-inbox[data-rd-animate="loop"] .rim{animation:rd-inbox-rim calc(0.7s*var(--rd-speed,1)) ease-in-out}.rd-a-inbox[data-rd-animate="hover"]:hover .tray,:hover>.rd-a-inbox[data-rd-animate="parent"] .tray,.rd-a-inbox[data-rd-animate="play"] .tray,.rd-a-inbox[data-rd-animate="loop"] .tray{animation:rd-inbox-tray calc(0.7s*var(--rd-speed,1)) ease-in-out}.rd-a-inbox[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-inbox-rim{0%,100%{translate:0 0}40%{translate:0 2px}65%{translate:0 -.5px}}@keyframes rd-inbox-tray{0%,100%{scale:1 1}40%{scale:1 .93}65%{scale:1 1.02}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><path class="rim" d="M3.5 13h4.5l1.5 2.5h5L16 13h4.5"/><path class="tray" d="M3.5 13l2.2-6.8A2.5 2.5 0 0 1 8 4.5h8a2.5 2.5 0 0 1 2.3 1.7L20.5 13v4.5a2.5 2.5 0 0 1-2.5 2.5H6a2.5 2.5 0 0 1-2.5-2.5z"/></g></svg>
