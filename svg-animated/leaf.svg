<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-leaf" data-rd-animate="hover"><style>.rd-a-leaf{overflow:visible}.rd-a-leaf *{transform-box:view-box}.rd-a-leaf .p0{transform-origin:5px 19px}@media (prefers-reduced-motion:no-preference){.rd-a-leaf[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-leaf[data-rd-animate="parent"] .p0,.rd-a-leaf[data-rd-animate="play"] .p0,.rd-a-leaf[data-rd-animate="loop"] .p0{animation:rd-leaf-f0 calc(0.9s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-leaf[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-leaf-f0{0%,100%{rotate:0deg}35%{rotate:-7deg}70%{rotate:5deg}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g><g class="p0" style="--k:0;--s:1"><path d="M5 19c0-8 4-13 14-14 0 9-4 14-13 14z"/><path d="M5 19l7-7"/></g></g></g></svg>
