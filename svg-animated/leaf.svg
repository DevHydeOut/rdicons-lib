<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-leaf" data-rd-animate="hover"><style>.rd-a-leaf{overflow:visible}.rd-a-leaf *{transform-box:view-box}.rd-a-leaf .a{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-leaf[data-rd-animate="hover"]:hover .a,:hover>.rd-a-leaf[data-rd-animate="parent"] .a,.rd-a-leaf[data-rd-animate="play"] .a,.rd-a-leaf[data-rd-animate="loop"] .a{animation:rd-leaf-m calc(0.7s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-leaf[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-leaf-m{0%,100%{scale:1}45%{scale:1.16}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><path d="M5 19c0-8 4-13 14-14 0 9-4 14-13 14z"/><path d="M5 19l7-7"/></g></g></svg>
