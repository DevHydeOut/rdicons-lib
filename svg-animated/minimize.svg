<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-minimize" data-rd-animate="hover"><style>.rd-a-minimize{overflow:visible}.rd-a-minimize *{transform-box:view-box}.rd-a-minimize .d{stroke-dasharray:1 2}@media (prefers-reduced-motion:no-preference){.rd-a-minimize[data-rd-animate="hover"]:hover .d,:hover>.rd-a-minimize[data-rd-animate="parent"] .d,.rd-a-minimize[data-rd-animate="play"] .d,.rd-a-minimize[data-rd-animate="loop"] .d{animation:rd-minimize-draw calc(0.75s*var(--rd-speed,1)) ease-out;animation-delay:calc(var(--k)*.1s*var(--rd-speed,1))}.rd-a-minimize[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-minimize-draw{0%{stroke-dashoffset:1.2}100%{stroke-dashoffset:0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="d" style="--k:0"><path pathLength="1" d="M9.5 4.5v3a2 2 0 0 1-2 2h-3"/></g><g class="d" style="--k:1"><path pathLength="1" d="M14.5 4.5v3a2 2 0 0 0 2 2h3"/></g><g class="d" style="--k:2"><path pathLength="1" d="M9.5 19.5v-3a2 2 0 0 0-2-2h-3"/></g><g class="d" style="--k:3"><path pathLength="1" d="M14.5 19.5v-3a2 2 0 0 1 2-2h3"/></g></g></svg>
