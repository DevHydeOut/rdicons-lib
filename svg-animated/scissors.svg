<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-scissors" data-rd-animate="hover"><style>.rd-a-scissors{overflow:visible}.rd-a-scissors *{transform-box:view-box}.rd-a-scissors .p0{transform-box:fill-box;transform-origin:center}.rd-a-scissors .p1{transform-origin:8px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-scissors[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-scissors[data-rd-animate="parent"] .p0,.rd-a-scissors[data-rd-animate="play"] .p0,.rd-a-scissors[data-rd-animate="loop"] .p0{animation:rd-scissors-f0 calc(0.8s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-scissors[data-rd-animate="hover"]:hover .p1,:hover>.rd-a-scissors[data-rd-animate="parent"] .p1,.rd-a-scissors[data-rd-animate="play"] .p1,.rd-a-scissors[data-rd-animate="loop"] .p1{animation:rd-scissors-f1 calc(0.9s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-scissors[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-scissors-f0{0%,100%{scale:1}45%{scale:1.08}}@keyframes rd-scissors-f1{0%,100%{rotate:0deg}35%{rotate:-7deg}70%{rotate:5deg}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g><g class="p0" style="--k:0;--s:1"><circle cx="6" cy="6.5" r="2.5"/><circle cx="6" cy="17.5" r="2.5"/></g></g><g><g class="p1" style="--k:0;--s:1"><path d="M7.8 8.2L20 17M7.8 15.8L20 7"/></g></g></g></svg>
