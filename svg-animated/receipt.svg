<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-receipt" data-rd-animate="hover"><style>.rd-a-receipt{overflow:visible}.rd-a-receipt *{transform-box:view-box}.rd-a-receipt .a{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-receipt[data-rd-animate="hover"]:hover .a,:hover>.rd-a-receipt[data-rd-animate="parent"] .a,.rd-a-receipt[data-rd-animate="play"] .a,.rd-a-receipt[data-rd-animate="loop"] .a{animation:rd-receipt-m calc(0.7s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-receipt[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-receipt-m{0%,100%{scale:1}35%{scale:.88}65%{scale:1.1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><path d="M6 3.5h12v17l-2-1.5-2 1.5-2-1.5-2 1.5-2-1.5-2 1.5z"/><path d="M9 8.5h6M9 12h6M9 15.5h3"/></g></g></svg>
