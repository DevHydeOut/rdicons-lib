<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-receipt" data-rd-animate="hover"><style>.rd-a-receipt{overflow:visible}.rd-a-receipt *{transform-box:view-box}.rd-a-receipt .p0{stroke-dasharray:1 2}@media (prefers-reduced-motion:no-preference){.rd-a-receipt[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-receipt[data-rd-animate="parent"] .p0,.rd-a-receipt[data-rd-animate="play"] .p0,.rd-a-receipt[data-rd-animate="loop"] .p0{animation:rd-receipt-f0 calc(0.75s*var(--rd-speed,1)) ease-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-receipt[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-receipt-f0{0%{stroke-dashoffset:1.2}100%{stroke-dashoffset:0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><path d="M6 3.5h12v17l-2-1.5-2 1.5-2-1.5-2 1.5-2-1.5-2 1.5z"/><g><g class="p0" style="--k:0;--s:1"><path pathLength="1" d="M9 8.5h6M9 12h6M9 15.5h3"/></g></g></g></svg>
