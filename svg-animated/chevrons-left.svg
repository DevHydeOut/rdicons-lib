<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-chevrons-left" data-rd-animate="hover"><style>.rd-a-chevrons-left{overflow:visible}.rd-a-chevrons-left *{transform-box:view-box}.rd-a-chevrons-left .d{stroke-dasharray:1 2}@media (prefers-reduced-motion:no-preference){.rd-a-chevrons-left[data-rd-animate="hover"]:hover .d,:hover>.rd-a-chevrons-left[data-rd-animate="parent"] .d,.rd-a-chevrons-left[data-rd-animate="play"] .d,.rd-a-chevrons-left[data-rd-animate="loop"] .d{animation:rd-chevrons-left-draw calc(0.75s*var(--rd-speed,1)) ease-out;animation-delay:calc(var(--k)*.1s*var(--rd-speed,1))}.rd-a-chevrons-left[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-chevrons-left-draw{0%{stroke-dashoffset:1.2}100%{stroke-dashoffset:0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="d" style="--k:0"><path pathLength="1" d="M11 6l-6 6 6 6"/></g><g class="d" style="--k:1"><path pathLength="1" d="M19 6l-6 6 6 6"/></g></g></svg>
