<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-cone" data-rd-animate="hover"><style>.rd-a-cone{overflow:visible}.rd-a-cone *{transform-box:view-box}.rd-a-cone .a{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-cone[data-rd-animate="hover"]:hover .a,:hover>.rd-a-cone[data-rd-animate="parent"] .a,.rd-a-cone[data-rd-animate="play"] .a,.rd-a-cone[data-rd-animate="loop"] .a{animation:rd-cone-m calc(0.8s*var(--rd-speed,1)) ease-in-out}.rd-a-cone[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-cone-m{0%,100%{rotate:0deg}35%{rotate:-12deg}70%{rotate:9deg}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><path d="M12 3.5L5 16.5a7 3 0 0 0 14 0z"/></g></g></svg>
