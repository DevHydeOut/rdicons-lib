<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-stop-circle" data-rd-animate="hover"><style>.rd-a-stop-circle{overflow:visible}.rd-a-stop-circle *{transform-box:view-box}.rd-a-stop-circle .a{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-stop-circle[data-rd-animate="hover"]:hover .a,:hover>.rd-a-stop-circle[data-rd-animate="parent"] .a,.rd-a-stop-circle[data-rd-animate="play"] .a,.rd-a-stop-circle[data-rd-animate="loop"] .a{animation:rd-stop-circle-m calc(0.7s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-stop-circle[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-stop-circle-m{0%,100%{scale:1}35%{scale:.88}65%{scale:1.1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><circle cx="12" cy="12" r="8.5"/><rect x="9" y="9" width="6" height="6" rx="1.5"/></g></g></svg>
