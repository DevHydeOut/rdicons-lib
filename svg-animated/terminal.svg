<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-terminal" data-rd-animate="hover"><style>.rd-a-terminal{overflow:visible}.rd-a-terminal *{transform-box:view-box}.rd-a-terminal .shape{transform-origin:12px 12px}.rd-a-terminal .close{stroke-dasharray:1 2;stroke-dashoffset:1.2}@media (prefers-reduced-motion:no-preference){.rd-a-terminal[data-rd-animate="hover"]:hover .close,:hover>.rd-a-terminal[data-rd-animate="parent"] .close,.rd-a-terminal[data-rd-animate="play"] .close,.rd-a-terminal[data-rd-animate="loop"] .close{animation:rd-terminal-close calc(0.9s*var(--rd-speed,1)) ease-in-out}.rd-a-terminal[data-rd-animate="hover"]:hover .shape,:hover>.rd-a-terminal[data-rd-animate="parent"] .shape,.rd-a-terminal[data-rd-animate="play"] .shape,.rd-a-terminal[data-rd-animate="loop"] .shape{animation:rd-terminal-seal calc(0.9s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-terminal[data-rd-animate="hover"]:hover .cursor,:hover>.rd-a-terminal[data-rd-animate="parent"] .cursor,.rd-a-terminal[data-rd-animate="play"] .cursor,.rd-a-terminal[data-rd-animate="loop"] .cursor{animation:rd-terminal-blink calc(0.9s*var(--rd-speed,1)) steps(1,end)}.rd-a-terminal[data-rd-animate="hover"]:hover .prompt,:hover>.rd-a-terminal[data-rd-animate="parent"] .prompt,.rd-a-terminal[data-rd-animate="play"] .prompt,.rd-a-terminal[data-rd-animate="loop"] .prompt{animation:rd-terminal-nudge calc(0.9s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-terminal[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-terminal-close{0%,100%{stroke-dashoffset:1.2}30%,68%{stroke-dashoffset:0}}@keyframes rd-terminal-seal{0%,100%{scale:1}34%{scale:.95}52%{scale:1.03}}@keyframes rd-terminal-blink{0%,100%{opacity:1}22%{opacity:0}44%{opacity:1}66%{opacity:0}88%{opacity:1}}@keyframes rd-terminal-nudge{0%,100%{translate:0 0}40%{translate:1.2px 0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="shape"><path d="M20.67 6.9A4 4 0 0 1 21 8.5V15.5A4 4 0 0 1 17 19.5H7A4 4 0 0 1 3 15.5V8.5A4 4 0 0 1 7 4.5H17A4 4 0 0 1 18.6 4.83"/><path class="close" pathLength="1" d="M18.6 4.83A4 4 0 0 1 20.67 6.9"/><path class="prompt" d="M7.5 10l3 2.5-3 2.5"/><path class="cursor" d="M13 15h4"/></g></g></svg>
