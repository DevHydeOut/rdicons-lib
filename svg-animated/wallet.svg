<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-wallet" data-rd-animate="hover"><style>.rd-a-wallet{overflow:visible}.rd-a-wallet *{transform-box:view-box}.rd-a-wallet .p1{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:no-preference){.rd-a-wallet[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-wallet[data-rd-animate="parent"] .p0,.rd-a-wallet[data-rd-animate="play"] .p0,.rd-a-wallet[data-rd-animate="loop"] .p0{animation:rd-wallet-f0 calc(0.9s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-wallet[data-rd-animate="hover"]:hover .p1,:hover>.rd-a-wallet[data-rd-animate="parent"] .p1,.rd-a-wallet[data-rd-animate="play"] .p1,.rd-a-wallet[data-rd-animate="loop"] .p1{animation:rd-wallet-f1 calc(0.5s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1);animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-wallet[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-wallet-f0{0%,100%{translate:0 0}50%{translate:calc(var(--s)*2.6px) 0}}@keyframes rd-wallet-f1{0%,100%{scale:1}40%{scale:1.5}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><path d="M20.78 8.78A3.5 3.5 0 0 1 21 10V16A3.5 3.5 0 0 1 17.5 19.5H6.5A3.5 3.5 0 0 1 3 16V10A3.5 3.5 0 0 1 6.5 6.5H17.5A3.5 3.5 0 0 1 18.72 6.72"/><g><g class="p0" style="--k:0;--s:1"><path d="M21 11.5h-3.5a2 2 0 0 0 0 4H21"/></g></g><g><g class="p1" style="--k:0;--s:1"><path d="M17.5 13.5h.01"/></g></g></g></svg>
