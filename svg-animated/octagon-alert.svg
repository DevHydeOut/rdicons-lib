<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-octagon-alert" data-rd-animate="hover"><style>.rd-a-octagon-alert{overflow:visible}.rd-a-octagon-alert *{transform-box:view-box}.rd-a-octagon-alert .base{transform-origin:12px 12px}.rd-a-octagon-alert .badge{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:no-preference){.rd-a-octagon-alert[data-rd-animate="hover"]:hover .base,:hover>.rd-a-octagon-alert[data-rd-animate="parent"] .base,.rd-a-octagon-alert[data-rd-animate="play"] .base,.rd-a-octagon-alert[data-rd-animate="loop"] .base{animation:rd-octagon-alert-base calc(0.7s*var(--rd-speed,1)) ease-in-out}.rd-a-octagon-alert[data-rd-animate="hover"]:hover .badge,:hover>.rd-a-octagon-alert[data-rd-animate="parent"] .badge,.rd-a-octagon-alert[data-rd-animate="play"] .badge,.rd-a-octagon-alert[data-rd-animate="loop"] .badge{animation:rd-octagon-alert-badge calc(0.8s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-octagon-alert[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-octagon-alert-base{0%,100%{scale:1}40%{scale:.96}}@keyframes rd-octagon-alert-badge{0%,100%{scale:1;opacity:1}22%{scale:.1;opacity:0}62%{scale:1.3;opacity:1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="base"><path d="M8.5 3.5h7l5 5v7l-5 5h-7l-5-5v-7z"/></g><g class="badge"><path d="M12 8v4.5"/><path d="M12 16h.01"/></g></g></svg>
