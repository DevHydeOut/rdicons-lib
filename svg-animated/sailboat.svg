<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-sailboat" data-rd-animate="hover"><style>.rd-a-sailboat{overflow:visible}.rd-a-sailboat *{transform-box:view-box}.rd-a-sailboat .p0{transform-origin:12px 15px}@media (prefers-reduced-motion:no-preference){.rd-a-sailboat[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-sailboat[data-rd-animate="parent"] .p0,.rd-a-sailboat[data-rd-animate="play"] .p0,.rd-a-sailboat[data-rd-animate="loop"] .p0{animation:rd-sailboat-f0 calc(1s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-sailboat[data-rd-animate="hover"]:hover .p1,:hover>.rd-a-sailboat[data-rd-animate="parent"] .p1,.rd-a-sailboat[data-rd-animate="play"] .p1,.rd-a-sailboat[data-rd-animate="loop"] .p1{animation:rd-sailboat-f1 calc(0.9s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-sailboat[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-sailboat-f0{0%,100%{rotate:0deg}30%{rotate:calc(var(--s)*8deg)}65%{rotate:calc(var(--s)*-6deg)}}@keyframes rd-sailboat-f1{0%,100%{translate:0 0}50%{translate:0 calc(var(--s)*1.8px)}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><path d="M12 3.5v12"/><g><g class="p0" style="--k:0;--s:1"><path d="M12 4.5l6.5 10.5H12"/><path d="M10.5 8.5L6 15h4.5"/></g></g><g><g class="p1" style="--k:0;--s:1"><path d="M4 17.5h16l-2.5 3h-11z"/></g></g></g></svg>
