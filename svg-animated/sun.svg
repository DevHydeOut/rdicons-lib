<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-sun" data-rd-animate="hover"><style>.rd-a-sun{overflow:visible}.rd-a-sun *{transform-box:view-box}.rd-a-sun .rays{transform-origin:12px 12px}.rd-a-sun .core{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-sun[data-rd-animate="hover"]:hover .rays,:hover>.rd-a-sun[data-rd-animate="parent"] .rays,.rd-a-sun[data-rd-animate="play"] .rays,.rd-a-sun[data-rd-animate="loop"] .rays{animation:rd-sun-turn calc(0.8s*var(--rd-speed,1)) ease-in-out}.rd-a-sun[data-rd-animate="hover"]:hover .core,:hover>.rd-a-sun[data-rd-animate="parent"] .core,.rd-a-sun[data-rd-animate="play"] .core,.rd-a-sun[data-rd-animate="loop"] .core{animation:rd-sun-pulse calc(0.8s*var(--rd-speed,1)) ease-in-out}.rd-a-sun[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-sun-turn{0%{rotate:0deg}100%{rotate:45deg}}@keyframes rd-sun-pulse{0%,100%{scale:1}45%{scale:1.18}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><circle class="core" cx="12" cy="12" r="3.8"/><g class="rays"><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></g></g></svg>
