<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-captions" data-rd-animate="hover"><style>.rd-a-captions{overflow:visible}.rd-a-captions *{transform-box:view-box}.rd-a-captions .a{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-captions[data-rd-animate="hover"]:hover .a,:hover>.rd-a-captions[data-rd-animate="parent"] .a,.rd-a-captions[data-rd-animate="play"] .a,.rd-a-captions[data-rd-animate="loop"] .a{animation:rd-captions-m calc(0.7s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-captions[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-captions-m{0%,100%{scale:1}35%{scale:.88}65%{scale:1.1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><rect x="3" y="5.5" width="18" height="13" rx="3.5"/><path d="M7 11.5h3M7 15h5M14 11.5h3M15 15h2"/></g></g></svg>
