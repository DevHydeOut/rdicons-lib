<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-captions" data-rd-animate="hover"><style>.rd-a-captions{overflow:visible}.rd-a-captions *{transform-box:view-box}.rd-a-captions .p0{stroke-dasharray:1 2}@media (prefers-reduced-motion:no-preference){.rd-a-captions[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-captions[data-rd-animate="parent"] .p0,.rd-a-captions[data-rd-animate="play"] .p0,.rd-a-captions[data-rd-animate="loop"] .p0{animation:rd-captions-f0 calc(0.75s*var(--rd-speed,1)) ease-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-captions[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-captions-f0{0%{stroke-dashoffset:1.2}100%{stroke-dashoffset:0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><rect x="3" y="5.5" width="18" height="13" rx="3.5"/><g><g class="p0" style="--k:0;--s:1"><path pathLength="1" d="M7 11.5h3M7 15h5M14 11.5h3M15 15h2"/></g></g></g></svg>
