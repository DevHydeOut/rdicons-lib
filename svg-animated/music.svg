<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-music" data-rd-animate="hover"><style>.rd-a-music{overflow:visible}.rd-a-music *{transform-box:view-box}.rd-a-music .a{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-music[data-rd-animate="hover"]:hover .a,:hover>.rd-a-music[data-rd-animate="parent"] .a,.rd-a-music[data-rd-animate="play"] .a,.rd-a-music[data-rd-animate="loop"] .a{animation:rd-music-m calc(0.7s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-music[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-music-m{0%,100%{scale:1}35%{scale:.88}65%{scale:1.1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><path d="M9 17.5V6l10-2v11.5"/><circle cx="6.5" cy="17.5" r="2.5"/><circle cx="16.5" cy="15.5" r="2.5"/></g></g></svg>
