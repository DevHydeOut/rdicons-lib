<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-music" data-rd-animate="hover"><style>.rd-a-music{overflow:visible}.rd-a-music *{transform-box:view-box}.rd-a-music .p0{transform-box:fill-box;transform-origin:center}.rd-a-music .p1{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:no-preference){.rd-a-music[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-music[data-rd-animate="parent"] .p0,.rd-a-music[data-rd-animate="play"] .p0,.rd-a-music[data-rd-animate="loop"] .p0{animation:rd-music-f0 calc(0.9s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-music[data-rd-animate="hover"]:hover .p1,:hover>.rd-a-music[data-rd-animate="parent"] .p1,.rd-a-music[data-rd-animate="play"] .p1,.rd-a-music[data-rd-animate="loop"] .p1{animation:rd-music-f1 calc(0.9s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0.2s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-music[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-music-f0{0%,100%{translate:0 0}50%{translate:0 calc(var(--s)*1.8px)}}@keyframes rd-music-f1{0%,100%{translate:0 0}50%{translate:0 calc(var(--s)*1.8px)}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><path d="M9 17.5V6l10-2v11.5"/><g><g class="p0" style="--k:0;--s:1"><circle cx="6.5" cy="17.5" r="2.5"/></g></g><g><g class="p1" style="--k:0;--s:1"><circle cx="16.5" cy="15.5" r="2.5"/></g></g></g></svg>
