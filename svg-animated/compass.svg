<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-compass" data-rd-animate="hover"><style>.rd-a-compass{overflow:visible}.rd-a-compass *{transform-box:view-box}.rd-a-compass .a{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-compass[data-rd-animate="hover"]:hover .a,:hover>.rd-a-compass[data-rd-animate="parent"] .a,.rd-a-compass[data-rd-animate="play"] .a,.rd-a-compass[data-rd-animate="loop"] .a{animation:rd-compass-m calc(0.7s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-compass[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-compass-m{0%,100%{scale:1}45%{scale:1.16}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><circle cx="12" cy="12" r="8.5"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></g></g></svg>
