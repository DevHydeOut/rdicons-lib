<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-compass" data-rd-animate="hover"><style>.rd-a-compass{overflow:visible}.rd-a-compass *{transform-box:view-box}.rd-a-compass .p0{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-compass[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-compass[data-rd-animate="parent"] .p0,.rd-a-compass[data-rd-animate="play"] .p0,.rd-a-compass[data-rd-animate="loop"] .p0{animation:rd-compass-f0 calc(0.9s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-compass[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-compass-f0{0%,100%{rotate:0deg}35%{rotate:-7deg}70%{rotate:5deg}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><circle cx="12" cy="12" r="8.5"/><g><g class="p0" style="--k:0;--s:1"><path d="M15.5 8.5l-2 5-5 2 2-5z"/></g></g></g></svg>
