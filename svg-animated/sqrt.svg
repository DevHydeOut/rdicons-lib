<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-sqrt" data-rd-animate="hover"><style>.rd-a-sqrt{overflow:visible}.rd-a-sqrt *{transform-box:view-box}.rd-a-sqrt .a{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-sqrt[data-rd-animate="hover"]:hover .a,:hover>.rd-a-sqrt[data-rd-animate="parent"] .a,.rd-a-sqrt[data-rd-animate="play"] .a,.rd-a-sqrt[data-rd-animate="loop"] .a{animation:rd-sqrt-m calc(0.7s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-sqrt[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-sqrt-m{0%,100%{scale:1}35%{scale:.88}65%{scale:1.1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><path d="M3.5 13l3 3.5 4-10h10"/></g></g></svg>
