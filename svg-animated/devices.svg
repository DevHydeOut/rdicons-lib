<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-devices" data-rd-animate="hover"><style>.rd-a-devices{overflow:visible}.rd-a-devices *{transform-box:view-box}.rd-a-devices .p0{transform-box:fill-box;transform-origin:center}.rd-a-devices .p1{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:no-preference){.rd-a-devices[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-devices[data-rd-animate="parent"] .p0,.rd-a-devices[data-rd-animate="play"] .p0,.rd-a-devices[data-rd-animate="loop"] .p0{animation:rd-devices-f0 calc(0.9s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-devices[data-rd-animate="hover"]:hover .p1,:hover>.rd-a-devices[data-rd-animate="parent"] .p1,.rd-a-devices[data-rd-animate="play"] .p1,.rd-a-devices[data-rd-animate="loop"] .p1{animation:rd-devices-f1 calc(0.5s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1);animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-devices[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-devices-f0{0%,100%{rotate:0deg}35%{rotate:-7deg}70%{rotate:5deg}}@keyframes rd-devices-f1{0%,100%{scale:1}40%{scale:1.5}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><path d="M18 8.5V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h6M8 20h3"/><g><g class="p0" style="--k:0;--s:1"><rect x="14.5" y="10" width="6.5" height="10.5" rx="1.8"/></g></g><g><g class="p1" style="--k:0;--s:1"><path d="M17.75 17.5h.01"/></g></g></g></svg>
