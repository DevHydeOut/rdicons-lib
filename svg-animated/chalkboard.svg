<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-chalkboard" data-rd-animate="hover"><style>.rd-a-chalkboard{overflow:visible}.rd-a-chalkboard *{transform-box:view-box}.rd-a-chalkboard .a{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-chalkboard[data-rd-animate="hover"]:hover .a,:hover>.rd-a-chalkboard[data-rd-animate="parent"] .a,.rd-a-chalkboard[data-rd-animate="play"] .a,.rd-a-chalkboard[data-rd-animate="loop"] .a{animation:rd-chalkboard-m calc(0.8s*var(--rd-speed,1)) ease-in-out}.rd-a-chalkboard[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-chalkboard-m{0%,100%{rotate:0deg}35%{rotate:-12deg}70%{rotate:9deg}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><rect x="3.5" y="4" width="17" height="13" rx="2"/><path d="M3.5 20h17"/><path d="M7 12c1.5-3 3-3 4.5 0s3 0 5-3"/></g></g></svg>
