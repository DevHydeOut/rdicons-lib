<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-file-down" data-rd-animate="hover"><style>.rd-a-file-down{overflow:visible}.rd-a-file-down *{transform-box:view-box}.rd-a-file-down .base{transform-origin:12px 12px}.rd-a-file-down .badge{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:no-preference){.rd-a-file-down[data-rd-animate="hover"]:hover .base,:hover>.rd-a-file-down[data-rd-animate="parent"] .base,.rd-a-file-down[data-rd-animate="play"] .base,.rd-a-file-down[data-rd-animate="loop"] .base{animation:rd-file-down-base calc(0.7s*var(--rd-speed,1)) ease-in-out}.rd-a-file-down[data-rd-animate="hover"]:hover .badge,:hover>.rd-a-file-down[data-rd-animate="parent"] .badge,.rd-a-file-down[data-rd-animate="play"] .badge,.rd-a-file-down[data-rd-animate="loop"] .badge{animation:rd-file-down-badge calc(0.8s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-file-down[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-file-down-base{0%,100%{scale:1}40%{scale:.96}}@keyframes rd-file-down-badge{0%,100%{translate:0 0}35%{translate:0 2px}65%{translate:0 0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="base"><path d="M13.5 3.5H8A3.5 3.5 0 0 0 4.5 7v10A3.5 3.5 0 0 0 8 20.5h8a3.5 3.5 0 0 0 3.5-3.5V9.5"/><path d="M13.5 3.5V7A2.5 2.5 0 0 0 16 9.5h3.5"/></g><g class="badge"><path d="M12 12.5v5M10 15.5l2 2 2-2"/></g></g></svg>
