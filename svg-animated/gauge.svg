<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-gauge" data-rd-animate="hover"><style>.rd-a-gauge{overflow:visible}.rd-a-gauge *{transform-box:view-box}.rd-a-gauge .a{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-gauge[data-rd-animate="hover"]:hover .a,:hover>.rd-a-gauge[data-rd-animate="parent"] .a,.rd-a-gauge[data-rd-animate="play"] .a,.rd-a-gauge[data-rd-animate="loop"] .a{animation:rd-gauge-m calc(0.7s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-gauge[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-gauge-m{0%,100%{scale:1}35%{scale:.88}65%{scale:1.1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><path d="M4.5 17a8.5 8.5 0 1 1 15 0"/><path d="M12 14.5l4-5"/><path d="M12 14.5h.01"/></g></g></svg>
