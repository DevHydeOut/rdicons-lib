<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-gauge" data-rd-animate="hover"><style>.rd-a-gauge{overflow:visible}.rd-a-gauge *{transform-box:view-box}.rd-a-gauge .needle{transform-origin:12px 14.5px}@media (prefers-reduced-motion:no-preference){.rd-a-gauge[data-rd-animate="hover"]:hover .needle,:hover>.rd-a-gauge[data-rd-animate="parent"] .needle,.rd-a-gauge[data-rd-animate="play"] .needle,.rd-a-gauge[data-rd-animate="loop"] .needle{animation:rd-gauge-m calc(1s*var(--rd-speed,1)) ease-in-out}.rd-a-gauge[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-gauge-m{0%,100%{rotate:0deg}30%{rotate:-60deg}65%{rotate:40deg}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><path d="M4.5 17a8.5 8.5 0 1 1 15 0"/><g class="needle"><path d="M12 14.5l4-5"/><path d="M12 14.5h.01"/></g></g></svg>
