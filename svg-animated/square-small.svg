<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-square-small" data-rd-animate="hover"><style>.rd-a-square-small{overflow:visible}.rd-a-square-small *{transform-box:view-box}.rd-a-square-small .a{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-square-small[data-rd-animate="hover"]:hover .a,:hover>.rd-a-square-small[data-rd-animate="parent"] .a,.rd-a-square-small[data-rd-animate="play"] .a,.rd-a-square-small[data-rd-animate="loop"] .a{animation:rd-square-small-m calc(0.8s*var(--rd-speed,1)) ease-in-out}.rd-a-square-small[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-square-small-m{0%,100%{scale:1}30%{scale:1.2}55%{scale:.95}75%{scale:1.07}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><rect x="8.5" y="8.5" width="7" height="7" rx="2"/></g></g></svg>
