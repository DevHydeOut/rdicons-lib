<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-folder-heart" data-rd-animate="hover"><style>.rd-a-folder-heart{overflow:visible}.rd-a-folder-heart *{transform-box:view-box}.rd-a-folder-heart .base{transform-origin:12px 12px}.rd-a-folder-heart .badge{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:no-preference){.rd-a-folder-heart[data-rd-animate="hover"]:hover .base,:hover>.rd-a-folder-heart[data-rd-animate="parent"] .base,.rd-a-folder-heart[data-rd-animate="play"] .base,.rd-a-folder-heart[data-rd-animate="loop"] .base{animation:rd-folder-heart-base calc(0.7s*var(--rd-speed,1)) ease-in-out}.rd-a-folder-heart[data-rd-animate="hover"]:hover .badge,:hover>.rd-a-folder-heart[data-rd-animate="parent"] .badge,.rd-a-folder-heart[data-rd-animate="play"] .badge,.rd-a-folder-heart[data-rd-animate="loop"] .badge{animation:rd-folder-heart-badge calc(0.8s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-folder-heart[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-folder-heart-base{0%,100%{scale:1}40%{scale:.96}}@keyframes rd-folder-heart-badge{0%,100%{scale:1;opacity:1}22%{scale:.1;opacity:0}62%{scale:1.3;opacity:1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="base"><path d="M20.13 8.61A4 4 0 0 1 20.5 10.3v6.2a4 4 0 0 1-4 4h-9a4 4 0 0 1-4-4v-9a4 4 0 0 1 4-4h1.6a3 3 0 0 1 2.2 1l.7.8a3 3 0 0 0 2.2 1h2.3a4 4 0 0 1 1.69.37"/></g><g class="badge"><path d="M12 17.1c-2 -1.3 -3 -2.3 -3 -3.6a1.7 1.7 0 0 1 3 -1a1.7 1.7 0 0 1 3 1c0 1.3 -1 2.3 -3 3.6z"/></g></g></svg>
