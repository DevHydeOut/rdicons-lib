<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-search" data-rd-animate="hover"><style>.rd-a-search{overflow:visible}.rd-a-search *{transform-box:view-box}.rd-a-search .lens{transform-origin:10.5px 10.5px}@media (prefers-reduced-motion:no-preference){.rd-a-search[data-rd-animate="hover"]:hover .lens,:hover>.rd-a-search[data-rd-animate="parent"] .lens,.rd-a-search[data-rd-animate="play"] .lens,.rd-a-search[data-rd-animate="loop"] .lens{animation:rd-search-wiggle calc(0.8s*var(--rd-speed,1)) ease-in-out}.rd-a-search[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-search-wiggle{0%,100%{rotate:0deg}25%{rotate:-16deg}55%{rotate:9deg}80%{rotate:-3deg}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="lens"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.6 15.6l4.9 4.9"/></g></g></svg>
