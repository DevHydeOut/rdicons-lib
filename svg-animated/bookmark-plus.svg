<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-bookmark-plus" data-rd-animate="hover"><style>.rd-a-bookmark-plus{overflow:visible}.rd-a-bookmark-plus *{transform-box:view-box}.rd-a-bookmark-plus .base{transform-origin:12px 12px}.rd-a-bookmark-plus .badge{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:no-preference){.rd-a-bookmark-plus[data-rd-animate="hover"]:hover .base,:hover>.rd-a-bookmark-plus[data-rd-animate="parent"] .base,.rd-a-bookmark-plus[data-rd-animate="play"] .base,.rd-a-bookmark-plus[data-rd-animate="loop"] .base{animation:rd-bookmark-plus-base calc(0.7s*var(--rd-speed,1)) ease-in-out}.rd-a-bookmark-plus[data-rd-animate="hover"]:hover .badge,:hover>.rd-a-bookmark-plus[data-rd-animate="parent"] .badge,.rd-a-bookmark-plus[data-rd-animate="play"] .badge,.rd-a-bookmark-plus[data-rd-animate="loop"] .badge{animation:rd-bookmark-plus-badge calc(0.8s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-bookmark-plus[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-bookmark-plus-base{0%,100%{scale:1}40%{scale:.96}}@keyframes rd-bookmark-plus-badge{0%,100%{scale:1;opacity:1}22%{scale:.1;opacity:0}62%{scale:1.3;opacity:1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="base"><path d="M7 4.5h10a1.5 1.5 0 0 1 1.5 1.5v14.2L12 16l-6.5 4.2V6A1.5 1.5 0 0 1 7 4.5z"/></g><g class="badge"><path d="M12 8v5M9.5 10.5h5"/></g></g></svg>
