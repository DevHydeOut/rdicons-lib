<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-activity" data-rd-animate="hover"><style>.rd-a-activity{overflow:visible}.rd-a-activity *{transform-box:view-box}.rd-a-activity .a{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-activity[data-rd-animate="hover"]:hover .a,:hover>.rd-a-activity[data-rd-animate="parent"] .a,.rd-a-activity[data-rd-animate="play"] .a,.rd-a-activity[data-rd-animate="loop"] .a{animation:rd-activity-m calc(0.8s*var(--rd-speed,1)) ease-in-out}.rd-a-activity[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-activity-m{0%,100%{scale:1}30%{scale:1.2}55%{scale:.95}75%{scale:1.07}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><path d="M3 12h4l3-8 4 16 3-8h4"/></g></g></svg>
