<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-chart-area" data-rd-animate="hover"><style>.rd-a-chart-area{overflow:visible}.rd-a-chart-area *{transform-box:view-box}.rd-a-chart-area .d{stroke-dasharray:1 2}@media (prefers-reduced-motion:no-preference){.rd-a-chart-area[data-rd-animate="hover"]:hover .d,:hover>.rd-a-chart-area[data-rd-animate="parent"] .d,.rd-a-chart-area[data-rd-animate="play"] .d,.rd-a-chart-area[data-rd-animate="loop"] .d{animation:rd-chart-area-draw calc(0.75s*var(--rd-speed,1)) ease-out;animation-delay:calc(var(--k)*.1s*var(--rd-speed,1))}.rd-a-chart-area[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-chart-area-draw{0%{stroke-dashoffset:1.2}100%{stroke-dashoffset:0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="d" style="--k:0"><path pathLength="1" d="M3.5 3.5v17h17"/></g><g class="d" style="--k:1"><path pathLength="1" d="M7 16.5l3.5-5 3 3 4.5-6.5v8.5z"/></g></g></svg>
