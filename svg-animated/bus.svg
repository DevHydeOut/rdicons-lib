<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-bus" data-rd-animate="hover"><style>.rd-a-bus{overflow:visible}.rd-a-bus *{transform-box:view-box}.rd-a-bus .body{transform-origin:12px 17.5px}.rd-a-bus .lamp{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:no-preference){.rd-a-bus[data-rd-animate="hover"]:hover .body,:hover>.rd-a-bus[data-rd-animate="parent"] .body,.rd-a-bus[data-rd-animate="play"] .body,.rd-a-bus[data-rd-animate="loop"] .body{animation:rd-bus-rock calc(0.8s*var(--rd-speed,1)) ease-in-out}.rd-a-bus[data-rd-animate="hover"]:hover .lamp,:hover>.rd-a-bus[data-rd-animate="parent"] .lamp,.rd-a-bus[data-rd-animate="play"] .lamp,.rd-a-bus[data-rd-animate="loop"] .lamp{animation:rd-bus-lamp calc(0.8s*var(--rd-speed,1)) ease-in-out}.rd-a-bus[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-bus-rock{0%,100%{rotate:0deg}25%{rotate:-2deg}55%{rotate:1.5deg}80%{rotate:-.5deg}}@keyframes rd-bus-lamp{0%,100%{scale:1}35%,55%{scale:2.2}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="body"><path d="M19.78 5.78A3.5 3.5 0 0 1 20 7V14A3.5 3.5 0 0 1 16.5 17.5H7.5A3.5 3.5 0 0 1 4 14V7A3.5 3.5 0 0 1 7.5 3.5H16.5A3.5 3.5 0 0 1 17.72 3.72"/><path d="M4.2 11h15.6"/></g><path class="lamp" d="M8 14.2h.01"/><path class="lamp" d="M16 14.2h.01"/><path d="M7.5 17.5v2.5M16.5 17.5v2.5"/></g></svg>
