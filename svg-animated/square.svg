<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-square" data-rd-animate="hover"><style>.rd-a-square{overflow:visible}.rd-a-square *{transform-box:view-box}.rd-a-square .d{stroke-dasharray:1 2}@media (prefers-reduced-motion:no-preference){.rd-a-square[data-rd-animate="hover"]:hover .d,:hover>.rd-a-square[data-rd-animate="parent"] .d,.rd-a-square[data-rd-animate="play"] .d,.rd-a-square[data-rd-animate="loop"] .d{animation:rd-square-draw calc(0.75s*var(--rd-speed,1)) ease-out;animation-delay:calc(var(--k)*.1s*var(--rd-speed,1))}.rd-a-square[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-square-draw{0%{stroke-dashoffset:1.2}100%{stroke-dashoffset:0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="d" style="--k:0"><path pathLength="1" d="M19.67 6.4A4 4 0 0 1 20 8V16A4 4 0 0 1 16 20H8A4 4 0 0 1 4 16V8A4 4 0 0 1 8 4H16A4 4 0 0 1 17.6 4.33"/></g></g></svg>
