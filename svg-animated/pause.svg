<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-pause" data-rd-animate="hover"><style>.rd-a-pause{overflow:visible}.rd-a-pause *{transform-box:view-box}@media (prefers-reduced-motion:no-preference){.rd-a-pause[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-pause[data-rd-animate="parent"] .p0,.rd-a-pause[data-rd-animate="play"] .p0,.rd-a-pause[data-rd-animate="loop"] .p0{animation:rd-pause-f0 calc(0.9s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-pause[data-rd-animate="hover"]:hover .p1,:hover>.rd-a-pause[data-rd-animate="parent"] .p1,.rd-a-pause[data-rd-animate="play"] .p1,.rd-a-pause[data-rd-animate="loop"] .p1{animation:rd-pause-f1 calc(0.9s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0.15s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-pause[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-pause-f0{0%,100%{translate:0 0}50%{translate:0 calc(var(--s)*1.8px)}}@keyframes rd-pause-f1{0%,100%{translate:0 0}50%{translate:0 calc(var(--s)*1.8px)}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g><g class="p0" style="--k:0;--s:1"><rect x="6.5" y="5" width="3.5" height="14" rx="1.5"/></g></g><g><g class="p1" style="--k:0;--s:-1"><rect x="14" y="5" width="3.5" height="14" rx="1.5"/></g></g></g></svg>
