<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-pause" data-rd-animate="hover"><style>.rd-a-pause{overflow:visible}.rd-a-pause *{transform-box:view-box}.rd-a-pause .a{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-pause[data-rd-animate="hover"]:hover .a,:hover>.rd-a-pause[data-rd-animate="parent"] .a,.rd-a-pause[data-rd-animate="play"] .a,.rd-a-pause[data-rd-animate="loop"] .a{animation:rd-pause-m calc(0.7s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-pause[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-pause-m{0%,100%{scale:1 1}40%{scale:1.14 1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><rect x="6.5" y="5" width="3.5" height="14" rx="1.5"/><rect x="14" y="5" width="3.5" height="14" rx="1.5"/></g></g></svg>
