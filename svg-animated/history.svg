<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-history" data-rd-animate="hover"><style>.rd-a-history{overflow:visible}.rd-a-history *{transform-box:view-box}.rd-a-history .a{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-history[data-rd-animate="hover"]:hover .a,:hover>.rd-a-history[data-rd-animate="parent"] .a,.rd-a-history[data-rd-animate="play"] .a,.rd-a-history[data-rd-animate="loop"] .a{animation:rd-history-m calc(0.9s*var(--rd-speed,1)) ease-in-out}.rd-a-history[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-history-m{0%{rotate:0deg}100%{rotate:-360deg}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><path d="M4 12a8 8 0 1 0 2.4-5.7L4 8.5M4 4.5v4h4"/><path d="M12 8v4.2l2.8 1.8"/></g></g></svg>
