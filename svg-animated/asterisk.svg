<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-asterisk" data-rd-animate="hover"><style>.rd-a-asterisk{overflow:visible}.rd-a-asterisk *{transform-box:view-box}.rd-a-asterisk .a{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-asterisk[data-rd-animate="hover"]:hover .a,:hover>.rd-a-asterisk[data-rd-animate="parent"] .a,.rd-a-asterisk[data-rd-animate="play"] .a,.rd-a-asterisk[data-rd-animate="loop"] .a{animation:rd-asterisk-m calc(0.9s*var(--rd-speed,1)) ease-in-out}.rd-a-asterisk[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-asterisk-m{0%{rotate:0deg}100%{rotate:360deg}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><path d="M12 4.5v15M5.5 8.2l13 7.6M18.5 8.2l-13 7.6"/></g></g></svg>
