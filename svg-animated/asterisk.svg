<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-asterisk" data-rd-animate="hover"><style>.rd-a-asterisk{overflow:visible}.rd-a-asterisk *{transform-box:view-box}.rd-a-asterisk .d{stroke-dasharray:1 2}@media (prefers-reduced-motion:no-preference){.rd-a-asterisk[data-rd-animate="hover"]:hover .d,:hover>.rd-a-asterisk[data-rd-animate="parent"] .d,.rd-a-asterisk[data-rd-animate="play"] .d,.rd-a-asterisk[data-rd-animate="loop"] .d{animation:rd-asterisk-draw calc(0.75s*var(--rd-speed,1)) ease-out;animation-delay:calc(var(--k)*.1s*var(--rd-speed,1))}.rd-a-asterisk[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-asterisk-draw{0%{stroke-dashoffset:1.2}100%{stroke-dashoffset:0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="d" style="--k:0"><path pathLength="1" d="M12 4.5v15"/></g><g class="d" style="--k:1"><path pathLength="1" d="M5.5 8.2l13 7.6"/></g><g class="d" style="--k:2"><path pathLength="1" d="M18.5 8.2l-13 7.6"/></g></g></svg>
