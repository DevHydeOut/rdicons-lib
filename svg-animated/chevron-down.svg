<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-chevron-down" data-rd-animate="hover"><style>.rd-a-chevron-down{overflow:visible}.rd-a-chevron-down *{transform-box:view-box}@media (prefers-reduced-motion:no-preference){.rd-a-chevron-down[data-rd-animate="hover"]:hover .a,:hover>.rd-a-chevron-down[data-rd-animate="parent"] .a,.rd-a-chevron-down[data-rd-animate="play"] .a,.rd-a-chevron-down[data-rd-animate="loop"] .a{animation:rd-chevron-down-m calc(0.7s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-chevron-down[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-chevron-down-m{0%,100%{translate:0 0}40%{translate:0 2.6px}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><path d="M5.5 9.5L12 16l6.5-6.5"/></g></g></svg>
