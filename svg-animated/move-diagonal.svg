<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-move-diagonal" data-rd-animate="hover"><style>.rd-a-move-diagonal{overflow:visible}.rd-a-move-diagonal *{transform-box:view-box}@media (prefers-reduced-motion:no-preference){.rd-a-move-diagonal[data-rd-animate="hover"]:hover .a,:hover>.rd-a-move-diagonal[data-rd-animate="parent"] .a,.rd-a-move-diagonal[data-rd-animate="play"] .a,.rd-a-move-diagonal[data-rd-animate="loop"] .a{animation:rd-move-diagonal-m calc(0.7s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-move-diagonal[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-move-diagonal-m{0%,100%{translate:0 0}40%{translate:2.2px -2.2px}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><path d="M5 19L19 5M14 5h5v5M10 19H5v-5"/></g></g></svg>
