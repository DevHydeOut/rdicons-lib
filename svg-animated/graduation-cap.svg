<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-graduation-cap" data-rd-animate="hover"><style>.rd-a-graduation-cap{overflow:visible}.rd-a-graduation-cap *{transform-box:view-box}.rd-a-graduation-cap .p1{transform-origin:21.5px 9.5px}@media (prefers-reduced-motion:no-preference){.rd-a-graduation-cap[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-graduation-cap[data-rd-animate="parent"] .p0,.rd-a-graduation-cap[data-rd-animate="play"] .p0,.rd-a-graduation-cap[data-rd-animate="loop"] .p0{animation:rd-graduation-cap-f0 calc(0.7s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1);animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-graduation-cap[data-rd-animate="hover"]:hover .p1,:hover>.rd-a-graduation-cap[data-rd-animate="parent"] .p1,.rd-a-graduation-cap[data-rd-animate="play"] .p1,.rd-a-graduation-cap[data-rd-animate="loop"] .p1{animation:rd-graduation-cap-f1 calc(1s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-graduation-cap[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-graduation-cap-f0{0%,100%{translate:0 0}40%{translate:0 -2px}}@keyframes rd-graduation-cap-f1{0%,100%{rotate:0deg}30%{rotate:calc(var(--s)*8deg)}65%{rotate:calc(var(--s)*-6deg)}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><path d="M6.5 11.5v4c0 1.5 2.5 3 5.5 3s5.5-1.5 5.5-3v-4"/><g><g class="p0" style="--k:0;--s:1"><path d="M2.5 9.5L12 5l9.5 4.5L12 14z"/></g></g><g><g class="p1" style="--k:0;--s:1"><path d="M21.5 9.5v5"/></g></g></g></svg>
