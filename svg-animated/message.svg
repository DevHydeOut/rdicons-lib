<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-message" data-rd-animate="hover"><style>.rd-a-message{overflow:visible}.rd-a-message *{transform-box:view-box}@media (prefers-reduced-motion:no-preference){.rd-a-message[data-rd-animate="hover"]:hover .a,:hover>.rd-a-message[data-rd-animate="parent"] .a,.rd-a-message[data-rd-animate="play"] .a,.rd-a-message[data-rd-animate="loop"] .a{animation:rd-message-m calc(0.8s*var(--rd-speed,1)) ease-in-out}.rd-a-message[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-message-m{0%,100%{translate:0 0}30%{translate:0 -3px}55%{translate:0 0}72%{translate:0 -1px}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><path d="M12 3.5A8 8 0 1 1 8 18.43L4.5 19.5l.57-4A8 8 0 0 1 12 3.5z"/></g></g></svg>
