<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-frame" data-rd-animate="hover"><style>.rd-a-frame{overflow:visible}.rd-a-frame *{transform-box:view-box}.rd-a-frame .d{stroke-dasharray:1 2}@media (prefers-reduced-motion:no-preference){.rd-a-frame[data-rd-animate="hover"]:hover .d,:hover>.rd-a-frame[data-rd-animate="parent"] .d,.rd-a-frame[data-rd-animate="play"] .d,.rd-a-frame[data-rd-animate="loop"] .d{animation:rd-frame-draw calc(0.75s*var(--rd-speed,1)) ease-out;animation-delay:calc(var(--k)*.1s*var(--rd-speed,1))}.rd-a-frame[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-frame-draw{0%{stroke-dashoffset:1.2}100%{stroke-dashoffset:0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="d" style="--k:0"><path pathLength="1" d="M3.5 7.5h17"/></g><g class="d" style="--k:1"><path pathLength="1" d="M3.5 16.5h17"/></g><g class="d" style="--k:2"><path pathLength="1" d="M7.5 3.5v17"/></g><g class="d" style="--k:3"><path pathLength="1" d="M16.5 3.5v17"/></g></g></svg>
