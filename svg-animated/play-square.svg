<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-play-square" data-rd-animate="hover"><style>.rd-a-play-square{overflow:visible}.rd-a-play-square *{transform-box:view-box}.rd-a-play-square .base{transform-origin:12px 12px}.rd-a-play-square .badge{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:no-preference){.rd-a-play-square[data-rd-animate="hover"]:hover .base,:hover>.rd-a-play-square[data-rd-animate="parent"] .base,.rd-a-play-square[data-rd-animate="play"] .base,.rd-a-play-square[data-rd-animate="loop"] .base{animation:rd-play-square-base calc(0.7s*var(--rd-speed,1)) ease-in-out}.rd-a-play-square[data-rd-animate="hover"]:hover .badge,:hover>.rd-a-play-square[data-rd-animate="parent"] .badge,.rd-a-play-square[data-rd-animate="play"] .badge,.rd-a-play-square[data-rd-animate="loop"] .badge{animation:rd-play-square-badge calc(0.8s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-play-square[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-play-square-base{0%,100%{scale:1}40%{scale:.96}}@keyframes rd-play-square-badge{0%,100%{scale:1;opacity:1}22%{scale:.1;opacity:0}62%{scale:1.3;opacity:1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="base"><path d="M20.17 5.9A4 4 0 0 1 20.5 7.5V16.5A4 4 0 0 1 16.5 20.5H7.5A4 4 0 0 1 3.5 16.5V7.5A4 4 0 0 1 7.5 3.5H16.5A4 4 0 0 1 18.1 3.83"/></g><g class="badge"><path d="M10 8.5v7l6-3.5z"/></g></g></svg>
