<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-candlestick-chart" data-rd-animate="hover"><style>.rd-a-candlestick-chart{overflow:visible}.rd-a-candlestick-chart *{transform-box:view-box}.rd-a-candlestick-chart .p0{transform-box:fill-box;transform-origin:center}.rd-a-candlestick-chart .p1{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:no-preference){.rd-a-candlestick-chart[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-candlestick-chart[data-rd-animate="parent"] .p0,.rd-a-candlestick-chart[data-rd-animate="play"] .p0,.rd-a-candlestick-chart[data-rd-animate="loop"] .p0{animation:rd-candlestick-chart-f0 calc(0.5s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1);animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-candlestick-chart[data-rd-animate="hover"]:hover .p1,:hover>.rd-a-candlestick-chart[data-rd-animate="parent"] .p1,.rd-a-candlestick-chart[data-rd-animate="play"] .p1,.rd-a-candlestick-chart[data-rd-animate="loop"] .p1{animation:rd-candlestick-chart-f1 calc(0.5s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1);animation-delay:calc((0.2s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-candlestick-chart[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-candlestick-chart-f0{0%,100%{scale:1}40%{scale:1.5}}@keyframes rd-candlestick-chart-f1{0%,100%{scale:1}40%{scale:1.5}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><path d="M7 3.5v3M7 14v3.5"/><path d="M17 6.5v2.5M17 17v3.5"/><g><g class="p0" style="--k:0;--s:1"><rect x="5" y="6.5" width="4" height="7.5" rx="1"/></g></g><g><g class="p1" style="--k:0;--s:1"><rect x="15" y="9" width="4" height="8" rx="1"/></g></g></g></svg>
