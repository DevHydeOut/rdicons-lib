<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-cloud" data-rd-animate="hover"><style>.rd-a-cloud{overflow:visible}.rd-a-cloud *{transform-box:view-box}@media (prefers-reduced-motion:no-preference){.rd-a-cloud[data-rd-animate="hover"]:hover .a,:hover>.rd-a-cloud[data-rd-animate="parent"] .a,.rd-a-cloud[data-rd-animate="play"] .a,.rd-a-cloud[data-rd-animate="loop"] .a{animation:rd-cloud-m calc(1s*var(--rd-speed,1)) ease-in-out}.rd-a-cloud[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-cloud-m{0%,100%{translate:0 0}50%{translate:0 -2px}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><path d="M7 19.5a4.5 4.5 0 0 1-.7-8.9 6 6 0 0 1 11.5-1.1 4.5 4.5 0 0 1-.8 10z"/></g></g></svg>
