<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-cloud" data-rd-animate="hover"><style>.rd-a-cloud{overflow:visible}.rd-a-cloud *{transform-box:view-box}.rd-a-cloud .d{stroke-dasharray:1 2}@media (prefers-reduced-motion:no-preference){.rd-a-cloud[data-rd-animate="hover"]:hover .d,:hover>.rd-a-cloud[data-rd-animate="parent"] .d,.rd-a-cloud[data-rd-animate="play"] .d,.rd-a-cloud[data-rd-animate="loop"] .d{animation:rd-cloud-draw calc(0.75s*var(--rd-speed,1)) ease-out;animation-delay:calc(var(--k)*.1s*var(--rd-speed,1))}.rd-a-cloud[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-cloud-draw{0%{stroke-dashoffset:1.2}100%{stroke-dashoffset:0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="d" style="--k:0"><path pathLength="1" d="M6.4 19.5a4.5 4.5 0 0 1 -0.7 -8.9a6 6 0 0 1 11.5 -1.1a4.5 4.5 0 0 1 -0.8 10z"/></g></g></svg>
