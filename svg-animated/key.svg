<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-key" data-rd-animate="hover"><style>.rd-a-key{overflow:visible}.rd-a-key *{transform-box:view-box}.rd-a-key .d{stroke-dasharray:1 2}@media (prefers-reduced-motion:no-preference){.rd-a-key[data-rd-animate="hover"]:hover .d,:hover>.rd-a-key[data-rd-animate="parent"] .d,.rd-a-key[data-rd-animate="play"] .d,.rd-a-key[data-rd-animate="loop"] .d{animation:rd-key-draw calc(0.75s*var(--rd-speed,1)) ease-out;animation-delay:calc(var(--k)*.1s*var(--rd-speed,1))}.rd-a-key[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-key-draw{0%{stroke-dashoffset:1.2}100%{stroke-dashoffset:0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="d" style="--k:0"><circle pathLength="1" cx="8" cy="15.5" r="3.5"/></g><g class="d" style="--k:1"><path pathLength="1" d="M10.5 13L20 3.5"/></g><g class="d" style="--k:2"><path pathLength="1" d="M16.5 7l2.5 2.5"/></g><g class="d" style="--k:3"><path pathLength="1" d="M14 9.5l2 2"/></g></g></svg>
