<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-key" data-rd-animate="hover"><style>.rd-a-key{overflow:visible}.rd-a-key *{transform-box:view-box}.rd-a-key .a{transform-origin:12px 4px}@media (prefers-reduced-motion:no-preference){.rd-a-key[data-rd-animate="hover"]:hover .a,:hover>.rd-a-key[data-rd-animate="parent"] .a,.rd-a-key[data-rd-animate="play"] .a,.rd-a-key[data-rd-animate="loop"] .a{animation:rd-key-m calc(0.9s*var(--rd-speed,1)) ease-in-out}.rd-a-key[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-key-m{0%,100%{rotate:0deg}25%{rotate:16deg}50%{rotate:-12deg}75%{rotate:6deg}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><circle cx="8" cy="15.5" r="3.5"/><path d="M10.5 13L20 3.5M16.5 7l2.5 2.5M14 9.5l2 2"/></g></g></svg>
