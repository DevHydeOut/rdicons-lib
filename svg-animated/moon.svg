<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-moon" data-rd-animate="hover"><style>.rd-a-moon{overflow:visible}.rd-a-moon *{transform-box:view-box}@media (prefers-reduced-motion:no-preference){.rd-a-moon[data-rd-animate="hover"]:hover .a,:hover>.rd-a-moon[data-rd-animate="parent"] .a,.rd-a-moon[data-rd-animate="play"] .a,.rd-a-moon[data-rd-animate="loop"] .a{animation:rd-moon-m calc(1s*var(--rd-speed,1)) ease-in-out}.rd-a-moon[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-moon-m{0%,100%{translate:0 0}50%{translate:0 -2px}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10z"/></g></g></svg>
