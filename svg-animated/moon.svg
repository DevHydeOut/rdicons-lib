<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-moon" data-rd-animate="hover"><style>.rd-a-moon{overflow:visible}.rd-a-moon *{transform-box:view-box}.rd-a-moon .d{stroke-dasharray:1 2}@media (prefers-reduced-motion:no-preference){.rd-a-moon[data-rd-animate="hover"]:hover .d,:hover>.rd-a-moon[data-rd-animate="parent"] .d,.rd-a-moon[data-rd-animate="play"] .d,.rd-a-moon[data-rd-animate="loop"] .d{animation:rd-moon-draw calc(0.75s*var(--rd-speed,1)) ease-out;animation-delay:calc(var(--k)*.1s*var(--rd-speed,1))}.rd-a-moon[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-moon-draw{0%{stroke-dashoffset:1.2}100%{stroke-dashoffset:0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="d" style="--k:0"><path pathLength="1" d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10z"/></g></g></svg>
