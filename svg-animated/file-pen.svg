<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-file-pen" data-rd-animate="hover"><style>.rd-a-file-pen{overflow:visible}.rd-a-file-pen *{transform-box:view-box}.rd-a-file-pen .base{transform-origin:12px 12px}.rd-a-file-pen .badge{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:no-preference){.rd-a-file-pen[data-rd-animate="hover"]:hover .base,:hover>.rd-a-file-pen[data-rd-animate="parent"] .base,.rd-a-file-pen[data-rd-animate="play"] .base,.rd-a-file-pen[data-rd-animate="loop"] .base{animation:rd-file-pen-base calc(0.7s*var(--rd-speed,1)) ease-in-out}.rd-a-file-pen[data-rd-animate="hover"]:hover .badge,:hover>.rd-a-file-pen[data-rd-animate="parent"] .badge,.rd-a-file-pen[data-rd-animate="play"] .badge,.rd-a-file-pen[data-rd-animate="loop"] .badge{animation:rd-file-pen-badge calc(0.8s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-file-pen[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-file-pen-base{0%,100%{scale:1}40%{scale:.96}}@keyframes rd-file-pen-badge{0%,100%{scale:1;opacity:1}22%{scale:.1;opacity:0}62%{scale:1.3;opacity:1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="base"><path d="M13.5 3.5H8A3.5 3.5 0 0 0 4.5 7v10A3.5 3.5 0 0 0 8 20.5h8a3.5 3.5 0 0 0 3.5-3.5V9.5"/><path d="M13.5 3.5V7A2.5 2.5 0 0 0 16 9.5h3.5"/></g><g class="badge"><path d="M8.9 18.1l.6-2.3 4.6-4.6a1.4 1.4 0 0 1 2 2L11.5 17.5z"/></g></g></svg>
