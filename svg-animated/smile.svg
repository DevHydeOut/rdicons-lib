<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-smile" data-rd-animate="hover"><style>.rd-a-smile{overflow:visible}.rd-a-smile *{transform-box:view-box}.rd-a-smile .p0{transform-origin:12px 14px}.rd-a-smile .p1{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:no-preference){.rd-a-smile[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-smile[data-rd-animate="parent"] .p0,.rd-a-smile[data-rd-animate="play"] .p0,.rd-a-smile[data-rd-animate="loop"] .p0{animation:rd-smile-f0 calc(0.7s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1);animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-smile[data-rd-animate="hover"]:hover .p1,:hover>.rd-a-smile[data-rd-animate="parent"] .p1,.rd-a-smile[data-rd-animate="play"] .p1,.rd-a-smile[data-rd-animate="loop"] .p1{animation:rd-smile-f1 calc(0.5s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-smile[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-smile-f0{0%,100%{scale:1 1}45%{scale:1.1 1.5}}@keyframes rd-smile-f1{0%,100%{scale:1 1}45%{scale:1 .1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><circle cx="12" cy="12" r="8.5"/><g><g class="p0" style="--k:0;--s:1"><path d="M8.5 14a4 4 0 0 0 7 0"/></g></g><g><g class="p1" style="--k:0;--s:1"><path d="M9 9.8h.01"/></g><g class="p1" style="--k:1;--s:1"><path d="M15 9.8h.01"/></g></g></g></svg>
