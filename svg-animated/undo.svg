<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-undo" data-rd-animate="hover"><style>.rd-a-undo{overflow:visible}.rd-a-undo *{transform-box:view-box}.rd-a-undo .d{stroke-dasharray:1 2}@media (prefers-reduced-motion:no-preference){.rd-a-undo[data-rd-animate="hover"]:hover .d,:hover>.rd-a-undo[data-rd-animate="parent"] .d,.rd-a-undo[data-rd-animate="play"] .d,.rd-a-undo[data-rd-animate="loop"] .d{animation:rd-undo-draw calc(0.75s*var(--rd-speed,1)) ease-out;animation-delay:calc(var(--k)*.1s*var(--rd-speed,1))}.rd-a-undo[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-undo-draw{0%{stroke-dashoffset:1.2}100%{stroke-dashoffset:0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="d" style="--k:0"><path pathLength="1" d="M4.5 9h9a5.5 5.5 0 0 1 0 11H9"/></g><g class="d" style="--k:1"><path pathLength="1" d="M8.5 4.5L4.5 9l4 4.5"/></g></g></svg>
