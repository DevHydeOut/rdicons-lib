<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-mail-open" data-rd-animate="hover"><style>.rd-a-mail-open{overflow:visible}.rd-a-mail-open *{transform-box:view-box}.rd-a-mail-open .flap{transform-origin:12px 10px}@media (prefers-reduced-motion:no-preference){.rd-a-mail-open[data-rd-animate="hover"]:hover .flap,:hover>.rd-a-mail-open[data-rd-animate="parent"] .flap,.rd-a-mail-open[data-rd-animate="play"] .flap,.rd-a-mail-open[data-rd-animate="loop"] .flap{animation:rd-mail-open-flap calc(0.7s*var(--rd-speed,1)) ease-in-out}.rd-a-mail-open[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-mail-open-flap{0%,100%{scale:1 1}45%,60%{scale:1 -.5}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><path d="M3.5 10l8.5-6 8.5 6v8.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/><path class="flap" d="M3.5 10l8.5 5.5 8.5-5.5"/></g></svg>
