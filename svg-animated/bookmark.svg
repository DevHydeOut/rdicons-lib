<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-bookmark" data-rd-animate="hover"><style>.rd-a-bookmark{overflow:visible}.rd-a-bookmark *{transform-box:view-box}.rd-a-bookmark .d{stroke-dasharray:1 2}@media (prefers-reduced-motion:no-preference){.rd-a-bookmark[data-rd-animate="hover"]:hover .d,:hover>.rd-a-bookmark[data-rd-animate="parent"] .d,.rd-a-bookmark[data-rd-animate="play"] .d,.rd-a-bookmark[data-rd-animate="loop"] .d{animation:rd-bookmark-draw calc(0.75s*var(--rd-speed,1)) ease-out;animation-delay:calc(var(--k)*.1s*var(--rd-speed,1))}.rd-a-bookmark[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-bookmark-draw{0%{stroke-dashoffset:1.2}100%{stroke-dashoffset:0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="d" style="--k:0"><path pathLength="1" d="M7 4.5h10a1.5 1.5 0 0 1 1.5 1.5v14.2L12 16l-6.5 4.2V6A1.5 1.5 0 0 1 7 4.5z"/></g></g></svg>
