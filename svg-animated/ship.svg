<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-ship" data-rd-animate="hover"><style>.rd-a-ship{overflow:visible}.rd-a-ship *{transform-box:view-box}.rd-a-ship .p0{transform-origin:12px 17px}@media (prefers-reduced-motion:no-preference){.rd-a-ship[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-ship[data-rd-animate="parent"] .p0,.rd-a-ship[data-rd-animate="play"] .p0,.rd-a-ship[data-rd-animate="loop"] .p0{animation:rd-ship-f0 calc(0.9s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-ship[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-ship-f0{0%,100%{rotate:0deg}35%{rotate:-7deg}70%{rotate:5deg}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g><g class="p0" style="--k:0;--s:1"><path d="M3.5 15l1.5 4.5h14l1.5-4.5z"/><path d="M7 15V9.5h10V15"/><path d="M10.5 9.5V6.5h3v3"/><path d="M12 4v2.5"/></g></g></g></svg>
