<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-circle-ellipsis" data-rd-animate="hover"><style>.rd-a-circle-ellipsis{overflow:visible}.rd-a-circle-ellipsis *{transform-box:view-box}.rd-a-circle-ellipsis .a{transform-origin:4px 20px}@media (prefers-reduced-motion:no-preference){.rd-a-circle-ellipsis[data-rd-animate="hover"]:hover .a,:hover>.rd-a-circle-ellipsis[data-rd-animate="parent"] .a,.rd-a-circle-ellipsis[data-rd-animate="play"] .a,.rd-a-circle-ellipsis[data-rd-animate="loop"] .a{animation:rd-circle-ellipsis-m calc(0.8s*var(--rd-speed,1)) ease-in-out}.rd-a-circle-ellipsis[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-circle-ellipsis-m{0%,100%{rotate:0deg}30%{rotate:-9deg}65%{rotate:7deg}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><circle cx="12" cy="12" r="8.5"/><path d="M8 12h.01"/><path d="M12 12h.01"/><path d="M16 12h.01"/></g></g></svg>
