<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-tv" data-rd-animate="hover"><style>.rd-a-tv{overflow:visible}.rd-a-tv *{transform-box:view-box}.rd-a-tv .p0{transform-origin:12px 7px}@media (prefers-reduced-motion:no-preference){.rd-a-tv[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-tv[data-rd-animate="parent"] .p0,.rd-a-tv[data-rd-animate="play"] .p0,.rd-a-tv[data-rd-animate="loop"] .p0{animation:rd-tv-f0 calc(1s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-tv[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-tv-f0{0%,100%{rotate:0deg}30%{rotate:calc(var(--s)*8deg)}65%{rotate:calc(var(--s)*-6deg)}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><path d="M20.78 9.28A3.5 3.5 0 0 1 21 10.5V16.5A3.5 3.5 0 0 1 17.5 20H6.5A3.5 3.5 0 0 1 3 16.5V10.5A3.5 3.5 0 0 1 6.5 7H17.5A3.5 3.5 0 0 1 18.72 7.22"/><g><g class="p0" style="--k:0;--s:1"><path d="M8.5 3l3.5 4 3.5-4"/></g></g></g></svg>
