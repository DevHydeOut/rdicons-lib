<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-list-minus" data-rd-animate="hover"><style>.rd-a-list-minus{overflow:visible}.rd-a-list-minus *{transform-box:view-box}.rd-a-list-minus .d{stroke-dasharray:1 2}@media (prefers-reduced-motion:no-preference){.rd-a-list-minus[data-rd-animate="hover"]:hover .d,:hover>.rd-a-list-minus[data-rd-animate="parent"] .d,.rd-a-list-minus[data-rd-animate="play"] .d,.rd-a-list-minus[data-rd-animate="loop"] .d{animation:rd-list-minus-draw calc(0.75s*var(--rd-speed,1)) ease-out;animation-delay:calc(var(--k)*.1s*var(--rd-speed,1))}.rd-a-list-minus[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-list-minus-draw{0%{stroke-dashoffset:1.2}100%{stroke-dashoffset:0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="d" style="--k:0"><path pathLength="1" d="M4 6.5h13"/></g><g class="d" style="--k:1"><path pathLength="1" d="M4 12h13"/></g><g class="d" style="--k:2"><path pathLength="1" d="M4 17.5h7"/></g><g class="d" style="--k:3"><path pathLength="1" d="M13 18.5h6"/></g></g></svg>
