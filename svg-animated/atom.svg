<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-atom" data-rd-animate="hover"><style>.rd-a-atom{overflow:visible}.rd-a-atom *{transform-box:view-box}.rd-a-atom .a{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-atom[data-rd-animate="hover"]:hover .a,:hover>.rd-a-atom[data-rd-animate="parent"] .a,.rd-a-atom[data-rd-animate="play"] .a,.rd-a-atom[data-rd-animate="loop"] .a{animation:rd-atom-m calc(0.7s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-atom[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-atom-m{0%,100%{scale:1}35%{scale:.88}65%{scale:1.1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><circle cx="12" cy="12" r="1.5"/><ellipse cx="12" cy="12" rx="9.5" ry="3.8"/><ellipse cx="12" cy="12" rx="9.5" ry="3.8" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="9.5" ry="3.8" transform="rotate(120 12 12)"/></g></g></svg>
