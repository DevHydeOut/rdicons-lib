<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-atom" data-rd-animate="hover"><style>.rd-a-atom{overflow:visible}.rd-a-atom *{transform-box:view-box}.rd-a-atom .p0{transform-origin:12px 12px}.rd-a-atom .p1{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-atom[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-atom[data-rd-animate="parent"] .p0,.rd-a-atom[data-rd-animate="play"] .p0,.rd-a-atom[data-rd-animate="loop"] .p0{animation:rd-atom-f0 calc(0.8s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-atom[data-rd-animate="hover"]:hover .p1,:hover>.rd-a-atom[data-rd-animate="parent"] .p1,.rd-a-atom[data-rd-animate="play"] .p1,.rd-a-atom[data-rd-animate="loop"] .p1{animation:rd-atom-f1 calc(0.9s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-atom[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-atom-f0{0%,100%{scale:1}45%{scale:1.08}}@keyframes rd-atom-f1{0%{rotate:0deg}100%{rotate:360deg}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g><g class="p0" style="--k:0;--s:1"><circle cx="12" cy="12" r="1.5"/></g></g><g><g class="p1" style="--k:0;--s:1"><ellipse cx="12" cy="12" rx="9.5" ry="3.8"/><ellipse cx="12" cy="12" rx="9.5" ry="3.8" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="9.5" ry="3.8" transform="rotate(120 12 12)"/></g></g></g></svg>
