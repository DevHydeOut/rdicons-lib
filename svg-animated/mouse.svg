<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-mouse" data-rd-animate="hover"><style>.rd-a-mouse{overflow:visible}.rd-a-mouse *{transform-box:view-box}@media (prefers-reduced-motion:no-preference){.rd-a-mouse[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-mouse[data-rd-animate="parent"] .p0,.rd-a-mouse[data-rd-animate="play"] .p0,.rd-a-mouse[data-rd-animate="loop"] .p0{animation:rd-mouse-f0 calc(0.8s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-mouse[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-mouse-f0{0%,100%{translate:0 0;opacity:1}50%{translate:0 2px;opacity:.2}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><rect x="7" y="2.5" width="10" height="19" rx="5"/><g><g class="p0" style="--k:0;--s:1"><path d="M12 7v3.5"/></g></g></g></svg>
