<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-mouse" data-rd-animate="hover"><style>.rd-a-mouse{overflow:visible}.rd-a-mouse *{transform-box:view-box}.rd-a-mouse .a{transform-origin:12px 20px}@media (prefers-reduced-motion:no-preference){.rd-a-mouse[data-rd-animate="hover"]:hover .a,:hover>.rd-a-mouse[data-rd-animate="parent"] .a,.rd-a-mouse[data-rd-animate="play"] .a,.rd-a-mouse[data-rd-animate="loop"] .a{animation:rd-mouse-m calc(0.7s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-mouse[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-mouse-m{0%,100%{scale:1 1}40%{scale:1.1 .86}70%{scale:.95 1.06}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><rect x="7" y="2.5" width="10" height="19" rx="5"/><path d="M12 7v3.5"/></g></g></svg>
