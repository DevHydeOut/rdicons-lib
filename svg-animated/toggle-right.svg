<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-toggle-right" data-rd-animate="hover"><style>.rd-a-toggle-right{overflow:visible}.rd-a-toggle-right *{transform-box:view-box}@media (prefers-reduced-motion:no-preference){.rd-a-toggle-right[data-rd-animate="hover"]:hover .knob,:hover>.rd-a-toggle-right[data-rd-animate="parent"] .knob,.rd-a-toggle-right[data-rd-animate="play"] .knob,.rd-a-toggle-right[data-rd-animate="loop"] .knob{animation:rd-toggle-right-knob calc(0.8s*var(--rd-speed,1)) ease-in-out}.rd-a-toggle-right[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-toggle-right-knob{0%,100%{translate:0 0}40%,62%{translate:-8px 0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><rect x="2.5" y="6.5" width="19" height="11" rx="5.5"/><circle cx="16" cy="12" r="3"/></g></svg>
