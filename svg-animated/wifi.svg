<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-wifi" data-rd-animate="hover"><style>.rd-a-wifi{overflow:visible}.rd-a-wifi *{transform-box:view-box}@media (prefers-reduced-motion:no-preference){.rd-a-wifi[data-rd-animate="hover"]:hover .w0,:hover>.rd-a-wifi[data-rd-animate="parent"] .w0,.rd-a-wifi[data-rd-animate="play"] .w0,.rd-a-wifi[data-rd-animate="loop"] .w0{animation:rd-wifi-wave calc(0.8s*var(--rd-speed,1)) ease-in-out}.rd-a-wifi[data-rd-animate="hover"]:hover .w1,:hover>.rd-a-wifi[data-rd-animate="parent"] .w1,.rd-a-wifi[data-rd-animate="play"] .w1,.rd-a-wifi[data-rd-animate="loop"] .w1{animation:rd-wifi-wave calc(0.8s*var(--rd-speed,1)) ease-in-out calc(0.1s*var(--rd-speed,1))}.rd-a-wifi[data-rd-animate="hover"]:hover .w2,:hover>.rd-a-wifi[data-rd-animate="parent"] .w2,.rd-a-wifi[data-rd-animate="play"] .w2,.rd-a-wifi[data-rd-animate="loop"] .w2{animation:rd-wifi-wave calc(0.8s*var(--rd-speed,1)) ease-in-out calc(0.2s*var(--rd-speed,1))}.rd-a-wifi[data-rd-animate="hover"]:hover .w3,:hover>.rd-a-wifi[data-rd-animate="parent"] .w3,.rd-a-wifi[data-rd-animate="play"] .w3,.rd-a-wifi[data-rd-animate="loop"] .w3{animation:rd-wifi-wave calc(0.8s*var(--rd-speed,1)) ease-in-out calc(0.3s*var(--rd-speed,1))}.rd-a-wifi[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-wifi-wave{0%,100%{opacity:1}30%{opacity:.12}60%{opacity:1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><path class="w3" d="M3 9.5a13 13 0 0 1 18 0"/><path class="w2" d="M6 12.8a8.5 8.5 0 0 1 12 0"/><path class="w1" d="M9 16a4 4 0 0 1 6 0"/><path class="w0" d="M12 19.2h.01"/></g></svg>
