<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-message-square-plus" data-rd-animate="hover"><style>.rd-a-message-square-plus{overflow:visible}.rd-a-message-square-plus *{transform-box:view-box}.rd-a-message-square-plus .base{transform-origin:12px 12px}.rd-a-message-square-plus .badge{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:no-preference){.rd-a-message-square-plus[data-rd-animate="hover"]:hover .base,:hover>.rd-a-message-square-plus[data-rd-animate="parent"] .base,.rd-a-message-square-plus[data-rd-animate="play"] .base,.rd-a-message-square-plus[data-rd-animate="loop"] .base{animation:rd-message-square-plus-base calc(0.7s*var(--rd-speed,1)) ease-in-out}.rd-a-message-square-plus[data-rd-animate="hover"]:hover .badge,:hover>.rd-a-message-square-plus[data-rd-animate="parent"] .badge,.rd-a-message-square-plus[data-rd-animate="play"] .badge,.rd-a-message-square-plus[data-rd-animate="loop"] .badge{animation:rd-message-square-plus-badge calc(0.8s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-message-square-plus[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-message-square-plus-base{0%,100%{scale:1}40%{scale:.96}}@keyframes rd-message-square-plus-badge{0%,100%{scale:1;opacity:1}22%{scale:.1;opacity:0}62%{scale:1.3;opacity:1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="base"><path d="M7 4.5h10a3.5 3.5 0 0 1 3.5 3.5v5a3.5 3.5 0 0 1-3.5 3.5h-6.5L6 20.5v-4h1A3.5 3.5 0 0 1 3.5 13V8A3.5 3.5 0 0 1 7 4.5z"/></g><g class="badge"><path d="M12 7.5v6M9 10.5h6"/></g></g></svg>
