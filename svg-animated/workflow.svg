<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-workflow" data-rd-animate="hover"><style>.rd-a-workflow{overflow:visible}.rd-a-workflow *{transform-box:view-box}.rd-a-workflow .p0{transform-box:fill-box;transform-origin:center}.rd-a-workflow .p1{transform-box:fill-box;transform-origin:center}.rd-a-workflow .p2{stroke-dasharray:1 2}@media (prefers-reduced-motion:no-preference){.rd-a-workflow[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-workflow[data-rd-animate="parent"] .p0,.rd-a-workflow[data-rd-animate="play"] .p0,.rd-a-workflow[data-rd-animate="loop"] .p0{animation:rd-workflow-f0 calc(0.5s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1);animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-workflow[data-rd-animate="hover"]:hover .p1,:hover>.rd-a-workflow[data-rd-animate="parent"] .p1,.rd-a-workflow[data-rd-animate="play"] .p1,.rd-a-workflow[data-rd-animate="loop"] .p1{animation:rd-workflow-f1 calc(0.5s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1);animation-delay:calc((0.2s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-workflow[data-rd-animate="hover"]:hover .p2,:hover>.rd-a-workflow[data-rd-animate="parent"] .p2,.rd-a-workflow[data-rd-animate="play"] .p2,.rd-a-workflow[data-rd-animate="loop"] .p2{animation:rd-workflow-f2 calc(0.75s*var(--rd-speed,1)) ease-out;animation-delay:calc((0.1s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-workflow[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-workflow-f0{0%,100%{scale:1}40%{scale:1.5}}@keyframes rd-workflow-f1{0%,100%{scale:1}40%{scale:1.5}}@keyframes rd-workflow-f2{0%{stroke-dashoffset:1.2}100%{stroke-dashoffset:0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g><g class="p0" style="--k:0;--s:1"><rect x="3.5" y="3.5" width="6" height="6" rx="1.5"/></g></g><g><g class="p1" style="--k:0;--s:1"><rect x="14.5" y="14.5" width="6" height="6" rx="1.5"/></g></g><g><g class="p2"