<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-fish" data-rd-animate="hover"><style>.rd-a-fish{overflow:visible}.rd-a-fish *{transform-box:view-box}.rd-a-fish .p0{transform-origin:12px 12px}.rd-a-fish .p1{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:no-preference){.rd-a-fish[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-fish[data-rd-animate="parent"] .p0,.rd-a-fish[data-rd-animate="play"] .p0,.rd-a-fish[data-rd-animate="loop"] .p0{animation:rd-fish-f0 calc(0.9s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-fish[data-rd-animate="hover"]:hover .p1,:hover>.rd-a-fish[data-rd-animate="parent"] .p1,.rd-a-fish[data-rd-animate="play"] .p1,.rd-a-fish[data-rd-animate="loop"] .p1{animation:rd-fish-f1 calc(0.5s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-fish[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-fish-f0{0%,100%{rotate:0deg}35%{rotate:-7deg}70%{rotate:5deg}}@keyframes rd-fish-f1{0%,100%{scale:1 1}45%{scale:1 .1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g><g class="p0" style="--k:0;--s:1"><path d="M3.5 12c3-4.5 7-5.5 11-4l1.5 1.5L20.5 7v10l-4.5-2.5-1.5 1.5c-4 1.5-8 .5-11-4z"/></g></g><g><g class="p1" style="--k:0;--s:1"><path d="M8 11.5h.01"/></g></g></g></svg>
