<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-cat" data-rd-animate="hover"><style>.rd-a-cat{overflow:visible}.rd-a-cat *{transform-box:view-box}.rd-a-cat .p0{transform-box:fill-box;transform-origin:center}.rd-a-cat .p1{transform-origin:12px 14px}@media (prefers-reduced-motion:no-preference){.rd-a-cat[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-cat[data-rd-animate="parent"] .p0,.rd-a-cat[data-rd-animate="play"] .p0,.rd-a-cat[data-rd-animate="loop"] .p0{animation:rd-cat-f0 calc(0.5s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-cat[data-rd-animate="hover"]:hover .p1,:hover>.rd-a-cat[data-rd-animate="parent"] .p1,.rd-a-cat[data-rd-animate="play"] .p1,.rd-a-cat[data-rd-animate="loop"] .p1{animation:rd-cat-f1 calc(0.9s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-cat[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-cat-f0{0%,100%{scale:1 1}45%{scale:1 .1}}@keyframes rd-cat-f1{0%,100%{rotate:0deg}35%{rotate:-7deg}70%{rotate:5deg}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><path d="M11 16h2"/><g><g class="p0" style="--k:0;--s:1"><path d="M9.5 13h0.01"/></g><g class="p0" style="--k:1;--s:1"><path d="M14.5 13h0.01"/></g></g><g><g class="p1" style="--k:0;--s:1"><path d="M5 11V6l3.5 2.5h7L19 6v5a7 7 0 0 1 -14 0z"/></g></g></g></svg>
