<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-line-chart" data-rd-animate="hover"><style>.rd-a-line-chart{overflow:visible}.rd-a-line-chart *{transform-box:view-box}.rd-a-line-chart .a{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-line-chart[data-rd-animate="hover"]:hover .a,:hover>.rd-a-line-chart[data-rd-animate="parent"] .a,.rd-a-line-chart[data-rd-animate="play"] .a,.rd-a-line-chart[data-rd-animate="loop"] .a{animation:rd-line-chart-m calc(0.7s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-line-chart[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-line-chart-m{0%,100%{scale:1}35%{scale:.88}65%{scale:1.1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><path d="M3.5 3.5v15a2 2 0 0 0 2 2h15"/><path d="M7 15l4-5 3 3 5-6"/></g></g></svg>
