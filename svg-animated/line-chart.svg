<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-line-chart" data-rd-animate="hover"><style>.rd-a-line-chart{overflow:visible}.rd-a-line-chart *{transform-box:view-box}.rd-a-line-chart .d{stroke-dasharray:1 2}@media (prefers-reduced-motion:no-preference){.rd-a-line-chart[data-rd-animate="hover"]:hover .d,:hover>.rd-a-line-chart[data-rd-animate="parent"] .d,.rd-a-line-chart[data-rd-animate="play"] .d,.rd-a-line-chart[data-rd-animate="loop"] .d{animation:rd-line-chart-draw calc(0.75s*var(--rd-speed,1)) ease-out;animation-delay:calc(var(--k)*.1s*var(--rd-speed,1))}.rd-a-line-chart[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-line-chart-draw{0%{stroke-dashoffset:1.2}100%{stroke-dashoffset:0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="d" style="--k:0"><path pathLength="1" d="M3.5 3.5v15a2 2 0 0 0 2 2h15"/></g><g class="d" style="--k:1"><path pathLength="1" d="M7 15l4-5 3 3 5-6"/></g></g></svg>
