<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-user-search" data-rd-animate="hover"><style>.rd-a-user-search{overflow:visible}.rd-a-user-search *{transform-box:view-box}.rd-a-user-search .base{transform-origin:12px 12px}.rd-a-user-search .badge{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:no-preference){.rd-a-user-search[data-rd-animate="hover"]:hover .base,:hover>.rd-a-user-search[data-rd-animate="parent"] .base,.rd-a-user-search[data-rd-animate="play"] .base,.rd-a-user-search[data-rd-animate="loop"] .base{animation:rd-user-search-base calc(0.7s*var(--rd-speed,1)) ease-in-out}.rd-a-user-search[data-rd-animate="hover"]:hover .badge,:hover>.rd-a-user-search[data-rd-animate="parent"] .badge,.rd-a-user-search[data-rd-animate="play"] .badge,.rd-a-user-search[data-rd-animate="loop"] .badge{animation:rd-user-search-badge calc(0.8s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-user-search[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-user-search-base{0%,100%{scale:1}40%{scale:.96}}@keyframes rd-user-search-badge{0%,100%{scale:1;opacity:1}22%{scale:.1;opacity:0}62%{scale:1.3;opacity:1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="base"><circle cx="10" cy="8" r="4"/><path d="M2.5 20c.5-3.6 3.5-5.5 7.5-5.5 1.2 0 2.3.2 3.2.6"/></g><g class="badge"><circle cx="17.5" cy="17" r="2.8"/><path d="M19.5 19l2 2"/></g></g></svg>
