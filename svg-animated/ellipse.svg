<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-ellipse" data-rd-animate="hover"><style>.rd-a-ellipse{overflow:visible}.rd-a-ellipse *{transform-box:view-box}.rd-a-ellipse .a{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-ellipse[data-rd-animate="hover"]:hover .a,:hover>.rd-a-ellipse[data-rd-animate="parent"] .a,.rd-a-ellipse[data-rd-animate="play"] .a,.rd-a-ellipse[data-rd-animate="loop"] .a{animation:rd-ellipse-m calc(0.7s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-ellipse[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-ellipse-m{0%,100%{scale:1 1}40%{scale:1.14 1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><ellipse cx="12" cy="12" rx="8.5" ry="5.5"/></g></g></svg>
