<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-bar-chart" data-rd-animate="hover"><style>.rd-a-bar-chart{overflow:visible}.rd-a-bar-chart *{transform-box:view-box}.rd-a-bar-chart .p0{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:no-preference){.rd-a-bar-chart[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-bar-chart[data-rd-animate="parent"] .p0,.rd-a-bar-chart[data-rd-animate="play"] .p0,.rd-a-bar-chart[data-rd-animate="loop"] .p0{animation:rd-bar-chart-f0 calc(0.8s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1);animation-delay:calc((0s + var(--k)*0.12s)*var(--rd-speed,1))}.rd-a-bar-chart[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-bar-chart-f0{0%,100%{scale:1 1}45%{scale:1 1.2}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g><g class="p0" style="--k:0;--s:1"><path d="M5 20V11"/></g><g class="p0" style="--k:1;--s:1"><path d="M12 20V4"/></g><g class="p0" style="--k:2;--s:1"><path d="M19 20v-6"/></g></g></g></svg>
