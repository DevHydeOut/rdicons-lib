<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-window" data-rd-animate="hover"><style>.rd-a-window{overflow:visible}.rd-a-window *{transform-box:view-box}.rd-a-window .shape{transform-origin:12px 12px}.rd-a-window .bar{transform-origin:3.7px 9.5px}.rd-a-window .close{stroke-dasharray:1 2;stroke-dashoffset:1.2}@media (prefers-reduced-motion:no-preference){.rd-a-window[data-rd-animate="hover"]:hover .close,:hover>.rd-a-window[data-rd-animate="parent"] .close,.rd-a-window[data-rd-animate="play"] .close,.rd-a-window[data-rd-animate="loop"] .close{animation:rd-window-close calc(0.9s*var(--rd-speed,1)) ease-in-out}.rd-a-window[data-rd-animate="hover"]:hover .shape,:hover>.rd-a-window[data-rd-animate="parent"] .shape,.rd-a-window[data-rd-animate="play"] .shape,.rd-a-window[data-rd-animate="loop"] .shape{animation:rd-window-seal calc(0.9s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-window[data-rd-animate="hover"]:hover .bar,:hover>.rd-a-window[data-rd-animate="parent"] .bar,.rd-a-window[data-rd-animate="play"] .bar,.rd-a-window[data-rd-animate="loop"] .bar{animation:rd-window-bar calc(0.9s*var(--rd-speed,1)) ease-in-out}.rd-a-window[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-window-close{0%,100%{stroke-dashoffset:1.2}30%,68%{stroke-dashoffset:0}}@keyframes rd-window-seal{0%,100%{scale:1}34%{scale:.95}52%{scale:1.03}}@keyframes rd-window-bar{0%,100%{scale:1 1}38%{scale:.55 1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="shape"><path d="M20.17 6.9A4 4 0 0 1 20.5 8.5V15.5A4 4 0 0 1 16.5 19.5H7.5A4 4 0 0 1 3.5 15.5V8.5A4 4 0 0 1 7.5 4.5H16.5A4 4 0 0 1 18.1 4.83"/><path class="close" pathLength="1" d="M18.1 4.83A4 4 0 0 1 20.17 6.9"/><path class="bar" d="M3.7 9.5h16.6"/></g></g></svg>
