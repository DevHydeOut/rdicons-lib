<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-flower" data-rd-animate="hover"><style>.rd-a-flower{overflow:visible}.rd-a-flower *{transform-box:view-box}.rd-a-flower .a{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-flower[data-rd-animate="hover"]:hover .a,:hover>.rd-a-flower[data-rd-animate="parent"] .a,.rd-a-flower[data-rd-animate="play"] .a,.rd-a-flower[data-rd-animate="loop"] .a{animation:rd-flower-m calc(0.9s*var(--rd-speed,1)) ease-in-out}.rd-a-flower[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-flower-m{0%{rotate:0deg}100%{rotate:360deg}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><circle cx="12" cy="12" r="2.2"/><circle cx="12" cy="6.8" r="2.8"/><circle cx="17.2" cy="12" r="2.8"/><circle cx="12" cy="17.2" r="2.8"/><circle cx="6.8" cy="12" r="2.8"/></g></g></svg>
