<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-pentagon" data-rd-animate="hover"><style>.rd-a-pentagon{overflow:visible}.rd-a-pentagon *{transform-box:view-box}.rd-a-pentagon .a{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-pentagon[data-rd-animate="hover"]:hover .a,:hover>.rd-a-pentagon[data-rd-animate="parent"] .a,.rd-a-pentagon[data-rd-animate="play"] .a,.rd-a-pentagon[data-rd-animate="loop"] .a{animation:rd-pentagon-m calc(0.7s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-pentagon[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-pentagon-m{0%,100%{scale:1}35%{scale:.88}65%{scale:1.1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><path d="M12 3.5l8.5 6.2-3.2 10.3H6.7L3.5 9.7z"/></g></g></svg>
