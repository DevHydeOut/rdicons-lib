<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-hard-drive" data-rd-animate="hover"><style>.rd-a-hard-drive{overflow:visible}.rd-a-hard-drive *{transform-box:view-box}@media (prefers-reduced-motion:no-preference){.rd-a-hard-drive[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-hard-drive[data-rd-animate="parent"] .p0,.rd-a-hard-drive[data-rd-animate="play"] .p0,.rd-a-hard-drive[data-rd-animate="loop"] .p0{animation:rd-hard-drive-f0 calc(0.7s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-hard-drive[data-rd-animate="hover"]:hover .p1,:hover>.rd-a-hard-drive[data-rd-animate="parent"] .p1,.rd-a-hard-drive[data-rd-animate="play"] .p1,.rd-a-hard-drive[data-rd-animate="loop"] .p1{animation:rd-hard-drive-f1 calc(0.7s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0.25s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-hard-drive[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-hard-drive-f0{0%,100%{opacity:1}40%{opacity:.15}}@keyframes rd-hard-drive-f1{0%,100%{opacity:1}40%{opacity:.15}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><path d="M20.28 8.78A3.5 3.5 0 0 1 20.5 10V14A3.5 3.5 0 0 1 17 17.5H7A3.5 3.5 0 0 1 3.5 14V10A3.5 3.5 0 0 1 7 6.5H17A3.5 3.5 0 0 1 18.22 6.72"/><path d="M3.7 13h16.6"/><g><g class="p0" style="--k:0;--s:1"><path d="M7 15.5h.01"/></g></g><g><g class="p1" style="--k:0;--s:1"><path d="M10 15.5h.01"/></g></g></g></svg>
