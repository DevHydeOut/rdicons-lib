<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-receipt-check" data-rd-animate="hover"><style>.rd-a-receipt-check{overflow:visible}.rd-a-receipt-check *{transform-box:view-box}.rd-a-receipt-check .base{transform-origin:12px 12px}.rd-a-receipt-check .badge{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:no-preference){.rd-a-receipt-check[data-rd-animate="hover"]:hover .base,:hover>.rd-a-receipt-check[data-rd-animate="parent"] .base,.rd-a-receipt-check[data-rd-animate="play"] .base,.rd-a-receipt-check[data-rd-animate="loop"] .base{animation:rd-receipt-check-base calc(0.7s*var(--rd-speed,1)) ease-in-out}.rd-a-receipt-check[data-rd-animate="hover"]:hover .badge,:hover>.rd-a-receipt-check[data-rd-animate="parent"] .badge,.rd-a-receipt-check[data-rd-animate="play"] .badge,.rd-a-receipt-check[data-rd-animate="loop"] .badge{animation:rd-receipt-check-badge calc(0.8s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-receipt-check[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-receipt-check-base{0%,100%{scale:1}40%{scale:.96}}@keyframes rd-receipt-check-badge{0%,100%{scale:1;opacity:1}22%{scale:.1;opacity:0}62%{scale:1.3;opacity:1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="base"><path d="M6 3.5h12v17l-2-1.5-2 1.5-2-1.5-2 1.5-2-1.5-2 1.5z"/></g><g class="badge"><path d="M9.3 11.5l1.8 1.8 3.6-3.8"/></g></g></svg>
