<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-circle-slash" data-rd-animate="hover"><style>.rd-a-circle-slash{overflow:visible}.rd-a-circle-slash *{transform-box:view-box}.rd-a-circle-slash .p0{stroke-dasharray:1 2}.rd-a-circle-slash .p1{stroke-dasharray:1 2}@media (prefers-reduced-motion:no-preference){.rd-a-circle-slash[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-circle-slash[data-rd-animate="parent"] .p0,.rd-a-circle-slash[data-rd-animate="play"] .p0,.rd-a-circle-slash[data-rd-animate="loop"] .p0{animation:rd-circle-slash-f0 calc(0.75s*var(--rd-speed,1)) ease-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-circle-slash[data-rd-animate="hover"]:hover .p1,:hover>.rd-a-circle-slash[data-rd-animate="parent"] .p1,.rd-a-circle-slash[data-rd-animate="play"] .p1,.rd-a-circle-slash[data-rd-animate="loop"] .p1{animation:rd-circle-slash-f1 calc(0.75s*var(--rd-speed,1)) ease-out;animation-delay:calc((0.3s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-circle-slash[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-circle-slash-f0{0%{stroke-dashoffset:1.2}100%{stroke-dashoffset:0}}@keyframes rd-circle-slash-f1{0%{stroke-dashoffset:1.2}100%{stroke-dashoffset:0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g><g class="p0" style="--k:0;--s:1"><circle pathLength="1" cx="12" cy="12" r="8.5"/></g></g><g><g class="p1" style="--k:0;--s:1"><path pathLength="1" d="M6 6l12 12"/></g></g></g></svg>
