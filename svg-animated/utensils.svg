<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-utensils" data-rd-animate="hover"><style>.rd-a-utensils{overflow:visible}.rd-a-utensils *{transform-box:view-box}.rd-a-utensils .p0{transform-origin:8px 20.5px}.rd-a-utensils .p1{transform-origin:17.5px 20.5px}@media (prefers-reduced-motion:no-preference){.rd-a-utensils[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-utensils[data-rd-animate="parent"] .p0,.rd-a-utensils[data-rd-animate="play"] .p0,.rd-a-utensils[data-rd-animate="loop"] .p0{animation:rd-utensils-f0 calc(0.6s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1);animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-utensils[data-rd-animate="hover"]:hover .p1,:hover>.rd-a-utensils[data-rd-animate="parent"] .p1,.rd-a-utensils[data-rd-animate="play"] .p1,.rd-a-utensils[data-rd-animate="loop"] .p1{animation:rd-utensils-f1 calc(0.6s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1);animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-utensils[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-utensils-f0{0%,100%{rotate:0deg}40%{rotate:14deg}}@keyframes rd-utensils-f1{0%,100%{rotate:0deg}40%{rotate:-14deg}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g><g class="p0" style="--k:0;--s:1"><path d="M6 3.5v6a2 2 0 0 0 4 0v-6M8 3.5v17"/></g></g><g><g class="p1" style="--k:0;--s:1"><path d="M17.5 20.5V3.5c-2 1-3.5 3.5-3.5 7v3h3.5"/></g></g></g></svg>
