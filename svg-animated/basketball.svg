<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-basketball" data-rd-animate="hover"><style>.rd-a-basketball{overflow:visible}.rd-a-basketball *{transform-box:view-box}.rd-a-basketball .a{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-basketball[data-rd-animate="hover"]:hover .a,:hover>.rd-a-basketball[data-rd-animate="parent"] .a,.rd-a-basketball[data-rd-animate="play"] .a,.rd-a-basketball[data-rd-animate="loop"] .a{animation:rd-basketball-m calc(0.7s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-basketball[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-basketball-m{0%,100%{scale:1}35%{scale:.88}65%{scale:1.1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5v17M6 5.5c3 3 3 10 0 13M18 5.5c-3 3-3 10 0 13"/></g></g></svg>
