<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-tree-pine" data-rd-animate="hover"><style>.rd-a-tree-pine{overflow:visible}.rd-a-tree-pine *{transform-box:view-box}.rd-a-tree-pine .p0{transform-origin:12px 15px}@media (prefers-reduced-motion:no-preference){.rd-a-tree-pine[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-tree-pine[data-rd-animate="parent"] .p0,.rd-a-tree-pine[data-rd-animate="play"] .p0,.rd-a-tree-pine[data-rd-animate="loop"] .p0{animation:rd-tree-pine-f0 calc(1s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-tree-pine[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-tree-pine-f0{0%,100%{rotate:0deg}30%{rotate:calc(var(--s)*8deg)}65%{rotate:calc(var(--s)*-6deg)}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><path d="M12 15v5.5"/><g><g class="p0" style="--k:0;--s:1"><path d="M12 3.5l5 6h-2.5l4 5.5H5.5l4-5.5H7z"/></g></g></g></svg>
