<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-fast-forward" data-rd-animate="hover"><style>.rd-a-fast-forward{overflow:visible}.rd-a-fast-forward *{transform-box:view-box}@media (prefers-reduced-motion:no-preference){.rd-a-fast-forward[data-rd-animate="hover"]:hover .a1,:hover>.rd-a-fast-forward[data-rd-animate="parent"] .a1,.rd-a-fast-forward[data-rd-animate="play"] .a1,.rd-a-fast-forward[data-rd-animate="loop"] .a1{animation:rd-fast-forward-go calc(0.7s*var(--rd-speed,1)) ease-in-out}.rd-a-fast-forward[data-rd-animate="hover"]:hover .a2,:hover>.rd-a-fast-forward[data-rd-animate="parent"] .a2,.rd-a-fast-forward[data-rd-animate="play"] .a2,.rd-a-fast-forward[data-rd-animate="loop"] .a2{animation:rd-fast-forward-go calc(0.7s*var(--rd-speed,1)) ease-in-out;animation-delay:calc(0.1s*var(--rd-speed,1))}.rd-a-fast-forward[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-fast-forward-go{0%,100%{translate:0 0}40%{translate:2.5px 0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><path class="a1" d="M3.5 6.5v11l8-5.5z"/><path class="a2" d="M12.5 6.5v11l8-5.5z"/></g></svg>
