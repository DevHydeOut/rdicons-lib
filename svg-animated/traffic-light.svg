<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-traffic-light" data-rd-animate="hover"><style>.rd-a-traffic-light{overflow:visible}.rd-a-traffic-light *{transform-box:view-box}@media (prefers-reduced-motion:no-preference){.rd-a-traffic-light[data-rd-animate="hover"]:hover .l1,:hover>.rd-a-traffic-light[data-rd-animate="parent"] .l1,.rd-a-traffic-light[data-rd-animate="play"] .l1,.rd-a-traffic-light[data-rd-animate="loop"] .l1{animation:rd-traffic-light-m calc(0.5s*var(--rd-speed,1)) ease-in-out}.rd-a-traffic-light[data-rd-animate="hover"]:hover .l2,:hover>.rd-a-traffic-light[data-rd-animate="parent"] .l2,.rd-a-traffic-light[data-rd-animate="play"] .l2,.rd-a-traffic-light[data-rd-animate="loop"] .l2{animation:rd-traffic-light-m calc(0.5s*var(--rd-speed,1)) ease-in-out calc(0.2s*var(--rd-speed,1))}.rd-a-traffic-light[data-rd-animate="hover"]:hover .l3,:hover>.rd-a-traffic-light[data-rd-animate="parent"] .l3,.rd-a-traffic-light[data-rd-animate="play"] .l3,.rd-a-traffic-light[data-rd-animate="loop"] .l3{animation:rd-traffic-light-m calc(0.5s*var(--rd-speed,1)) ease-in-out calc(0.4s*var(--rd-speed,1))}.rd-a-traffic-light[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-traffic-light-m{0%,100%{opacity:1}40%{opacity:.12}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><rect x="7.5" y="3" width="9" height="18" rx="4"/><circle class="l1" cx="12" cy="7.5" r="1.3"/><circle class="l2" cx="12" cy="12" r="1.3"/><circle class="l3" cx="12" cy="16.5" r="1.3"/></g></svg>
