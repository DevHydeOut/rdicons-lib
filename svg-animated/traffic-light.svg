<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-traffic-light" data-rd-animate="hover"><style>.rd-a-traffic-light{overflow:visible}.rd-a-traffic-light *{transform-box:view-box}.rd-a-traffic-light .a{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-traffic-light[data-rd-animate="hover"]:hover .a,:hover>.rd-a-traffic-light[data-rd-animate="parent"] .a,.rd-a-traffic-light[data-rd-animate="play"] .a,.rd-a-traffic-light[data-rd-animate="loop"] .a{animation:rd-traffic-light-m calc(0.7s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-traffic-light[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-traffic-light-m{0%,100%{scale:1}35%{scale:.88}65%{scale:1.1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><rect x="7.5" y="3" width="9" height="18" rx="4"/><circle cx="12" cy="7.5" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="12" cy="16.5" r="1.3"/></g></g></svg>
