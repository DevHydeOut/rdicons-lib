<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-tilde" data-rd-animate="hover"><style>.rd-a-tilde{overflow:visible}.rd-a-tilde *{transform-box:view-box}.rd-a-tilde .a{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-tilde[data-rd-animate="hover"]:hover .a,:hover>.rd-a-tilde[data-rd-animate="parent"] .a,.rd-a-tilde[data-rd-animate="play"] .a,.rd-a-tilde[data-rd-animate="loop"] .a{animation:rd-tilde-m calc(0.7s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-tilde[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-tilde-m{0%,100%{scale:1}35%{scale:.88}65%{scale:1.1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><path d="M4 13c2-4 4-4 8 0s6 4 8 0"/></g></g></svg>
