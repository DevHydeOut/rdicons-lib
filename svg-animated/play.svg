<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-play" data-rd-animate="hover"><style>.rd-a-play{overflow:visible}.rd-a-play *{transform-box:view-box}.rd-a-play .d{stroke-dasharray:1 2}@media (prefers-reduced-motion:no-preference){.rd-a-play[data-rd-animate="hover"]:hover .d,:hover>.rd-a-play[data-rd-animate="parent"] .d,.rd-a-play[data-rd-animate="play"] .d,.rd-a-play[data-rd-animate="loop"] .d{animation:rd-play-draw calc(0.75s*var(--rd-speed,1)) ease-out;animation-delay:calc(var(--k)*.1s*var(--rd-speed,1))}.rd-a-play[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-play-draw{0%{stroke-dashoffset:1.2}100%{stroke-dashoffset:0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="d" style="--k:0"><path pathLength="1" d="M7.5 5.8v12.4a1 1 0 0 0 1.5.9l10.2-6.2a1 1 0 0 0 0-1.7L9 4.9a1 1 0 0 0-1.5.9z"/></g></g></svg>
