<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-plus" data-rd-animate="hover"><style>.rd-a-plus{overflow:visible}.rd-a-plus *{transform-box:view-box}.rd-a-plus .turn{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-plus[data-rd-animate="hover"]:hover .turn,:hover>.rd-a-plus[data-rd-animate="parent"] .turn,.rd-a-plus[data-rd-animate="play"] .turn,.rd-a-plus[data-rd-animate="loop"] .turn{animation:rd-plus-turn calc(0.5s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-plus[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-plus-turn{0%{rotate:0deg}100%{rotate:90deg}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="turn"><path d="M12 5v14M5 12h14"/></g></g></svg>
