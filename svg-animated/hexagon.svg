<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-hexagon" data-rd-animate="hover"><style>.rd-a-hexagon{overflow:visible}.rd-a-hexagon *{transform-box:view-box}.rd-a-hexagon .a{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-hexagon[data-rd-animate="hover"]:hover .a,:hover>.rd-a-hexagon[data-rd-animate="parent"] .a,.rd-a-hexagon[data-rd-animate="play"] .a,.rd-a-hexagon[data-rd-animate="loop"] .a{animation:rd-hexagon-m calc(0.9s*var(--rd-speed,1)) ease-in-out}.rd-a-hexagon[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-hexagon-m{0%{rotate:0deg}100%{rotate:360deg}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><path d="M12 3.5l7.5 4.25v8.5L12 20.5l-7.5-4.25v-8.5z"/></g></g></svg>
