<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-steering-wheel" data-rd-animate="hover"><style>.rd-a-steering-wheel{overflow:visible}.rd-a-steering-wheel *{transform-box:view-box}.rd-a-steering-wheel .p0{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-steering-wheel[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-steering-wheel[data-rd-animate="parent"] .p0,.rd-a-steering-wheel[data-rd-animate="play"] .p0,.rd-a-steering-wheel[data-rd-animate="loop"] .p0{animation:rd-steering-wheel-f0 calc(1s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-steering-wheel[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-steering-wheel-f0{0%,100%{rotate:0deg}30%{rotate:-70deg}65%{rotate:50deg}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g><g class="p0" style="--k:0;--s:1"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2"/><path d="M12 14v6.5M10.1 11.2L3.7 9.5M13.9 11.2l6.4-1.7"/></g></g></g></svg>
