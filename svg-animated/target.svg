<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-target" data-rd-animate="hover"><style>.rd-a-target{overflow:visible}.rd-a-target *{transform-box:view-box}.rd-a-target .p0{transform-origin:12px 12px}.rd-a-target .p1{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-target[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-target[data-rd-animate="parent"] .p0,.rd-a-target[data-rd-animate="play"] .p0,.rd-a-target[data-rd-animate="loop"] .p0{animation:rd-target-f0 calc(0.8s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-target[data-rd-animate="hover"]:hover .p1,:hover>.rd-a-target[data-rd-animate="parent"] .p1,.rd-a-target[data-rd-animate="play"] .p1,.rd-a-target[data-rd-animate="loop"] .p1{animation:rd-target-f1 calc(0.8s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0.12s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-target[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-target-f0{0%,100%{scale:1;opacity:1}50%{scale:1.25;opacity:.3}}@keyframes rd-target-f1{0%,100%{scale:1;opacity:1}50%{scale:1.25;opacity:.3}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><circle cx="12" cy="12" r="8.5"/><g><g class="p0" style="--k:0;--s:1"><circle cx="12" cy="12" r="4.5"/></g></g><g><g class="p1" style="--k:0;--s:1"><circle cx="12" cy="12" r="1"/></g></g></g></svg>
