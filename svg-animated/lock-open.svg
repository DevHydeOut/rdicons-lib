<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-lock-open" data-rd-animate="hover"><style>.rd-a-lock-open{overflow:visible}.rd-a-lock-open *{transform-box:view-box}@media (prefers-reduced-motion:no-preference){.rd-a-lock-open[data-rd-animate="hover"]:hover .sh,:hover>.rd-a-lock-open[data-rd-animate="parent"] .sh,.rd-a-lock-open[data-rd-animate="play"] .sh,.rd-a-lock-open[data-rd-animate="loop"] .sh{animation:rd-lock-open-lift calc(0.8s*var(--rd-speed,1)) ease-in-out}.rd-a-lock-open[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-lock-open-lift{0%,100%{translate:0 0;rotate:0deg}35%{translate:0 -2.2px;rotate:0deg}55%{translate:-.6px -1px;rotate:-6deg}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><rect x="4.5" y="10.5" width="15" height="10" rx="4"/><path class="sh" d="M8 10.5V8a4 4 0 0 1 7.7-1.5"/><path d="M12 14.8v1.8"/></g></svg>
