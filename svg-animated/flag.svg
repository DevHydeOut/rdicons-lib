<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-flag" data-rd-animate="hover"><style>.rd-a-flag{overflow:visible}.rd-a-flag *{transform-box:view-box}.rd-a-flag .d{stroke-dasharray:1 2}@media (prefers-reduced-motion:no-preference){.rd-a-flag[data-rd-animate="hover"]:hover .d,:hover>.rd-a-flag[data-rd-animate="parent"] .d,.rd-a-flag[data-rd-animate="play"] .d,.rd-a-flag[data-rd-animate="loop"] .d{animation:rd-flag-draw calc(0.75s*var(--rd-speed,1)) ease-out;animation-delay:calc(var(--k)*.1s*var(--rd-speed,1))}.rd-a-flag[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-flag-draw{0%{stroke-dashoffset:1.2}100%{stroke-dashoffset:0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="d" style="--k:0"><path pathLength="1" d="M5.5 20.5v-16"/></g><g class="d" style="--k:1"><path pathLength="1" d="M5.5 5h11l-2 3.5 2 3.5h-11"/></g></g></svg>
