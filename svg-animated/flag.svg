<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-flag" data-rd-animate="hover"><style>.rd-a-flag{overflow:visible}.rd-a-flag *{transform-box:view-box}.rd-a-flag .a{transform-origin:4px 20px}@media (prefers-reduced-motion:no-preference){.rd-a-flag[data-rd-animate="hover"]:hover .a,:hover>.rd-a-flag[data-rd-animate="parent"] .a,.rd-a-flag[data-rd-animate="play"] .a,.rd-a-flag[data-rd-animate="loop"] .a{animation:rd-flag-m calc(0.8s*var(--rd-speed,1)) ease-in-out}.rd-a-flag[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-flag-m{0%,100%{rotate:0deg}30%{rotate:-9deg}65%{rotate:7deg}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><path d="M5.5 20.5v-16M5.5 5h11l-2 3.5 2 3.5h-11"/></g></g></svg>
