<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-triangle" data-rd-animate="hover"><style>.rd-a-triangle{overflow:visible}.rd-a-triangle *{transform-box:view-box}.rd-a-triangle .a{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-triangle[data-rd-animate="hover"]:hover .a,:hover>.rd-a-triangle[data-rd-animate="parent"] .a,.rd-a-triangle[data-rd-animate="play"] .a,.rd-a-triangle[data-rd-animate="loop"] .a{animation:rd-triangle-m calc(0.8s*var(--rd-speed,1)) ease-in-out}.rd-a-triangle[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-triangle-m{0%,100%{rotate:0deg}35%{rotate:-12deg}70%{rotate:9deg}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><path d="M12 4.5l8.5 14.5h-17z"/></g></g></svg>
