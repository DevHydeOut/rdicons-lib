<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-wrench" data-rd-animate="hover"><style>.rd-a-wrench{overflow:visible}.rd-a-wrench *{transform-box:view-box}.rd-a-wrench .d{stroke-dasharray:1 2}@media (prefers-reduced-motion:no-preference){.rd-a-wrench[data-rd-animate="hover"]:hover .d,:hover>.rd-a-wrench[data-rd-animate="parent"] .d,.rd-a-wrench[data-rd-animate="play"] .d,.rd-a-wrench[data-rd-animate="loop"] .d{animation:rd-wrench-draw calc(0.75s*var(--rd-speed,1)) ease-out;animation-delay:calc(var(--k)*.1s*var(--rd-speed,1))}.rd-a-wrench[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-wrench-draw{0%{stroke-dashoffset:1.2}100%{stroke-dashoffset:0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="d" style="--k:0"><path pathLength="1" d="M17.85 4.03A5 5 0 0 0 10.99 10.54L5.81 15.71A1.75 1.75 0 0 0 8.29 18.19L13.46 13.01A5 5 0 0 0 19.97 6.15L17.3 8.82A1.5 1.5 0 0 1 15.18 6.7Z"/></g></g></svg>
