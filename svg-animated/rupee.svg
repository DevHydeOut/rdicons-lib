<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-rupee" data-rd-animate="hover"><style>.rd-a-rupee{overflow:visible}.rd-a-rupee *{transform-box:view-box}.rd-a-rupee .d{stroke-dasharray:1 2}@media (prefers-reduced-motion:no-preference){.rd-a-rupee[data-rd-animate="hover"]:hover .d,:hover>.rd-a-rupee[data-rd-animate="parent"] .d,.rd-a-rupee[data-rd-animate="play"] .d,.rd-a-rupee[data-rd-animate="loop"] .d{animation:rd-rupee-draw calc(0.75s*var(--rd-speed,1)) ease-out;animation-delay:calc(var(--k)*.1s*var(--rd-speed,1))}.rd-a-rupee[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-rupee-draw{0%{stroke-dashoffset:1.2}100%{stroke-dashoffset:0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="d" style="--k:0"><path pathLength="1" d="M6.5 5h11"/></g><g class="d" style="--k:1"><path pathLength="1" d="M6.5 9h11"/></g><g class="d" style="--k:2"><path pathLength="1" d="M9.5 5c4 0 6 1.5 6 4s-2 4-6 4H8l7.5 7"/></g></g></svg>
