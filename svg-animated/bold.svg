<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-bold" data-rd-animate="hover"><style>.rd-a-bold{overflow:visible}.rd-a-bold *{transform-box:view-box}.rd-a-bold .d{stroke-dasharray:1 2}@media (prefers-reduced-motion:no-preference){.rd-a-bold[data-rd-animate="hover"]:hover .d,:hover>.rd-a-bold[data-rd-animate="parent"] .d,.rd-a-bold[data-rd-animate="play"] .d,.rd-a-bold[data-rd-animate="loop"] .d{animation:rd-bold-draw calc(0.75s*var(--rd-speed,1)) ease-out;animation-delay:calc(var(--k)*.1s*var(--rd-speed,1))}.rd-a-bold[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-bold-draw{0%{stroke-dashoffset:1.2}100%{stroke-dashoffset:0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="d" style="--k:0"><path pathLength="1" d="M7 4.5h6a3.5 3.5 0 0 1 0 7H7z"/></g><g class="d" style="--k:1"><path pathLength="1" d="M7 11.5h7a3.5 3.5 0 0 1 0 8H7z"/></g></g></svg>
