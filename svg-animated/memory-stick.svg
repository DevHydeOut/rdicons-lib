<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-memory-stick" data-rd-animate="hover"><style>.rd-a-memory-stick{overflow:visible}.rd-a-memory-stick *{transform-box:view-box}@media (prefers-reduced-motion:no-preference){.rd-a-memory-stick[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-memory-stick[data-rd-animate="parent"] .p0,.rd-a-memory-stick[data-rd-animate="play"] .p0,.rd-a-memory-stick[data-rd-animate="loop"] .p0{animation:rd-memory-stick-f0 calc(0.7s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0.12s)*var(--rd-speed,1))}.rd-a-memory-stick[data-rd-animate="hover"]:hover .p1,:hover>.rd-a-memory-stick[data-rd-animate="parent"] .p1,.rd-a-memory-stick[data-rd-animate="play"] .p1,.rd-a-memory-stick[data-rd-animate="loop"] .p1{animation:rd-memory-stick-f1 calc(0.5s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0.1s)*var(--rd-speed,1))}.rd-a-memory-stick[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-memory-stick-f0{0%,100%{opacity:1}40%{opacity:.15}}@keyframes rd-memory-stick-f1{0%,100%{translate:0 0}40%{translate:0 1.5px}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><rect x="2.5" y="7.5" width="19" height="9" rx="2"/><g><g class="p0" style="--k:0;--s:1"><path d="M7 11v2"/></g><g class="p0" style="--k:1;--s:1"><path d="M12 11v2"/></g><g class="p0" style="--k:2;--s:1"><path d="M17 11v2"/></g></g><g><g class="p1" style="--k:0;--s:1"><path d="M7 16.5v2"/></g><g class="p1" style="--k:1;--s:1"><path d="M12 16.5v2"/></g><g class="p1" style="--k:2;--s:1"><path d="M17 16.5v2"/></g></g></g></svg>
