<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-user" data-rd-animate="hover"><style>.rd-a-user{overflow:visible}.rd-a-user *{transform-box:view-box}.rd-a-user .p0{transform-box:fill-box;transform-origin:center}.rd-a-user .p1{transform-origin:12px 20px}@media (prefers-reduced-motion:no-preference){.rd-a-user[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-user[data-rd-animate="parent"] .p0,.rd-a-user[data-rd-animate="play"] .p0,.rd-a-user[data-rd-animate="loop"] .p0{animation:rd-user-f0 calc(0.9s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-user[data-rd-animate="hover"]:hover .p1,:hover>.rd-a-user[data-rd-animate="parent"] .p1,.rd-a-user[data-rd-animate="play"] .p1,.rd-a-user[data-rd-animate="loop"] .p1{animation:rd-user-f1 calc(0.7s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1);animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-user[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-user-f0{0%,100%{translate:0 0}50%{translate:0 calc(var(--s)*1.8px)}}@keyframes rd-user-f1{0%,100%{scale:1 1}40%{scale:1.1 .86}70%{scale:.95 1.06}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g><g class="p0" style="--k:0;--s:1"><circle cx="12" cy="8" r="4"/></g></g><g><g class="p1" style="--k:0;--s:1"><path d="M4.5 20c.5-3.6 3.5-5.5 7.5-5.5s7 1.9 7.5 5.5"/></g></g></g></svg>
