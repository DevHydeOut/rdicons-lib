<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-dice" data-rd-animate="hover"><style>.rd-a-dice{overflow:visible}.rd-a-dice *{transform-box:view-box}.rd-a-dice .p0{transform-origin:12px 12px}.rd-a-dice .p1{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:no-preference){.rd-a-dice[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-dice[data-rd-animate="parent"] .p0,.rd-a-dice[data-rd-animate="play"] .p0,.rd-a-dice[data-rd-animate="loop"] .p0{animation:rd-dice-f0 calc(0.9s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-dice[data-rd-animate="hover"]:hover .p1,:hover>.rd-a-dice[data-rd-animate="parent"] .p1,.rd-a-dice[data-rd-animate="play"] .p1,.rd-a-dice[data-rd-animate="loop"] .p1{animation:rd-dice-f1 calc(0.5s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1);animation-delay:calc((0s + var(--k)*0.08s)*var(--rd-speed,1))}.rd-a-dice[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-dice-f0{0%,100%{rotate:0deg}35%{rotate:-7deg}70%{rotate:5deg}}@keyframes rd-dice-f1{0%,100%{scale:1}40%{scale:1.5}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g><g class="p0" style="--k:0;--s:1"><path d="M20.17 5.9A4 4 0 0 1 20.5 7.5V16.5A4 4 0 0 1 16.5 20.5H7.5A4 4 0 0 1 3.5 16.5V7.5A4 4 0 0 1 7.5 3.5H16.5A4 4 0 0 1 18.1 3.83"/></g></g><g><g class="p1" style="--k:0;--s:1"><path d="M8.5 8.5h.01"/></g><g class="p1" style="--k:1;--s:1"><path d="M15.5 8.5h.01"/></g><g class="p1" style="--k:2;--s:1"><path d="M12 12h.01"/></g><g class="p1" style="--k:3;--s:1"><path d="M8.5 15.5h.01"/></g><g class="p1" style="--k:4;--s:1"><path d="M15.5 15.5h.01"/></g></g></g></svg>
