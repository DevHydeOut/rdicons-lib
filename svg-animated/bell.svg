<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-bell" data-rd-animate="hover"><style>.rd-a-bell{overflow:visible}.rd-a-bell *{transform-box:view-box}.rd-a-bell .body{transform-origin:12px 3.5px}@media (prefers-reduced-motion:no-preference){.rd-a-bell[data-rd-animate="hover"]:hover .body,:hover>.rd-a-bell[data-rd-animate="parent"] .body,.rd-a-bell[data-rd-animate="play"] .body,.rd-a-bell[data-rd-animate="loop"] .body{animation:rd-bell-swing calc(0.95s*var(--rd-speed,1)) ease-in-out}.rd-a-bell[data-rd-animate="hover"]:hover .clap,:hover>.rd-a-bell[data-rd-animate="parent"] .clap,.rd-a-bell[data-rd-animate="play"] .clap,.rd-a-bell[data-rd-animate="loop"] .clap{animation:rd-bell-clap calc(0.95s*var(--rd-speed,1)) ease-in-out}.rd-a-bell[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-bell-swing{0%{rotate:0deg}15%{rotate:15deg}30%{rotate:-12deg}45%{rotate:8deg}60%{rotate:-5deg}78%{rotate:2deg}100%{rotate:0deg}}@keyframes rd-bell-clap{0%{translate:0 0}15%{translate:-1.7px 0}30%{translate:1.5px 0}45%{translate:-1px 0}60%{translate:.6px 0}100%{translate:0 0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="body"><path d="M6.2 16h11.6a0.8 0.8 0 0 0 0.6 -1.3L17 13v-3.5a5 5 0 0 0 -10 0V13l-1.4 1.7a0.8 0.8 0 0 0 0.6 1.3z"/></g><path class="clap" d="M10 19.2a2 2 0 0 0 4 0"/></g></svg>
