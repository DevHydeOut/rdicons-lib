<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-cherry" data-rd-animate="hover"><style>.rd-a-cherry{overflow:visible}.rd-a-cherry *{transform-box:view-box}@media (prefers-reduced-motion:no-preference){.rd-a-cherry[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-cherry[data-rd-animate="parent"] .p0,.rd-a-cherry[data-rd-animate="play"] .p0,.rd-a-cherry[data-rd-animate="loop"] .p0{animation:rd-cherry-f0 calc(0.9s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-cherry[data-rd-animate="hover"]:hover .p1,:hover>.rd-a-cherry[data-rd-animate="parent"] .p1,.rd-a-cherry[data-rd-animate="play"] .p1,.rd-a-cherry[data-rd-animate="loop"] .p1{animation:rd-cherry-f1 calc(0.9s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0.15s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-cherry[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-cherry-f0{0%,100%{translate:0 0}50%{translate:0 calc(var(--s)*1.8px)}}@keyframes rd-cherry-f1{0%,100%{translate:0 0}50%{translate:0 calc(var(--s)*1.8px)}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><path d="M7.5 14c0-5 3.5-8.5 8-10M16.5 14c0-4-.5-7-1.5-9.5"/><path d="M15 4.5c1.5 1 3 1 4.5 0"/><g><g class="p0" style="--k:0;--s:1"><circle cx="7.5" cy="17" r="3"/></g></g><g><g class="p1" style="--k:0;--s:1"><circle cx="16.5" cy="17" r="3"/></g></g></g></svg>
