<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-id-card" data-rd-animate="hover"><style>.rd-a-id-card{overflow:visible}.rd-a-id-card *{transform-box:view-box}.rd-a-id-card .p0{transform-box:fill-box;transform-origin:center}.rd-a-id-card .p1{stroke-dasharray:1 2}@media (prefers-reduced-motion:no-preference){.rd-a-id-card[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-id-card[data-rd-animate="parent"] .p0,.rd-a-id-card[data-rd-animate="play"] .p0,.rd-a-id-card[data-rd-animate="loop"] .p0{animation:rd-id-card-f0 calc(0.9s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-id-card[data-rd-animate="hover"]:hover .p1,:hover>.rd-a-id-card[data-rd-animate="parent"] .p1,.rd-a-id-card[data-rd-animate="play"] .p1,.rd-a-id-card[data-rd-animate="loop"] .p1{animation:rd-id-card-f1 calc(0.75s*var(--rd-speed,1)) ease-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-id-card[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-id-card-f0{0%,100%{translate:0 0}50%{translate:0 calc(var(--s)*1.8px)}}@keyframes rd-id-card-f1{0%{stroke-dashoffset:1.2}100%{stroke-dashoffset:0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><path d="M21.28 7.28A3.5 3.5 0 0 1 21.5 8.5V15.5A3.5 3.5 0 0 1 18 19H6A3.5 3.5 0 0 1 2.5 15.5V8.5A3.5 3.5 0 0 1 6 5H18A3.5 3.5 0 0 1 19.22 5.22"/><path d="M5.5 16c.5-1.5 1.7-2.3 3-2.3s2.5.8 3 2.3"/><g><g class="p0" style="--k:0;--s:1"><circle cx="8.5" cy="11" r="2"/></g></g><g><g class="p1" style="--k:0;--s:1"><path pathLength="1" d="M14 10h4.5M14 13.5h3"/></g></g></g></svg>
