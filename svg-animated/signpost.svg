<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-signpost" data-rd-animate="hover"><style>.rd-a-signpost{overflow:visible}.rd-a-signpost *{transform-box:view-box}.rd-a-signpost .p0{transform-origin:12px 8px}.rd-a-signpost .p1{transform-origin:12px 14.5px}@media (prefers-reduced-motion:no-preference){.rd-a-signpost[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-signpost[data-rd-animate="parent"] .p0,.rd-a-signpost[data-rd-animate="play"] .p0,.rd-a-signpost[data-rd-animate="loop"] .p0{animation:rd-signpost-f0 calc(1s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-signpost[data-rd-animate="hover"]:hover .p1,:hover>.rd-a-signpost[data-rd-animate="parent"] .p1,.rd-a-signpost[data-rd-animate="play"] .p1,.rd-a-signpost[data-rd-animate="loop"] .p1{animation:rd-signpost-f1 calc(1s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0.1s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-signpost[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-signpost-f0{0%,100%{rotate:0deg}30%{rotate:calc(var(--s)*8deg)}65%{rotate:calc(var(--s)*-6deg)}}@keyframes rd-signpost-f1{0%,100%{rotate:0deg}30%{rotate:calc(var(--s)*8deg)}65%{rotate:calc(var(--s)*-6deg)}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><path d="M12 3.5v17"/><g><g class="p0" style="--k:0;--s:1"><path d="M12 6h6l2 2-2 2h-6"/></g></g><g><g class="p1" style="--k:0;--s:1"><path d="M12 12.5H6l-2 2 2 2h6"/></g></g></g></svg>
