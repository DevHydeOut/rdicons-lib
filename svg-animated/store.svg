<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-store" data-rd-animate="hover"><style>.rd-a-store{overflow:visible}.rd-a-store *{transform-box:view-box}.rd-a-store .p0{transform-origin:12px 4px}.rd-a-store .p1{transform-origin:9.5px 20px}@media (prefers-reduced-motion:no-preference){.rd-a-store[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-store[data-rd-animate="parent"] .p0,.rd-a-store[data-rd-animate="play"] .p0,.rd-a-store[data-rd-animate="loop"] .p0{animation:rd-store-f0 calc(0.7s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1);animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-store[data-rd-animate="hover"]:hover .p1,:hover>.rd-a-store[data-rd-animate="parent"] .p1,.rd-a-store[data-rd-animate="play"] .p1,.rd-a-store[data-rd-animate="loop"] .p1{animation:rd-store-f1 calc(0.9s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-store[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-store-f0{0%,100%{scale:1 1}40%{scale:1.1 .86}70%{scale:.95 1.06}}@keyframes rd-store-f1{0%,100%{scale:1 1}45%{scale:.5 1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><path d="M9.5 4L9 9M14.5 4l.5 5"/><path d="M4.5 9v10.5a1 1 0 0 0 1 1h13a1 1 0 0 0 1-1V9"/><g><g class="p0" style="--k:0;--s:1"><path d="M4.5 4h15l1.5 5H3z"/></g></g><g><g class="p1" style="--k:0;--s:1"><path d="M9.5 20.5V15h5v5.5"/></g></g></g></svg>
