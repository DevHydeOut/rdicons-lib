<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-shirt" data-rd-animate="hover"><style>.rd-a-shirt{overflow:visible}.rd-a-shirt *{transform-box:view-box}.rd-a-shirt .a{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-shirt[data-rd-animate="hover"]:hover .a,:hover>.rd-a-shirt[data-rd-animate="parent"] .a,.rd-a-shirt[data-rd-animate="play"] .a,.rd-a-shirt[data-rd-animate="loop"] .a{animation:rd-shirt-m calc(0.8s*var(--rd-speed,1)) ease-in-out}.rd-a-shirt[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-shirt-m{0%,100%{rotate:0deg}35%{rotate:-12deg}70%{rotate:9deg}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><path d="M8.5 4l-5.5 3 2 4 2-1V20h10v-10l2 1 2-4-5.5-3a3.5 3.5 0 0 1-7 0z"/></g></g></svg>
