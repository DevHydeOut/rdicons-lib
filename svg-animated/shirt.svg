<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-shirt" data-rd-animate="hover"><style>.rd-a-shirt{overflow:visible}.rd-a-shirt *{transform-box:view-box}.rd-a-shirt .d{stroke-dasharray:1 2}@media (prefers-reduced-motion:no-preference){.rd-a-shirt[data-rd-animate="hover"]:hover .d,:hover>.rd-a-shirt[data-rd-animate="parent"] .d,.rd-a-shirt[data-rd-animate="play"] .d,.rd-a-shirt[data-rd-animate="loop"] .d{animation:rd-shirt-draw calc(0.75s*var(--rd-speed,1)) ease-out;animation-delay:calc(var(--k)*.1s*var(--rd-speed,1))}.rd-a-shirt[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-shirt-draw{0%{stroke-dashoffset:1.2}100%{stroke-dashoffset:0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="d" style="--k:0"><path pathLength="1" d="M8.5 4l-5.5 3 2 4 2-1V20h10v-10l2 1 2-4-5.5-3a3.5 3.5 0 0 1-7 0z"/></g></g></svg>
