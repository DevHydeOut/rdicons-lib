<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-shuffle" data-rd-animate="hover"><style>.rd-a-shuffle{overflow:visible}.rd-a-shuffle *{transform-box:view-box}.rd-a-shuffle .d{stroke-dasharray:1 2}@media (prefers-reduced-motion:no-preference){.rd-a-shuffle[data-rd-animate="hover"]:hover .d,:hover>.rd-a-shuffle[data-rd-animate="parent"] .d,.rd-a-shuffle[data-rd-animate="play"] .d,.rd-a-shuffle[data-rd-animate="loop"] .d{animation:rd-shuffle-draw calc(0.75s*var(--rd-speed,1)) ease-out;animation-delay:calc(var(--k)*.1s*var(--rd-speed,1))}.rd-a-shuffle[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-shuffle-draw{0%{stroke-dashoffset:1.2}100%{stroke-dashoffset:0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="d" style="--k:0"><path pathLength="1" d="M3.5 7h3c3 0 4.5 2 6 5s3 5 6 5h2"/></g><g class="d" style="--k:1"><path pathLength="1" d="M3.5 17h3c1.5 0 2.6-.5 3.6-1.4"/></g><g class="d" style="--k:2"><path pathLength="1" d="M13.9 8.4C14.9 7.5 16 7 17.5 7h3"/></g><g class="d" style="--k:3"><path pathLength="1" d="M17.5 14.5L20.5 17l-3 2.5"/></g><g class="d" style="--k:4"><path pathLength="1" d="M17.5 4.5L20.5 7l-3 2.5"/></g></g></svg>
