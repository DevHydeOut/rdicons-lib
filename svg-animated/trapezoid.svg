<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-trapezoid" data-rd-animate="hover"><style>.rd-a-trapezoid{overflow:visible}.rd-a-trapezoid *{transform-box:view-box}.rd-a-trapezoid .a{transform-origin:12px 20px}@media (prefers-reduced-motion:no-preference){.rd-a-trapezoid[data-rd-animate="hover"]:hover .a,:hover>.rd-a-trapezoid[data-rd-animate="parent"] .a,.rd-a-trapezoid[data-rd-animate="play"] .a,.rd-a-trapezoid[data-rd-animate="loop"] .a{animation:rd-trapezoid-m calc(0.7s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-trapezoid[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-trapezoid-m{0%,100%{scale:1 1}40%{scale:1.1 .86}70%{scale:.95 1.06}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><path d="M8 5.5h8l4.5 13h-17z"/></g></g></svg>
