<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-stairs" data-rd-animate="hover"><style>.rd-a-stairs{overflow:visible}.rd-a-stairs *{transform-box:view-box}@media (prefers-reduced-motion:no-preference){.rd-a-stairs[data-rd-animate="hover"]:hover .a,:hover>.rd-a-stairs[data-rd-animate="parent"] .a,.rd-a-stairs[data-rd-animate="play"] .a,.rd-a-stairs[data-rd-animate="loop"] .a{animation:rd-stairs-m calc(0.7s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-stairs[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-stairs-m{0%,100%{translate:0 0}40%{translate:2.2px -2.2px}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><path d="M3.5 19h4.5v-4.5h4V10h4V5.5h4.5"/></g></g></svg>
