<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-clipboard-x" data-rd-animate="hover"><style>.rd-a-clipboard-x{overflow:visible}.rd-a-clipboard-x *{transform-box:view-box}.rd-a-clipboard-x .base{transform-origin:12px 12px}.rd-a-clipboard-x .badge{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:no-preference){.rd-a-clipboard-x[data-rd-animate="hover"]:hover .base,:hover>.rd-a-clipboard-x[data-rd-animate="parent"] .base,.rd-a-clipboard-x[data-rd-animate="play"] .base,.rd-a-clipboard-x[data-rd-animate="loop"] .base{animation:rd-clipboard-x-base calc(0.7s*var(--rd-speed,1)) ease-in-out}.rd-a-clipboard-x[data-rd-animate="hover"]:hover .badge,:hover>.rd-a-clipboard-x[data-rd-animate="parent"] .badge,.rd-a-clipboard-x[data-rd-animate="play"] .badge,.rd-a-clipboard-x[data-rd-animate="loop"] .badge{animation:rd-clipboard-x-badge calc(0.8s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-clipboard-x[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-clipboard-x-base{0%,100%{scale:1}40%{scale:.96}}@keyframes rd-clipboard-x-badge{0%,100%{scale:1;opacity:1}22%{scale:.1;opacity:0}62%{scale:1.3;opacity:1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="base"><path d="M15 5.5h1.5a3 3 0 0 1 3 3V17a3 3 0 0 1-3 3h-9a3 3 0 0 1-3-3V8.5a3 3 0 0 1 3-3H9"/><rect x="9" y="3.5" width="6" height="4" rx="1.5"/></g><g class="badge"><path d="M10 11.5l4 4M14 11.5l-4 4"/></g></g></svg>
