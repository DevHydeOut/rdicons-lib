<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-trophy" data-rd-animate="hover"><style>.rd-a-trophy{overflow:visible}.rd-a-trophy *{transform-box:view-box}@media (prefers-reduced-motion:no-preference){.rd-a-trophy[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-trophy[data-rd-animate="parent"] .p0,.rd-a-trophy[data-rd-animate="play"] .p0,.rd-a-trophy[data-rd-animate="loop"] .p0{animation:rd-trophy-f0 calc(0.7s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1);animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-trophy[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-trophy-f0{0%,100%{translate:0 0}40%{translate:0 -2px}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><path d="M12 13.5v3.5M8.5 20.5h7M10 17h4"/><g><g class="p0" style="--k:0;--s:1"><path d="M8 4.5h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5v1.5A3 3 0 0 0 8 10.5M16 6h3v1.5a3 3 0 0 1-3 3"/></g></g></g></svg>
