<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-trophy" data-rd-animate="hover"><style>.rd-a-trophy{overflow:visible}.rd-a-trophy *{transform-box:view-box}.rd-a-trophy .a{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-trophy[data-rd-animate="hover"]:hover .a,:hover>.rd-a-trophy[data-rd-animate="parent"] .a,.rd-a-trophy[data-rd-animate="play"] .a,.rd-a-trophy[data-rd-animate="loop"] .a{animation:rd-trophy-m calc(0.7s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-trophy[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-trophy-m{0%,100%{scale:1}45%{scale:1.16}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><path d="M8 4.5h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5v1.5A3 3 0 0 0 8 10.5M16 6h3v1.5a3 3 0 0 1-3 3"/><path d="M12 13.5v3.5M8.5 20.5h7M10 17h4"/></g></g></svg>
