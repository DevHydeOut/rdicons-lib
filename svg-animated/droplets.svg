<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-droplets" data-rd-animate="hover"><style>.rd-a-droplets{overflow:visible}.rd-a-droplets *{transform-box:view-box}@media (prefers-reduced-motion:no-preference){.rd-a-droplets[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-droplets[data-rd-animate="parent"] .p0,.rd-a-droplets[data-rd-animate="play"] .p0,.rd-a-droplets[data-rd-animate="loop"] .p0{animation:rd-droplets-f0 calc(0.8s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-droplets[data-rd-animate="hover"]:hover .p1,:hover>.rd-a-droplets[data-rd-animate="parent"] .p1,.rd-a-droplets[data-rd-animate="play"] .p1,.rd-a-droplets[data-rd-animate="loop"] .p1{animation:rd-droplets-f1 calc(0.8s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0.15s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-droplets[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-droplets-f0{0%,100%{translate:0 0}35%{translate:0 2.4px}60%{translate:0 -.6px}}@keyframes rd-droplets-f1{0%,100%{translate:0 0}35%{translate:0 2.4px}60%{translate:0 -.6px}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g><g class="p0" style="--k:0;--s:1"><path d="M8 6.5c2 2.5 4 4.5 4 7a4 4 0 0 1-8 0c0-2.5 2-4.5 4-7z"/></g></g><g><g class="p1" style="--k:0;--s:1"><path d="M15.5 11c1.5 1.8 3 3.2 3 5a3 3 0 0 1-6 0"/></g></g></g></svg>
