<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-droplets" data-rd-animate="hover"><style>.rd-a-droplets{overflow:visible}.rd-a-droplets *{transform-box:view-box}@media (prefers-reduced-motion:no-preference){.rd-a-droplets[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-droplets[data-rd-animate="parent"] .p0,.rd-a-droplets[data-rd-animate="play"] .p0,.rd-a-droplets[data-rd-animate="loop"] .p0{animation:rd-droplets-f0 calc(0.8s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-droplets[data-rd-animate="hover"]:hover .p1,:hover>.rd-a-droplets[data-rd-animate="parent"] .p1,.rd-a-droplets[data-rd-animate="play"] .p1,.rd-a-droplets[data-rd-animate="loop"] .p1{animation:rd-droplets-f1 calc(0.8s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0.15s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-droplets[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-droplets-f0{0%,100%{translate:0 0}35%{translate:0 2.4px}60%{translate:0 -.6px}}@keyframes rd-droplets-f1{0%,100%{translate:0 0}35%{translate:0 2.4px}60%{translate:0 -.6px}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g><g class="p0" style="--k:0;--s:1"><path d="M7.8 5.6C10.2 8.6 12.4 10.8 12.4 13.1a4.6 4.6 0 0 1-9.2 0C3.2 10.8 5.4 8.6 7.8 5.6z"/></g></g><g><g class="p1" style="--k:0;--s:1"><path d="M17.2 11.55C18.87 13.63 20.4 15.17 20.4 16.77a3.2 3.2 0 0 1-6.4 0C14 15.17 15.53 13.63 17.2 11.55z"/></g></g></g></svg>
