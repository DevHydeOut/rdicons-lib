<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-shield-plus" data-rd-animate="hover"><style>.rd-a-shield-plus{overflow:visible}.rd-a-shield-plus *{transform-box:view-box}.rd-a-shield-plus .base{transform-origin:12px 12px}.rd-a-shield-plus .badge{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:no-preference){.rd-a-shield-plus[data-rd-animate="hover"]:hover .base,:hover>.rd-a-shield-plus[data-rd-animate="parent"] .base,.rd-a-shield-plus[data-rd-animate="play"] .base,.rd-a-shield-plus[data-rd-animate="loop"] .base{animation:rd-shield-plus-base calc(0.7s*var(--rd-speed,1)) ease-in-out}.rd-a-shield-plus[data-rd-animate="hover"]:hover .badge,:hover>.rd-a-shield-plus[data-rd-animate="parent"] .badge,.rd-a-shield-plus[data-rd-animate="play"] .badge,.rd-a-shield-plus[data-rd-animate="loop"] .badge{animation:rd-shield-plus-badge calc(0.8s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-shield-plus[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-shield-plus-base{0%,100%{scale:1}40%{scale:.96}}@keyframes rd-shield-plus-badge{0%,100%{scale:1;opacity:1}22%{scale:.1;opacity:0}62%{scale:1.3;opacity:1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="base"><path d="M12 3.5l7 2.5v5.6c0 4.4-3 7.6-7 9-4-1.4-7-4.6-7-9V6z"/></g><g class="badge"><path d="M12 9v5M9.5 11.5h5"/></g></g></svg>
