<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-layout-dashboard" data-rd-animate="hover"><style>.rd-a-layout-dashboard{overflow:visible}.rd-a-layout-dashboard *{transform-box:view-box}.rd-a-layout-dashboard .d{stroke-dasharray:1 2}@media (prefers-reduced-motion:no-preference){.rd-a-layout-dashboard[data-rd-animate="hover"]:hover .d,:hover>.rd-a-layout-dashboard[data-rd-animate="parent"] .d,.rd-a-layout-dashboard[data-rd-animate="play"] .d,.rd-a-layout-dashboard[data-rd-animate="loop"] .d{animation:rd-layout-dashboard-draw calc(0.75s*var(--rd-speed,1)) ease-out;animation-delay:calc(var(--k)*.1s*var(--rd-speed,1))}.rd-a-layout-dashboard[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-layout-dashboard-draw{0%{stroke-dashoffset:1.2}100%{stroke-dashoffset:0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="d" style="--k:0"><rect pathLength="1" x="3.5" y="3.5" width="7" height="9" rx="2"/></g><g class="d" style="--k:1"><rect pathLength="1" x="13.5" y="3.5" width="7" height="5" rx="2"/></g><g class="d" style="--k:2"><rect pathLength="1" x="13.5" y="11.5" width="7" height="9" rx="2"/></g><g class="d" style="--k:3"><rect pathLength="1" x="3.5" y="15.5" width="7" height="5" rx="2"/></g></g></svg>
