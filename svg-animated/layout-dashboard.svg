<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-layout-dashboard" data-rd-animate="hover"><style>.rd-a-layout-dashboard{overflow:visible}.rd-a-layout-dashboard *{transform-box:view-box}.rd-a-layout-dashboard .a{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-layout-dashboard[data-rd-animate="hover"]:hover .a,:hover>.rd-a-layout-dashboard[data-rd-animate="parent"] .a,.rd-a-layout-dashboard[data-rd-animate="play"] .a,.rd-a-layout-dashboard[data-rd-animate="loop"] .a{animation:rd-layout-dashboard-m calc(0.7s*var(--rd-speed,1)) ease-in-out}.rd-a-layout-dashboard[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-layout-dashboard-m{0%,100%{scale:1 1}50%{scale:.1 1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><rect x="3.5" y="3.5" width="7" height="9" rx="2"/><rect x="13.5" y="3.5" width="7" height="5" rx="2"/><rect x="13.5" y="11.5" width="7" height="9" rx="2"/><rect x="3.5" y="15.5" width="7" height="5" rx="2"/></g></g></svg>
