<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-clipboard" data-rd-animate="hover"><style>.rd-a-clipboard{overflow:visible}.rd-a-clipboard *{transform-box:view-box}.rd-a-clipboard .p1{stroke-dasharray:1 2}@media (prefers-reduced-motion:no-preference){.rd-a-clipboard[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-clipboard[data-rd-animate="parent"] .p0,.rd-a-clipboard[data-rd-animate="play"] .p0,.rd-a-clipboard[data-rd-animate="loop"] .p0{animation:rd-clipboard-f0 calc(0.7s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1);animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-clipboard[data-rd-animate="hover"]:hover .p1,:hover>.rd-a-clipboard[data-rd-animate="parent"] .p1,.rd-a-clipboard[data-rd-animate="play"] .p1,.rd-a-clipboard[data-rd-animate="loop"] .p1{animation:rd-clipboard-f1 calc(0.75s*var(--rd-speed,1)) ease-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-clipboard[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-clipboard-f0{0%,100%{translate:0 0}40%{translate:0 -2px}}@keyframes rd-clipboard-f1{0%{stroke-dashoffset:1.2}100%{stroke-dashoffset:0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><path d="M15 5.5h1.5a3 3 0 0 1 3 3V17a3 3 0 0 1-3 3h-9a3 3 0 0 1-3-3V8.5a3 3 0 0 1 3-3H9"/><g><g class="p0" style="--k:0;--s:1"><rect x="9" y="3.5" width="6" height="4" rx="1.5"/></g></g><g><g class="p1" style="--k:0;--s:1"><path pathLength="1" d="M8.5 12h7M8.5 15.5h4"/></g></g></g></svg>
