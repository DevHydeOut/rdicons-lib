<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-clock" data-rd-animate="hover"><style>.rd-a-clock{overflow:visible}.rd-a-clock *{transform-box:view-box}.rd-a-clock .hands{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-clock[data-rd-animate="hover"]:hover .hands,:hover>.rd-a-clock[data-rd-animate="parent"] .hands,.rd-a-clock[data-rd-animate="play"] .hands,.rd-a-clock[data-rd-animate="loop"] .hands{animation:rd-clock-turn calc(0.9s*var(--rd-speed,1)) ease-in-out}.rd-a-clock[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-clock-turn{0%{rotate:0deg}100%{rotate:360deg}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><circle cx="12" cy="12" r="8.5"/><g class="hands"><path d="M12 7.5V12l3 2"/></g></g></svg>
