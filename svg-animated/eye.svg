<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-eye" data-rd-animate="hover"><style>.rd-a-eye{overflow:visible}.rd-a-eye *{transform-box:view-box}.rd-a-eye .eye{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-eye[data-rd-animate="hover"]:hover .eye,:hover>.rd-a-eye[data-rd-animate="parent"] .eye,.rd-a-eye[data-rd-animate="play"] .eye,.rd-a-eye[data-rd-animate="loop"] .eye{animation:rd-eye-blink calc(0.55s*var(--rd-speed,1)) ease-in-out}.rd-a-eye[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-eye-blink{0%,100%{scale:1 1}42%{scale:1 .1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="eye"><path d="M3 12c2-4 5-6.5 9-6.5s7 2.5 9 6.5c-2 4-5 6.5-9 6.5S5 16 3 12z"/><circle cx="12" cy="12" r="3"/></g></g></svg>
