<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-bed" data-rd-animate="hover"><style>.rd-a-bed{overflow:visible}.rd-a-bed *{transform-box:view-box}.rd-a-bed .pillow{transform-origin:7px 11.5px}@media (prefers-reduced-motion:no-preference){.rd-a-bed[data-rd-animate="hover"]:hover .cover,:hover>.rd-a-bed[data-rd-animate="parent"] .cover,.rd-a-bed[data-rd-animate="play"] .cover,.rd-a-bed[data-rd-animate="loop"] .cover{animation:rd-bed-cover calc(0.8s*var(--rd-speed,1)) ease-in-out}.rd-a-bed[data-rd-animate="hover"]:hover .pillow,:hover>.rd-a-bed[data-rd-animate="parent"] .pillow,.rd-a-bed[data-rd-animate="play"] .pillow,.rd-a-bed[data-rd-animate="loop"] .pillow{animation:rd-bed-pillow calc(0.8s*var(--rd-speed,1)) ease-in-out}.rd-a-bed[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-bed-cover{0%,100%{translate:0 0}40%{translate:0 -1.6px}}@keyframes rd-bed-pillow{0%,100%{scale:1 1}40%{scale:1.15 .8}65%{scale:.95 1.08}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><path d="M3.5 6v13"/><path d="M3.5 15h17v4"/><path class="cover" d="M20.5 15v-3a3 3 0 0 0-3-3H11v6"/><circle class="pillow" cx="7" cy="11.5" r="1.8"/></g></svg>
