<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-truck" data-rd-animate="hover"><style>.rd-a-truck{overflow:visible}.rd-a-truck *{transform-box:view-box}.rd-a-truck .body{transform-origin:12px 16px}@media (prefers-reduced-motion:no-preference){.rd-a-truck[data-rd-animate="hover"]:hover .body,:hover>.rd-a-truck[data-rd-animate="parent"] .body,.rd-a-truck[data-rd-animate="play"] .body,.rd-a-truck[data-rd-animate="loop"] .body{animation:rd-truck-rock calc(0.8s*var(--rd-speed,1)) ease-in-out}.rd-a-truck[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-truck-rock{0%,100%{rotate:0deg;translate:0 0}25%{rotate:-2.5deg;translate:-.6px 0}55%{rotate:1.5deg;translate:.8px 0}80%{rotate:-.5deg;translate:0 0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="body"><path d="M5 16H4.5A1.5 1.5 0 0 1 3 14.5V7a1.5 1.5 0 0 1 1.5-1.5H13A1.5 1.5 0 0 1 14.5 7V16M9 16h5.5"/><path d="M14.5 9.5h3.7a1.5 1.5 0 0 1 1.2.600L21 12.5v2a1.5 1.5 0 0 1-1.5 1.5H19"/></g><circle cx="7" cy="16" r="2"/><circle cx="17" cy="16" r="2"/></g></svg>
