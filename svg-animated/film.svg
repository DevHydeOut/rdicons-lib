<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-film" data-rd-animate="hover"><style>.rd-a-film{overflow:visible}.rd-a-film *{transform-box:view-box}.rd-a-film .a{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-film[data-rd-animate="hover"]:hover .a,:hover>.rd-a-film[data-rd-animate="parent"] .a,.rd-a-film[data-rd-animate="play"] .a,.rd-a-film[data-rd-animate="loop"] .a{animation:rd-film-m calc(0.7s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-film[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-film-m{0%,100%{scale:1}35%{scale:.88}65%{scale:1.1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="M7.5 4.5v15M16.5 4.5v15M3.5 9h4M3.5 15h4M16.5 9h4M16.5 15h4"/></g></g></svg>
