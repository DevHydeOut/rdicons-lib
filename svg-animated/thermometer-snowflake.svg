<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-thermometer-snowflake" data-rd-animate="hover"><style>.rd-a-thermometer-snowflake{overflow:visible}.rd-a-thermometer-snowflake *{transform-box:view-box}.rd-a-thermometer-snowflake .base{transform-origin:12px 12px}.rd-a-thermometer-snowflake .badge{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:no-preference){.rd-a-thermometer-snowflake[data-rd-animate="hover"]:hover .base,:hover>.rd-a-thermometer-snowflake[data-rd-animate="parent"] .base,.rd-a-thermometer-snowflake[data-rd-animate="play"] .base,.rd-a-thermometer-snowflake[data-rd-animate="loop"] .base{animation:rd-thermometer-snowflake-base calc(0.7s*var(--rd-speed,1)) ease-in-out}.rd-a-thermometer-snowflake[data-rd-animate="hover"]:hover .badge,:hover>.rd-a-thermometer-snowflake[data-rd-animate="parent"] .badge,.rd-a-thermometer-snowflake[data-rd-animate="play"] .badge,.rd-a-thermometer-snowflake[data-rd-animate="loop"] .badge{animation:rd-thermometer-snowflake-badge calc(0.8s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-thermometer-snowflake[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-thermometer-snowflake-base{0%,100%{scale:1}40%{scale:.96}}@keyframes rd-thermometer-snowflake-badge{0%,100%{scale:1;opacity:1}22%{scale:.1;opacity:0}62%{scale:1.3;opacity:1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="base"><path d="M7.5 14.5V6a2 2 0 1 1 4 0v8.5a3.8 3.8 0 1 1-4 0z"/><path d="M9.5 9v6.5"/></g><g class="badge"><path d="M17 3.5v7M13.9 5.3l6.2 3.4M20.1 5.3l-6.2 3.4"/></g></g></svg>
