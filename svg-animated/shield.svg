<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-shield" data-rd-animate="hover"><style>.rd-a-shield{overflow:visible}.rd-a-shield *{transform-box:view-box}.rd-a-shield .p0{stroke-dasharray:1 2}.rd-a-shield .p1{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-shield[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-shield[data-rd-animate="parent"] .p0,.rd-a-shield[data-rd-animate="play"] .p0,.rd-a-shield[data-rd-animate="loop"] .p0{animation:rd-shield-f0 calc(0.75s*var(--rd-speed,1)) ease-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-shield[data-rd-animate="hover"]:hover .p1,:hover>.rd-a-shield[data-rd-animate="parent"] .p1,.rd-a-shield[data-rd-animate="play"] .p1,.rd-a-shield[data-rd-animate="loop"] .p1{animation:rd-shield-f1 calc(0.8s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-shield[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-shield-f0{0%{stroke-dashoffset:1.2}100%{stroke-dashoffset:0}}@keyframes rd-shield-f1{0%,100%{scale:1}45%{scale:1.08}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g><g class="p0" style="--k:0;--s:1"><path pathLength="1" d="M9 12l2.2 2.2L15.2 10"/></g></g><g><g class="p1" style="--k:0;--s:1"><path d="M12 3.5l7 2.5v5.6c0 4.4-3 7.6-7 9-4-1.4-7-4.6-7-9V6z"/></g></g></g></svg>
