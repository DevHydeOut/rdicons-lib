<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-calendar" data-rd-animate="hover"><style>.rd-a-calendar{overflow:visible}.rd-a-calendar *{transform-box:view-box}.rd-a-calendar .shape{transform-origin:12px 12px}.rd-a-calendar .close{stroke-dasharray:1 2;stroke-dashoffset:1.2}@media (prefers-reduced-motion:no-preference){.rd-a-calendar[data-rd-animate="hover"]:hover .close,:hover>.rd-a-calendar[data-rd-animate="parent"] .close,.rd-a-calendar[data-rd-animate="play"] .close,.rd-a-calendar[data-rd-animate="loop"] .close{animation:rd-calendar-close calc(0.9s*var(--rd-speed,1)) ease-in-out}.rd-a-calendar[data-rd-animate="hover"]:hover .shape,:hover>.rd-a-calendar[data-rd-animate="parent"] .shape,.rd-a-calendar[data-rd-animate="play"] .shape,.rd-a-calendar[data-rd-animate="loop"] .shape{animation:rd-calendar-seal calc(0.9s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-calendar[data-rd-animate="hover"]:hover .rings,:hover>.rd-a-calendar[data-rd-animate="parent"] .rings,.rd-a-calendar[data-rd-animate="play"] .rings,.rd-a-calendar[data-rd-animate="loop"] .rings{animation:rd-calendar-rings calc(0.9s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-calendar[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-calendar-close{0%,100%{stroke-dashoffset:1.2}30%,68%{stroke-dashoffset:0}}@keyframes rd-calendar-seal{0%,100%{scale:1}34%{scale:.95}52%{scale:1.03}}@keyframes rd-calendar-rings{0%,100%{translate:0 0}35%{translate:0 -1.4px}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="shape"><path d="M20.08 8.1A4.5 4.5 0 0 1 20.5 10v6a4.5 4.5 0 0 1-4.5 4.5H8a4.5 4.5 0 0 1-4.5-4.5v-6A4.5 4.5 0 0 1 8 5.5h8a4.5 4.5 0 0 1 1.9.42"/><path class="close" pathLength="1" d="M17.9 5.92A4.5 4.5 0 0 1 20.08 8.1"/><path d="M3.7 10.5h16.6"/><g class="rings"><path d="M8 3.5v3M16 3.5v3"/></g></g></g></svg>
