<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-dumbbell" data-rd-animate="hover"><style>.rd-a-dumbbell{overflow:visible}.rd-a-dumbbell *{transform-box:view-box}@media (prefers-reduced-motion:no-preference){.rd-a-dumbbell[data-rd-animate="hover"]:hover .a,:hover>.rd-a-dumbbell[data-rd-animate="parent"] .a,.rd-a-dumbbell[data-rd-animate="play"] .a,.rd-a-dumbbell[data-rd-animate="loop"] .a{animation:rd-dumbbell-m calc(0.8s*var(--rd-speed,1)) ease-in-out}.rd-a-dumbbell[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-dumbbell-m{0%,100%{translate:0 0}30%{translate:0 -3px}55%{translate:0 0}72%{translate:0 -1px}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></g></g></svg>
