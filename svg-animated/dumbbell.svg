<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-dumbbell" data-rd-animate="hover"><style>.rd-a-dumbbell{overflow:visible}.rd-a-dumbbell *{transform-box:view-box}@media (prefers-reduced-motion:no-preference){.rd-a-dumbbell[data-rd-animate="hover"]:hover .l,:hover>.rd-a-dumbbell[data-rd-animate="parent"] .l,.rd-a-dumbbell[data-rd-animate="play"] .l,.rd-a-dumbbell[data-rd-animate="loop"] .l{animation:rd-dumbbell-up calc(0.8s*var(--rd-speed,1)) ease-in-out}.rd-a-dumbbell[data-rd-animate="hover"]:hover .r,:hover>.rd-a-dumbbell[data-rd-animate="parent"] .r,.rd-a-dumbbell[data-rd-animate="play"] .r,.rd-a-dumbbell[data-rd-animate="loop"] .r{animation:rd-dumbbell-down calc(0.8s*var(--rd-speed,1)) ease-in-out}.rd-a-dumbbell[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-dumbbell-up{0%,100%{translate:0 0}35%{translate:0 -2px}70%{translate:0 .5px}}@keyframes rd-dumbbell-down{0%,100%{translate:0 0}35%{translate:0 2px}70%{translate:0 -.5px}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="l"><path d="M6.5 6.5v11"/><path d="M3.5 9.5v5"/></g><g class="r"><path d="M17.5 6.5v11"/><path d="M20.5 9.5v5"/></g><path d="M6.5 12h11"/></g></svg>
