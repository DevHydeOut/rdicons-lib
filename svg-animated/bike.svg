<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-bike" data-rd-animate="hover"><style>.rd-a-bike{overflow:visible}.rd-a-bike *{transform-box:view-box}.rd-a-bike .fr{transform-origin:12px 16.5px}@media (prefers-reduced-motion:no-preference){.rd-a-bike[data-rd-animate="hover"]:hover .fr,:hover>.rd-a-bike[data-rd-animate="parent"] .fr,.rd-a-bike[data-rd-animate="play"] .fr,.rd-a-bike[data-rd-animate="loop"] .fr{animation:rd-bike-pedal calc(0.8s*var(--rd-speed,1)) ease-in-out}.rd-a-bike[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-bike-pedal{0%,100%{rotate:0deg;translate:0 0}25%{rotate:-3deg;translate:0 -1px}55%{rotate:2deg;translate:0 .5px}80%{rotate:-.5deg;translate:0 0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><circle cx="6" cy="16.5" r="3.5"/><circle cx="18" cy="16.5" r="3.5"/><g class="fr"><path d="M6 16.5l3.5-7.5h5.5l3 7.5"/><path d="M9.5 9L12.5 16.5H6"/><path d="M8 7h3M14.5 7H17"/></g></g></svg>
