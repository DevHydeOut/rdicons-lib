<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-sphere" data-rd-animate="hover"><style>.rd-a-sphere{overflow:visible}.rd-a-sphere *{transform-box:view-box}.rd-a-sphere .a{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-sphere[data-rd-animate="hover"]:hover .a,:hover>.rd-a-sphere[data-rd-animate="parent"] .a,.rd-a-sphere[data-rd-animate="play"] .a,.rd-a-sphere[data-rd-animate="loop"] .a{animation:rd-sphere-m calc(0.9s*var(--rd-speed,1)) ease-in-out}.rd-a-sphere[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-sphere-m{0%{rotate:0deg}100%{rotate:360deg}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12a8.5 3 0 0 0 17 0"/></g></g></svg>
