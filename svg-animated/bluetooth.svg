<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-bluetooth" data-rd-animate="hover"><style>.rd-a-bluetooth{overflow:visible}.rd-a-bluetooth *{transform-box:view-box}.rd-a-bluetooth .a{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-bluetooth[data-rd-animate="hover"]:hover .a,:hover>.rd-a-bluetooth[data-rd-animate="parent"] .a,.rd-a-bluetooth[data-rd-animate="play"] .a,.rd-a-bluetooth[data-rd-animate="loop"] .a{animation:rd-bluetooth-m calc(0.7s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-bluetooth[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-bluetooth-m{0%,100%{scale:1}35%{scale:.88}65%{scale:1.1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><path d="M7 7.5l10 9-5 4.5V3l5 4.5-10 9"/></g></g></svg>
