<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-speaker" data-rd-animate="hover"><style>.rd-a-speaker{overflow:visible}.rd-a-speaker *{transform-box:view-box}.rd-a-speaker .p0{transform-box:fill-box;transform-origin:center}.rd-a-speaker .p1{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:no-preference){.rd-a-speaker[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-speaker[data-rd-animate="parent"] .p0,.rd-a-speaker[data-rd-animate="play"] .p0,.rd-a-speaker[data-rd-animate="loop"] .p0{animation:rd-speaker-f0 calc(0.8s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-speaker[data-rd-animate="hover"]:hover .p1,:hover>.rd-a-speaker[data-rd-animate="parent"] .p1,.rd-a-speaker[data-rd-animate="play"] .p1,.rd-a-speaker[data-rd-animate="loop"] .p1{animation:rd-speaker-f1 calc(0.8s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0.1s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-speaker[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-speaker-f0{0%,100%{scale:1;opacity:1}50%{scale:1.25;opacity:.3}}@keyframes rd-speaker-f1{0%,100%{scale:1}45%{scale:1.08}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><rect x="6" y="3" width="12" height="18" rx="3.5"/><g><g class="p0" style="--k:0;--s:1"><circle cx="12" cy="14.5" r="3"/></g></g><g><g class="p1" style="--k:0;--s:1"><circle cx="12" cy="7.5" r="1"/></g></g></g></svg>
