<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-speaker" data-rd-animate="hover"><style>.rd-a-speaker{overflow:visible}.rd-a-speaker *{transform-box:view-box}.rd-a-speaker .a{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-speaker[data-rd-animate="hover"]:hover .a,:hover>.rd-a-speaker[data-rd-animate="parent"] .a,.rd-a-speaker[data-rd-animate="play"] .a,.rd-a-speaker[data-rd-animate="loop"] .a{animation:rd-speaker-m calc(0.7s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-speaker[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-speaker-m{0%,100%{scale:1}35%{scale:.88}65%{scale:1.1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><rect x="6" y="3" width="12" height="18" rx="3.5"/><circle cx="12" cy="14.5" r="3"/><circle cx="12" cy="7.5" r="1"/></g></g></svg>
