<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-octagon" data-rd-animate="hover"><style>.rd-a-octagon{overflow:visible}.rd-a-octagon *{transform-box:view-box}.rd-a-octagon .d{stroke-dasharray:1 2}@media (prefers-reduced-motion:no-preference){.rd-a-octagon[data-rd-animate="hover"]:hover .d,:hover>.rd-a-octagon[data-rd-animate="parent"] .d,.rd-a-octagon[data-rd-animate="play"] .d,.rd-a-octagon[data-rd-animate="loop"] .d{animation:rd-octagon-draw calc(0.75s*var(--rd-speed,1)) ease-out;animation-delay:calc(var(--k)*.1s*var(--rd-speed,1))}.rd-a-octagon[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-octagon-draw{0%{stroke-dashoffset:1.2}100%{stroke-dashoffset:0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="d" style="--k:0"><path pathLength="1" d="M8.5 3.5h7l5 5v7l-5 5h-7l-5-5v-7z"/></g></g></svg>
