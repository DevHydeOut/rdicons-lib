<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-octagon" data-rd-animate="hover"><style>.rd-a-octagon{overflow:visible}.rd-a-octagon *{transform-box:view-box}.rd-a-octagon .a{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-octagon[data-rd-animate="hover"]:hover .a,:hover>.rd-a-octagon[data-rd-animate="parent"] .a,.rd-a-octagon[data-rd-animate="play"] .a,.rd-a-octagon[data-rd-animate="loop"] .a{animation:rd-octagon-m calc(0.7s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-octagon[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-octagon-m{0%,100%{scale:1}35%{scale:.88}65%{scale:1.1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><path d="M8.5 3.5h7l5 5v7l-5 5h-7l-5-5v-7z"/></g></g></svg>
