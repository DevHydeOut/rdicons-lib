<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-smartphone" data-rd-animate="hover"><style>.rd-a-smartphone{overflow:visible}.rd-a-smartphone *{transform-box:view-box}.rd-a-smartphone .ph{transform-origin:12px 12px}.rd-a-smartphone .bar{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:no-preference){.rd-a-smartphone[data-rd-animate="hover"]:hover .ph,:hover>.rd-a-smartphone[data-rd-animate="parent"] .ph,.rd-a-smartphone[data-rd-animate="play"] .ph,.rd-a-smartphone[data-rd-animate="loop"] .ph{animation:rd-smartphone-buzz calc(0.6s*var(--rd-speed,1)) ease-in-out}.rd-a-smartphone[data-rd-animate="hover"]:hover .bar,:hover>.rd-a-smartphone[data-rd-animate="parent"] .bar,.rd-a-smartphone[data-rd-animate="play"] .bar,.rd-a-smartphone[data-rd-animate="loop"] .bar{animation:rd-smartphone-bar calc(0.6s*var(--rd-speed,1)) ease-in-out}.rd-a-smartphone[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-smartphone-buzz{0%,100%{rotate:0deg}15%{rotate:-4deg}35%{rotate:4deg}55%{rotate:-3deg}75%{rotate:2deg}}@keyframes rd-smartphone-bar{0%,100%{scale:1 1}40%{scale:1.7 1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="ph"><path d="M17.28 4.78A3.5 3.5 0 0 1 17.5 6V18A3.5 3.5 0 0 1 14 21.5H10A3.5 3.5 0 0 1 6.5 18V6A3.5 3.5 0 0 1 10 2.5H14A3.5 3.5 0 0 1 15.22 2.72"/></g><path class="bar" d="M10.5 18h3"/></g></svg>
