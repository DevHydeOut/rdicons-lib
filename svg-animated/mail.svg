<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-mail" data-rd-animate="hover"><style>.rd-a-mail{overflow:visible}.rd-a-mail *{transform-box:view-box}.rd-a-mail .shape{transform-origin:12px 12px}.rd-a-mail .close{stroke-dasharray:1 2;stroke-dashoffset:1.2}@media (prefers-reduced-motion:no-preference){.rd-a-mail[data-rd-animate="hover"]:hover .close,:hover>.rd-a-mail[data-rd-animate="parent"] .close,.rd-a-mail[data-rd-animate="play"] .close,.rd-a-mail[data-rd-animate="loop"] .close{animation:rd-mail-close calc(0.9s*var(--rd-speed,1)) ease-in-out}.rd-a-mail[data-rd-animate="hover"]:hover .shape,:hover>.rd-a-mail[data-rd-animate="parent"] .shape,.rd-a-mail[data-rd-animate="play"] .shape,.rd-a-mail[data-rd-animate="loop"] .shape{animation:rd-mail-seal calc(0.9s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-mail[data-rd-animate="hover"]:hover .flap,:hover>.rd-a-mail[data-rd-animate="parent"] .flap,.rd-a-mail[data-rd-animate="play"] .flap,.rd-a-mail[data-rd-animate="loop"] .flap{animation:rd-mail-flap calc(0.9s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-mail[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-mail-close{0%,100%{stroke-dashoffset:1.2}30%,68%{stroke-dashoffset:0}}@keyframes rd-mail-seal{0%,100%{scale:1}34%{scale:.95}52%{scale:1.03}}@keyframes rd-mail-flap{0%,100%{translate:0 0}35%{translate:0 -1.3px}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="shape"><path d="M20.03 7.89A5 5 0 0 1 20.5 10v4a5 5 0 0 1-5 5h-7a5 5 0 0 1-5-5v-4a5 5 0 0 1 5-5h7a5 5 0 0 1 2.11.47"/><path class="close" pathLength="1" d="M17.61 5.47A5 5 0 0 1 20.03 7.89"/><path class="flap" d="M4.6 9l6.5 4.5a1.6 1.6 0 0 0 1.8 0L19.4 9"/></g></g></svg>
