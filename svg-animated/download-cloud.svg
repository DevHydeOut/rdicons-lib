<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-download-cloud" data-rd-animate="hover"><style>.rd-a-download-cloud{overflow:visible}.rd-a-download-cloud *{transform-box:view-box}@media (prefers-reduced-motion:no-preference){.rd-a-download-cloud[data-rd-animate="hover"]:hover .a,:hover>.rd-a-download-cloud[data-rd-animate="parent"] .a,.rd-a-download-cloud[data-rd-animate="play"] .a,.rd-a-download-cloud[data-rd-animate="loop"] .a{animation:rd-download-cloud-m calc(0.7s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-download-cloud[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-download-cloud-m{0%,100%{translate:0 0}40%{translate:0 2.6px}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><path d="M7 17.5a3.5 3.5 0 0 1-.4-7 5.5 5.5 0 0 1 10.8-.7A3.6 3.6 0 0 1 17 17.5"/><path d="M12 10.5v8.5M8.5 15.5l3.5 3.5 3.5-3.5"/></g></g></svg>
