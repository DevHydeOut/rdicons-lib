<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-brackets" data-rd-animate="hover"><style>.rd-a-brackets{overflow:visible}.rd-a-brackets *{transform-box:view-box}.rd-a-brackets .d{stroke-dasharray:1 2}@media (prefers-reduced-motion:no-preference){.rd-a-brackets[data-rd-animate="hover"]:hover .d,:hover>.rd-a-brackets[data-rd-animate="parent"] .d,.rd-a-brackets[data-rd-animate="play"] .d,.rd-a-brackets[data-rd-animate="loop"] .d{animation:rd-brackets-draw calc(0.75s*var(--rd-speed,1)) ease-out;animation-delay:calc(var(--k)*.1s*var(--rd-speed,1))}.rd-a-brackets[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-brackets-draw{0%{stroke-dashoffset:1.2}100%{stroke-dashoffset:0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="d" style="--k:0"><path pathLength="1" d="M8.5 4.5h-3v15h3"/></g><g class="d" style="--k:1"><path pathLength="1" d="M15.5 4.5h3v15h-3"/></g></g></svg>
