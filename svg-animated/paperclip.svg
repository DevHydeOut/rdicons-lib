<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-paperclip" data-rd-animate="hover"><style>.rd-a-paperclip{overflow:visible}.rd-a-paperclip *{transform-box:view-box}.rd-a-paperclip .d{stroke-dasharray:1 2}@media (prefers-reduced-motion:no-preference){.rd-a-paperclip[data-rd-animate="hover"]:hover .d,:hover>.rd-a-paperclip[data-rd-animate="parent"] .d,.rd-a-paperclip[data-rd-animate="play"] .d,.rd-a-paperclip[data-rd-animate="loop"] .d{animation:rd-paperclip-draw calc(0.75s*var(--rd-speed,1)) ease-out;animation-delay:calc(var(--k)*.1s*var(--rd-speed,1))}.rd-a-paperclip[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-paperclip-draw{0%{stroke-dashoffset:1.2}100%{stroke-dashoffset:0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="d" style="--k:0"><path pathLength="1" d="M19.5 11.5l-7.8 7.8a4.5 4.5 0 0 1-6.4-6.4l8.3-8.3a3 3 0 0 1 4.3 4.3l-8.4 8.3a1.5 1.5 0 0 1-2.1-2.1L15 8.5"/></g></g></svg>
