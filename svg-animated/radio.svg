<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-radio" data-rd-animate="hover"><style>.rd-a-radio{overflow:visible}.rd-a-radio *{transform-box:view-box}.rd-a-radio .p0{transform-origin:7px 8.5px}@media (prefers-reduced-motion:no-preference){.rd-a-radio[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-radio[data-rd-animate="parent"] .p0,.rd-a-radio[data-rd-animate="play"] .p0,.rd-a-radio[data-rd-animate="loop"] .p0{animation:rd-radio-f0 calc(1s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-radio[data-rd-animate="hover"]:hover .p1,:hover>.rd-a-radio[data-rd-animate="parent"] .p1,.rd-a-radio[data-rd-animate="play"] .p1,.rd-a-radio[data-rd-animate="loop"] .p1{animation:rd-radio-f1 calc(0.9s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-radio[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-radio-f0{0%,100%{rotate:0deg}30%{rotate:calc(var(--s)*8deg)}65%{rotate:calc(var(--s)*-6deg)}}@keyframes rd-radio-f1{0%,100%{translate:0 0}50%{translate:calc(var(--s)*2.6px) 0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><rect x="3.5" y="8.5" width="17" height="11" rx="3"/><circle cx="8.5" cy="14" r="2.5"/><g><g class="p0" style="--k:0;--s:1"><path d="M7 8.5l9.5-5"/></g></g><g><g class="p1" style="--k:0;--s:1"><path d="M14 12.5h3.5M14 15.5h3.5"/></g></g></g></svg>
