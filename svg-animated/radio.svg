<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-radio" data-rd-animate="hover"><style>.rd-a-radio{overflow:visible}.rd-a-radio *{transform-box:view-box}.rd-a-radio .a{transform-origin:12px 20px}@media (prefers-reduced-motion:no-preference){.rd-a-radio[data-rd-animate="hover"]:hover .a,:hover>.rd-a-radio[data-rd-animate="parent"] .a,.rd-a-radio[data-rd-animate="play"] .a,.rd-a-radio[data-rd-animate="loop"] .a{animation:rd-radio-m calc(0.7s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-radio[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-radio-m{0%,100%{scale:1 1}40%{scale:1.1 .86}70%{scale:.95 1.06}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><rect x="3.5" y="8.5" width="17" height="11" rx="3"/><path d="M7 8.5l9.5-5"/><circle cx="8.5" cy="14" r="2.5"/><path d="M14 12.5h3.5M14 15.5h3.5"/></g></g></svg>
