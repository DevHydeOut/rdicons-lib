<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-image" data-rd-animate="hover"><style>.rd-a-image{overflow:visible}.rd-a-image *{transform-box:view-box}.rd-a-image .shape{transform-origin:12px 12px}.rd-a-image .sun{transform-origin:9px 10px}.rd-a-image .close{stroke-dasharray:1 2;stroke-dashoffset:1.2}@media (prefers-reduced-motion:no-preference){.rd-a-image[data-rd-animate="hover"]:hover .close,:hover>.rd-a-image[data-rd-animate="parent"] .close,.rd-a-image[data-rd-animate="play"] .close,.rd-a-image[data-rd-animate="loop"] .close{animation:rd-image-close calc(0.9s*var(--rd-speed,1)) ease-in-out}.rd-a-image[data-rd-animate="hover"]:hover .shape,:hover>.rd-a-image[data-rd-animate="parent"] .shape,.rd-a-image[data-rd-animate="play"] .shape,.rd-a-image[data-rd-animate="loop"] .shape{animation:rd-image-seal calc(0.9s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-image[data-rd-animate="hover"]:hover .sun,:hover>.rd-a-image[data-rd-animate="parent"] .sun,.rd-a-image[data-rd-animate="play"] .sun,.rd-a-image[data-rd-animate="loop"] .sun{animation:rd-image-sun calc(0.9s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-image[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-image-close{0%,100%{stroke-dashoffset:1.2}30%,68%{stroke-dashoffset:0}}@keyframes rd-image-seal{0%,100%{scale:1}34%{scale:.95}52%{scale:1.03}}@keyframes rd-image-sun{0%,100%{scale:1}40%{scale:1.7}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="shape"><path d="M20.17 6.9A4 4 0 0 1 20.5 8.5V15.5A4 4 0 0 1 16.5 19.5H7.5A4 4 0 0 1 3.5 15.5V8.5A4 4 0 0 1 7.5 4.5H16.5A4 4 0 0 1 18.1 4.83"/><path class="close" pathLength="1" d="M18.1 4.83A4 4 0 0 1 20.17 6.9"/><circle class="sun" cx="9" cy="10" r="1.6"/><path d="M4 17l4.5-4.5a1.6 1.6 0 0 1 2.2 0L16 17.5M14 15.5l1.5-1.5a1.6 1.6 0 0 1 2.2 0l2.8 2.5"/></g></g></svg>
