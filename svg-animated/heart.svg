<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-heart" data-rd-animate="hover"><style>.rd-a-heart{overflow:visible}.rd-a-heart *{transform-box:view-box}.rd-a-heart .shape{transform-origin:12px 13px}@media (prefers-reduced-motion:no-preference){.rd-a-heart[data-rd-animate="hover"]:hover .shape,:hover>.rd-a-heart[data-rd-animate="parent"] .shape,.rd-a-heart[data-rd-animate="play"] .shape,.rd-a-heart[data-rd-animate="loop"] .shape{animation:rd-heart-beat calc(0.85s*var(--rd-speed,1)) ease-in-out}.rd-a-heart[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-heart-beat{0%,100%{scale:1}18%{scale:1.2}36%{scale:.95}56%{scale:1.1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="shape"><path d="M12 20.2s-8-4.7-8-10.5A4.5 4.5 0 0 1 12 7a4.5 4.5 0 0 1 8 2.7c0 5.8-8 10.5-8 10.5z"/></g></g></svg>
