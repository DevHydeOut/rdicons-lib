<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-tree-deciduous" data-rd-animate="hover"><style>.rd-a-tree-deciduous{overflow:visible}.rd-a-tree-deciduous *{transform-box:view-box}.rd-a-tree-deciduous .p0{transform-origin:12px 15px}@media (prefers-reduced-motion:no-preference){.rd-a-tree-deciduous[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-tree-deciduous[data-rd-animate="parent"] .p0,.rd-a-tree-deciduous[data-rd-animate="play"] .p0,.rd-a-tree-deciduous[data-rd-animate="loop"] .p0{animation:rd-tree-deciduous-f0 calc(1s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-tree-deciduous[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-tree-deciduous-f0{0%,100%{rotate:0deg}30%{rotate:calc(var(--s)*8deg)}65%{rotate:calc(var(--s)*-6deg)}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><path d="M12 20.5V15"/><g><g class="p0" style="--k:0;--s:1"><path d="M8.5 15a5 5 0 0 1-2-9.2 5.5 5.5 0 0 1 11 0 5 5 0 0 1-2 9.2z"/></g></g></g></svg>
