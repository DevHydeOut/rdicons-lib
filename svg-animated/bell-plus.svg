<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-bell-plus" data-rd-animate="hover"><style>.rd-a-bell-plus{overflow:visible}.rd-a-bell-plus *{transform-box:view-box}.rd-a-bell-plus .base{transform-origin:12px 12px}.rd-a-bell-plus .badge{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:no-preference){.rd-a-bell-plus[data-rd-animate="hover"]:hover .base,:hover>.rd-a-bell-plus[data-rd-animate="parent"] .base,.rd-a-bell-plus[data-rd-animate="play"] .base,.rd-a-bell-plus[data-rd-animate="loop"] .base{animation:rd-bell-plus-base calc(0.7s*var(--rd-speed,1)) ease-in-out}.rd-a-bell-plus[data-rd-animate="hover"]:hover .badge,:hover>.rd-a-bell-plus[data-rd-animate="parent"] .badge,.rd-a-bell-plus[data-rd-animate="play"] .badge,.rd-a-bell-plus[data-rd-animate="loop"] .badge{animation:rd-bell-plus-badge calc(0.8s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-bell-plus[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-bell-plus-base{0%,100%{scale:1}40%{scale:.96}}@keyframes rd-bell-plus-badge{0%,100%{scale:1;opacity:1}22%{scale:.1;opacity:0}62%{scale:1.3;opacity:1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="base"><path d="M6.2 17h11.6a.8.8 0 0 0 .6-1.3L17 14v-3.5a5 5 0 0 0-10 0V14l-1.4 1.7a.8.8 0 0 0 .6 1.3z"/><path d="M10 20.2a2 2 0 0 0 4 0"/></g><g class="badge"><path d="M19 3v4M17 5h4"/></g></g></svg>
