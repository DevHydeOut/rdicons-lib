<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-save" data-rd-animate="hover"><style>.rd-a-save{overflow:visible}.rd-a-save *{transform-box:view-box}.rd-a-save .shape{transform-origin:12px 12px}.rd-a-save .close{stroke-dasharray:1 2;stroke-dashoffset:1.2}@media (prefers-reduced-motion:no-preference){.rd-a-save[data-rd-animate="hover"]:hover .close,:hover>.rd-a-save[data-rd-animate="parent"] .close,.rd-a-save[data-rd-animate="play"] .close,.rd-a-save[data-rd-animate="loop"] .close{animation:rd-save-close calc(0.9s*var(--rd-speed,1)) ease-in-out}.rd-a-save[data-rd-animate="hover"]:hover .shape,:hover>.rd-a-save[data-rd-animate="parent"] .shape,.rd-a-save[data-rd-animate="play"] .shape,.rd-a-save[data-rd-animate="loop"] .shape{animation:rd-save-seal calc(0.9s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-save[data-rd-animate="hover"]:hover .shutter,:hover>.rd-a-save[data-rd-animate="parent"] .shutter,.rd-a-save[data-rd-animate="play"] .shutter,.rd-a-save[data-rd-animate="loop"] .shutter{animation:rd-save-slide calc(0.9s*var(--rd-speed,1)) ease-in-out}.rd-a-save[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-save-close{0%,100%{stroke-dashoffset:1.2}30%,68%{stroke-dashoffset:0}}@keyframes rd-save-seal{0%,100%{scale:1}34%{scale:.95}52%{scale:1.03}}@keyframes rd-save-slide{0%,100%{translate:0 0}40%,62%{translate:1.6px 0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="shape"><path d="M19.88 6.16A3 3 0 0 1 20 7V17A3 3 0 0 1 17 20H7A3 3 0 0 1 4 17V7A3 3 0 0 1 7 4H17A3 3 0 0 1 17.84 4.12"/><path class="close" pathLength="1" d="M17.84 4.12A3 3 0 0 1 19.88 6.16"/><path class="shutter" d="M8 4.2v4.3h6.5V4.2"/><path d="M7.5 19.8v-5.5h9v5.5"/></g></g></svg>
