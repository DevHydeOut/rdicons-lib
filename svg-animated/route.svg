<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-route" data-rd-animate="hover"><style>.rd-a-route{overflow:visible}.rd-a-route *{transform-box:view-box}.rd-a-route .p0{stroke-dasharray:1 2}.rd-a-route .p1{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:no-preference){.rd-a-route[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-route[data-rd-animate="parent"] .p0,.rd-a-route[data-rd-animate="play"] .p0,.rd-a-route[data-rd-animate="loop"] .p0{animation:rd-route-f0 calc(0.75s*var(--rd-speed,1)) ease-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-route[data-rd-animate="hover"]:hover .p1,:hover>.rd-a-route[data-rd-animate="parent"] .p1,.rd-a-route[data-rd-animate="play"] .p1,.rd-a-route[data-rd-animate="loop"] .p1{animation:rd-route-f1 calc(0.5s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1);animation-delay:calc((0s + var(--k)*0.15s)*var(--rd-speed,1))}.rd-a-route[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-route-f0{0%{stroke-dashoffset:1.2}100%{stroke-dashoffset:0}}@keyframes rd-route-f1{0%,100%{scale:1}40%{scale:1.5}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g><g class="p0" style="--k:0;--s:1"><path pathLength="1" d="M8.5 19h6a3.5 3.5 0 0 0 0-7H9.5a3.5 3.5 0 0 1 0-7h6"/></g></g><g><g class="p1" style="--k:0;--s:1"><circle cx="6" cy="19" r="2.5"/></g><g class="p1" style="--k:1;--s:1"><circle cx="18" cy="5" r="2.5"/></g></g></g></svg>
