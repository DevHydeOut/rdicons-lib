<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-credit-card" data-rd-animate="hover"><style>.rd-a-credit-card{overflow:visible}.rd-a-credit-card *{transform-box:view-box}.rd-a-credit-card .shape{transform-origin:12px 12px}.rd-a-credit-card .close{stroke-dasharray:1 2;stroke-dashoffset:1.2}@media (prefers-reduced-motion:no-preference){.rd-a-credit-card[data-rd-animate="hover"]:hover .close,:hover>.rd-a-credit-card[data-rd-animate="parent"] .close,.rd-a-credit-card[data-rd-animate="play"] .close,.rd-a-credit-card[data-rd-animate="loop"] .close{animation:rd-credit-card-close calc(0.9s*var(--rd-speed,1)) ease-in-out}.rd-a-credit-card[data-rd-animate="hover"]:hover .shape,:hover>.rd-a-credit-card[data-rd-animate="parent"] .shape,.rd-a-credit-card[data-rd-animate="play"] .shape,.rd-a-credit-card[data-rd-animate="loop"] .shape{animation:rd-credit-card-seal calc(0.9s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-credit-card[data-rd-animate="hover"]:hover .chip,:hover>.rd-a-credit-card[data-rd-animate="parent"] .chip,.rd-a-credit-card[data-rd-animate="play"] .chip,.rd-a-credit-card[data-rd-animate="loop"] .chip{animation:rd-credit-card-chip calc(0.9s*var(--rd-speed,1)) ease-in-out}.rd-a-credit-card[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-credit-card-close{0%,100%{stroke-dashoffset:1.2}30%,68%{stroke-dashoffset:0}}@keyframes rd-credit-card-seal{0%,100%{scale:1}34%{scale:.95}52%{scale:1.03}}@keyframes rd-credit-card-chip{0%,100%{translate:0 0}40%,62%{translate:8px 0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="shape"><path d="M21.28 7.78A3.5 3.5 0 0 1 21.5 9V15A3.5 3.5 0 0 1 18 18.5H6A3.5 3.5 0 0 1 2.5 15V9A3.5 3.5 0 0 1 6 5.5H18A3.5 3.5 0 0 1 19.22 5.72"/><path class="close" pathLength="1" d="M19.22 5.72A3.5 3.5 0 0 1 21.28 7.78"/><path d="M2.7 10h18.6"/><path class="chip" d="M6.5 14.5h3"/></g></g></svg