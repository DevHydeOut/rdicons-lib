<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-rainbow" data-rd-animate="hover"><style>.rd-a-rainbow{overflow:visible}.rd-a-rainbow *{transform-box:view-box}.rd-a-rainbow .p0{stroke-dasharray:1 2}.rd-a-rainbow .p1{stroke-dasharray:1 2}.rd-a-rainbow .p2{stroke-dasharray:1 2}@media (prefers-reduced-motion:no-preference){.rd-a-rainbow[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-rainbow[data-rd-animate="parent"] .p0,.rd-a-rainbow[data-rd-animate="play"] .p0,.rd-a-rainbow[data-rd-animate="loop"] .p0{animation:rd-rainbow-f0 calc(0.75s*var(--rd-speed,1)) ease-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-rainbow[data-rd-animate="hover"]:hover .p1,:hover>.rd-a-rainbow[data-rd-animate="parent"] .p1,.rd-a-rainbow[data-rd-animate="play"] .p1,.rd-a-rainbow[data-rd-animate="loop"] .p1{animation:rd-rainbow-f1 calc(0.75s*var(--rd-speed,1)) ease-out;animation-delay:calc((0.12s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-rainbow[data-rd-animate="hover"]:hover .p2,:hover>.rd-a-rainbow[data-rd-animate="parent"] .p2,.rd-a-rainbow[data-rd-animate="play"] .p2,.rd-a-rainbow[data-rd-animate="loop"] .p2{animation:rd-rainbow-f2 calc(0.75s*var(--rd-speed,1)) ease-out;animation-delay:calc((0.24s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-rainbow[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-rainbow-f0{0%{stroke-dashoffset:1.2}100%{stroke-dashoffset:0}}@keyframes rd-rainbow-f1{0%{stroke-dashoffset:1.2}100%{stroke-dashoffset:0}}@keyframes rd-rainbow-f2{0%{stroke-dashoffset:1.2}100%{stroke-dashoffset:0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g><g class="p0" style="--k:0;--s:1"><path pathLength="1" d="M9.5 18.5a2.5 2.5 0 0 1 5 0"/></g></g><g><g class="p1" style="--k:0;--s:1"><path pathLength="1" d="M6 18.5a6 6 0 0 1 12 0"/></g></g><g><g class="p2" style="--k:0;--s:1"><path pathLength="1" d="M2.5 18.5a9.5 9.5 0 0 1 19 0"