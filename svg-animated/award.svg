<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-award" data-rd-animate="hover"><style>.rd-a-award{overflow:visible}.rd-a-award *{transform-box:view-box}.rd-a-award .p0{transform-origin:12px 14px}@media (prefers-reduced-motion:no-preference){.rd-a-award[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-award[data-rd-animate="parent"] .p0,.rd-a-award[data-rd-animate="play"] .p0,.rd-a-award[data-rd-animate="loop"] .p0{animation:rd-award-f0 calc(1s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-award[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-award-f0{0%,100%{rotate:0deg}30%{rotate:calc(var(--s)*8deg)}65%{rotate:calc(var(--s)*-6deg)}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><circle cx="12" cy="9" r="5.5"/><g><g class="p0" style="--k:0;--s:1"><path d="M8.5 14l-1.5 6.5 5-2.5 5 2.5-1.5-6.5"/></g></g></g></svg>
