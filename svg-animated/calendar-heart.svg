<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-calendar-heart" data-rd-animate="hover"><style>.rd-a-calendar-heart{overflow:visible}.rd-a-calendar-heart *{transform-box:view-box}.rd-a-calendar-heart .base{transform-origin:12px 12px}.rd-a-calendar-heart .badge{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:no-preference){.rd-a-calendar-heart[data-rd-animate="hover"]:hover .base,:hover>.rd-a-calendar-heart[data-rd-animate="parent"] .base,.rd-a-calendar-heart[data-rd-animate="play"] .base,.rd-a-calendar-heart[data-rd-animate="loop"] .base{animation:rd-calendar-heart-base calc(0.7s*var(--rd-speed,1)) ease-in-out}.rd-a-calendar-heart[data-rd-animate="hover"]:hover .badge,:hover>.rd-a-calendar-heart[data-rd-animate="parent"] .badge,.rd-a-calendar-heart[data-rd-animate="play"] .badge,.rd-a-calendar-heart[data-rd-animate="loop"] .badge{animation:rd-calendar-heart-badge calc(0.8s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-calendar-heart[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-calendar-heart-base{0%,100%{scale:1}40%{scale:.96}}@keyframes rd-calendar-heart-badge{0%,100%{scale:1;opacity:1}22%{scale:.1;opacity:0}62%{scale:1.3;opacity:1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="base"><path d="M20.08 8.1A4.5 4.5 0 0 1 20.5 10v6a4.5 4.5 0 0 1-4.5 4.5H8a4.5 4.5 0 0 1-4.5-4.5v-6A4.5 4.5 0 0 1 8 5.5h8a4.5 4.5 0 0 1 1.9.42"/><path d="M3.7 10.5h16.6"/><path d="M8 3.5v3M16 3.5v3"/></g><g class="badge"><path d="M12 18.1c-2 -1.3 -3 -2.3 -3 -3.6a1.7 1.7 0 0 1 3 -1a1.7 1.7 0 0 1 3 1c0 1.3 -1 2.3 -3 3.6z"/></g></g></svg>
