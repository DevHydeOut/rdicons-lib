<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-wink" data-rd-animate="hover"><style>.rd-a-wink{overflow:visible}.rd-a-wink *{transform-box:view-box}.rd-a-wink .p0{transform-box:fill-box;transform-origin:center}.rd-a-wink .p1{transform-origin:12px 14.5px}@media (prefers-reduced-motion:no-preference){.rd-a-wink[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-wink[data-rd-animate="parent"] .p0,.rd-a-wink[data-rd-animate="play"] .p0,.rd-a-wink[data-rd-animate="loop"] .p0{animation:rd-wink-f0 calc(0.6s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-wink[data-rd-animate="hover"]:hover .p1,:hover>.rd-a-wink[data-rd-animate="parent"] .p1,.rd-a-wink[data-rd-animate="play"] .p1,.rd-a-wink[data-rd-animate="loop"] .p1{animation:rd-wink-f1 calc(0.7s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1);animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-wink[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-wink-f0{0%,100%{scale:1 1}45%{scale:1 .15}}@keyframes rd-wink-f1{0%,100%{scale:1 1}45%{scale:1.1 1.5}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><circle cx="12" cy="12" r="8.5"/><path d="M7.5 10h3"/><g><g class="p0" style="--k:0;--s:1"><path d="M15 10h.01"/></g></g><g><g class="p1" style="--k:0;--s:1"><path d="M8.5 14.5c1 1.5 2.2 2 3.5 2s2.5-.5 3.5-2"/></g></g></g></svg>
