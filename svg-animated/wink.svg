<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-wink" data-rd-animate="hover"><style>.rd-a-wink{overflow:visible}.rd-a-wink *{transform-box:view-box}.rd-a-wink .a{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-wink[data-rd-animate="hover"]:hover .a,:hover>.rd-a-wink[data-rd-animate="parent"] .a,.rd-a-wink[data-rd-animate="play"] .a,.rd-a-wink[data-rd-animate="loop"] .a{animation:rd-wink-m calc(0.7s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-wink[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-wink-m{0%,100%{scale:1}35%{scale:.88}65%{scale:1.1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><circle cx="12" cy="12" r="8.5"/><path d="M15 10h.01"/><path d="M7.5 10h3"/><path d="M8.5 14.5c1 1.5 2.2 2 3.5 2s2.5-.5 3.5-2"/></g></g></svg>
