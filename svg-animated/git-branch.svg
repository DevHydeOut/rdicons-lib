<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-git-branch" data-rd-animate="hover"><style>.rd-a-git-branch{overflow:visible}.rd-a-git-branch *{transform-box:view-box}.rd-a-git-branch .p0{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:no-preference){.rd-a-git-branch[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-git-branch[data-rd-animate="parent"] .p0,.rd-a-git-branch[data-rd-animate="play"] .p0,.rd-a-git-branch[data-rd-animate="loop"] .p0{animation:rd-git-branch-f0 calc(0.5s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1);animation-delay:calc((0s + var(--k)*0.15s)*var(--rd-speed,1))}.rd-a-git-branch[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-git-branch-f0{0%,100%{scale:1}40%{scale:1.5}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><path d="M6 8v8M18 11v1a3 3 0 0 1-3 3H6"/><g><g class="p0" style="--k:0;--s:1"><circle cx="6" cy="5.5" r="2.5"/></g><g class="p0" style="--k:1;--s:1"><circle cx="6" cy="18.5" r="2.5"/></g><g class="p0" style="--k:2;--s:1"><circle cx="18" cy="8.5" r="2.5"/></g></g></g></svg>
