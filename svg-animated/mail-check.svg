<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-mail-check" data-rd-animate="hover"><style>.rd-a-mail-check{overflow:visible}.rd-a-mail-check *{transform-box:view-box}.rd-a-mail-check .base{transform-origin:12px 12px}.rd-a-mail-check .badge{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:no-preference){.rd-a-mail-check[data-rd-animate="hover"]:hover .base,:hover>.rd-a-mail-check[data-rd-animate="parent"] .base,.rd-a-mail-check[data-rd-animate="play"] .base,.rd-a-mail-check[data-rd-animate="loop"] .base{animation:rd-mail-check-base calc(0.7s*var(--rd-speed,1)) ease-in-out}.rd-a-mail-check[data-rd-animate="hover"]:hover .badge,:hover>.rd-a-mail-check[data-rd-animate="parent"] .badge,.rd-a-mail-check[data-rd-animate="play"] .badge,.rd-a-mail-check[data-rd-animate="loop"] .badge{animation:rd-mail-check-badge calc(0.8s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-mail-check[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-mail-check-base{0%,100%{scale:1}40%{scale:.96}}@keyframes rd-mail-check-badge{0%,100%{scale:1;opacity:1}22%{scale:.1;opacity:0}62%{scale:1.3;opacity:1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="base"><path d="M20.5 11V8a3 3 0 0 0-3-3h-11a3 3 0 0 0-3 3v8a3 3 0 0 0 3 3H12"/><path d="M3.5 8l8.5 5.5L20.5 8"/></g><g class="badge"><path d="M16 18.5l2 2 3.5-4"/></g></g></svg>
