<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-pin" data-rd-animate="hover"><style>.rd-a-pin{overflow:visible}.rd-a-pin *{transform-box:view-box}.rd-a-pin .needle{transform-origin:12px 14px}@media (prefers-reduced-motion:no-preference){.rd-a-pin[data-rd-animate="hover"]:hover .head,:hover>.rd-a-pin[data-rd-animate="parent"] .head,.rd-a-pin[data-rd-animate="play"] .head,.rd-a-pin[data-rd-animate="loop"] .head{animation:rd-pin-press calc(0.6s*var(--rd-speed,1)) ease-in-out}.rd-a-pin[data-rd-animate="hover"]:hover .needle,:hover>.rd-a-pin[data-rd-animate="parent"] .needle,.rd-a-pin[data-rd-animate="play"] .needle,.rd-a-pin[data-rd-animate="loop"] .needle{animation:rd-pin-needle calc(0.6s*var(--rd-speed,1)) ease-in-out}.rd-a-pin[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-pin-press{0%,100%{translate:0 0}40%{translate:0 3px}}@keyframes rd-pin-needle{0%,100%{scale:1 1}40%{scale:1 .55}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><path class="head" d="M9 4h6l-.7 5.5 2.7 3v1.5H7v-1.5l2.7-3z"/><path class="needle" d="M12 14v6.5"/></g></svg>
