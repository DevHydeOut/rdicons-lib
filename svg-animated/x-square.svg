<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-x-square" data-rd-animate="hover"><style>.rd-a-x-square{overflow:visible}.rd-a-x-square *{transform-box:view-box}.rd-a-x-square .base{transform-origin:12px 12px}.rd-a-x-square .badge{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:no-preference){.rd-a-x-square[data-rd-animate="hover"]:hover .base,:hover>.rd-a-x-square[data-rd-animate="parent"] .base,.rd-a-x-square[data-rd-animate="play"] .base,.rd-a-x-square[data-rd-animate="loop"] .base{animation:rd-x-square-base calc(0.7s*var(--rd-speed,1)) ease-in-out}.rd-a-x-square[data-rd-animate="hover"]:hover .badge,:hover>.rd-a-x-square[data-rd-animate="parent"] .badge,.rd-a-x-square[data-rd-animate="play"] .badge,.rd-a-x-square[data-rd-animate="loop"] .badge{animation:rd-x-square-badge calc(0.8s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-x-square[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-x-square-base{0%,100%{scale:1}40%{scale:.96}}@keyframes rd-x-square-badge{0%,100%{scale:1;opacity:1}22%{scale:.1;opacity:0}62%{scale:1.3;opacity:1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="base"><path d="M19.67 6.4A4 4 0 0 1 20 8V16A4 4 0 0 1 16 20H8A4 4 0 0 1 4 16V8A4 4 0 0 1 8 4H16A4 4 0 0 1 17.6 4.33"/></g><g class="badge"><path d="M9 9l6 6M15 9l-6 6"/></g></g></svg>
