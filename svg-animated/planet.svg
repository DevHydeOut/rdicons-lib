<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-planet" data-rd-animate="hover"><style>.rd-a-planet{overflow:visible}.rd-a-planet *{transform-box:view-box}.rd-a-planet .a{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-planet[data-rd-animate="hover"]:hover .a,:hover>.rd-a-planet[data-rd-animate="parent"] .a,.rd-a-planet[data-rd-animate="play"] .a,.rd-a-planet[data-rd-animate="loop"] .a{animation:rd-planet-m calc(0.7s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-planet[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-planet-m{0%,100%{scale:1}35%{scale:.88}65%{scale:1.1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><circle cx="12" cy="12" r="5"/><ellipse cx="12" cy="12" rx="9.5" ry="3" transform="rotate(-20 12 12)"/></g></g></svg>
