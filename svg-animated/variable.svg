<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-variable" data-rd-animate="hover"><style>.rd-a-variable{overflow:visible}.rd-a-variable *{transform-box:view-box}.rd-a-variable .d{stroke-dasharray:1 2}@media (prefers-reduced-motion:no-preference){.rd-a-variable[data-rd-animate="hover"]:hover .d,:hover>.rd-a-variable[data-rd-animate="parent"] .d,.rd-a-variable[data-rd-animate="play"] .d,.rd-a-variable[data-rd-animate="loop"] .d{animation:rd-variable-draw calc(0.75s*var(--rd-speed,1)) ease-out;animation-delay:calc(var(--k)*.1s*var(--rd-speed,1))}.rd-a-variable[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-variable-draw{0%{stroke-dashoffset:1.2}100%{stroke-dashoffset:0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="d" style="--k:0"><path pathLength="1" d="M8 4.5c-2 3-2 12 0 15"/></g><g class="d" style="--k:1"><path pathLength="1" d="M16 4.5c2 3 2 12 0 15"/></g><g class="d" style="--k:2"><path pathLength="1" d="M9.5 9.5l5 5"/></g><g class="d" style="--k:3"><path pathLength="1" d="M14.5 9.5l-5 5"/></g></g></svg>
