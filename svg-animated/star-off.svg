<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-star-off" data-rd-animate="hover"><style>.rd-a-star-off{overflow:visible}.rd-a-star-off *{transform-box:view-box}.rd-a-star-off .base{transform-origin:12px 12px}.rd-a-star-off .badge{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:no-preference){.rd-a-star-off[data-rd-animate="hover"]:hover .base,:hover>.rd-a-star-off[data-rd-animate="parent"] .base,.rd-a-star-off[data-rd-animate="play"] .base,.rd-a-star-off[data-rd-animate="loop"] .base{animation:rd-star-off-base calc(0.7s*var(--rd-speed,1)) ease-in-out}.rd-a-star-off[data-rd-animate="hover"]:hover .badge,:hover>.rd-a-star-off[data-rd-animate="parent"] .badge,.rd-a-star-off[data-rd-animate="play"] .badge,.rd-a-star-off[data-rd-animate="loop"] .badge{animation:rd-star-off-badge calc(0.8s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-star-off[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-star-off-base{0%,100%{scale:1}40%{scale:.96}}@keyframes rd-star-off-badge{0%,100%{scale:1;opacity:1}22%{scale:.1;opacity:0}62%{scale:1.3;opacity:1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="base"><path d="M12 3.8l2.5 5.3 5.8.8-4.2 4.1 1 5.8L12 17.1l-5.1 2.7 1-5.8-4.2-4.1 5.8-.8z"/></g><g class="badge"><path d="M4.5 4.5l15 15"/></g></g></svg>
