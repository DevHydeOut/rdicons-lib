<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-waves" data-rd-animate="hover"><style>.rd-a-waves{overflow:visible}.rd-a-waves *{transform-box:view-box}@media (prefers-reduced-motion:no-preference){.rd-a-waves[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-waves[data-rd-animate="parent"] .p0,.rd-a-waves[data-rd-animate="play"] .p0,.rd-a-waves[data-rd-animate="loop"] .p0{animation:rd-waves-f0 calc(0.9s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0.12s)*var(--rd-speed,1))}.rd-a-waves[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-waves-f0{0%,100%{translate:0 0}50%{translate:calc(var(--s)*2.6px) 0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g><g class="p0" style="--k:0;--s:1"><path d="M3 8c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/></g><g class="p0" style="--k:1;--s:-1"><path d="M3 13c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/></g><g class="p0" style="--k:2;--s:1"><path d="M3 18c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/></g></g></g></svg>
