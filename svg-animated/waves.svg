<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-waves" data-rd-animate="hover"><style>.rd-a-waves{overflow:visible}.rd-a-waves *{transform-box:view-box}@media (prefers-reduced-motion:no-preference){.rd-a-waves[data-rd-animate="hover"]:hover .a,:hover>.rd-a-waves[data-rd-animate="parent"] .a,.rd-a-waves[data-rd-animate="play"] .a,.rd-a-waves[data-rd-animate="loop"] .a{animation:rd-waves-m calc(1s*var(--rd-speed,1)) ease-in-out}.rd-a-waves[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-waves-m{0%,100%{translate:0 0}50%{translate:0 -2px}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><path d="M3 8c2-2 4-2 6 0s4 2 6 0 4-2 6 0M3 13c2-2 4-2 6 0s4 2 6 0 4-2 6 0M3 18c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/></g></g></svg>
