<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-test-tube" data-rd-animate="hover"><style>.rd-a-test-tube{overflow:visible}.rd-a-test-tube *{transform-box:view-box}@media (prefers-reduced-motion:no-preference){.rd-a-test-tube[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-test-tube[data-rd-animate="parent"] .p0,.rd-a-test-tube[data-rd-animate="play"] .p0,.rd-a-test-tube[data-rd-animate="loop"] .p0{animation:rd-test-tube-f0 calc(0.9s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-test-tube[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-test-tube-f0{0%,100%{translate:0 0}50%{translate:0 -1.6px}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><path d="M9 3.5h6"/><path d="M10.5 3.5v13.5a1.5 1.5 0 0 0 3 0V3.5"/><g><g class="p0" style="--k:0;--s:1"><path d="M10.5 12h3"/></g></g></g></svg>
