<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-crown" data-rd-animate="hover"><style>.rd-a-crown{overflow:visible}.rd-a-crown *{transform-box:view-box}.rd-a-crown .d{stroke-dasharray:1 2}@media (prefers-reduced-motion:no-preference){.rd-a-crown[data-rd-animate="hover"]:hover .d,:hover>.rd-a-crown[data-rd-animate="parent"] .d,.rd-a-crown[data-rd-animate="play"] .d,.rd-a-crown[data-rd-animate="loop"] .d{animation:rd-crown-draw calc(0.75s*var(--rd-speed,1)) ease-out;animation-delay:calc(var(--k)*.1s*var(--rd-speed,1))}.rd-a-crown[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-crown-draw{0%{stroke-dashoffset:1.2}100%{stroke-dashoffset:0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="d" style="--k:0"><path pathLength="1" d="M3.5 8l4.5 4 4-6.5 4 6.5 4.5-4-1.8 10.5H5.3z"/></g></g></svg>
