<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-mountain" data-rd-animate="hover"><style>.rd-a-mountain{overflow:visible}.rd-a-mountain *{transform-box:view-box}.rd-a-mountain .p0{transform-origin:12px 19.5px}@media (prefers-reduced-motion:no-preference){.rd-a-mountain[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-mountain[data-rd-animate="parent"] .p0,.rd-a-mountain[data-rd-animate="play"] .p0,.rd-a-mountain[data-rd-animate="loop"] .p0{animation:rd-mountain-f0 calc(0.8s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1);animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-mountain[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-mountain-f0{0%,100%{scale:1 1}45%{scale:1 1.2}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g><g class="p0" style="--k:0;--s:1"><path d="M2.5 19.5l6.5-11 4 6.5 2-3.2 6 7.7z"/></g></g></g></svg>
