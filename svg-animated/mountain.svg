<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-mountain" data-rd-animate="hover"><style>.rd-a-mountain{overflow:visible}.rd-a-mountain *{transform-box:view-box}.rd-a-mountain .a{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-mountain[data-rd-animate="hover"]:hover .a,:hover>.rd-a-mountain[data-rd-animate="parent"] .a,.rd-a-mountain[data-rd-animate="play"] .a,.rd-a-mountain[data-rd-animate="loop"] .a{animation:rd-mountain-m calc(0.7s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-mountain[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-mountain-m{0%,100%{scale:1}45%{scale:1.16}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><path d="M2.5 19.5l6.5-11 4 6.5 2-3.2 6 7.7z"/></g></g></svg>
