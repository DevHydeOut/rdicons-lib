<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-cloud-hail" data-rd-animate="hover"><style>.rd-a-cloud-hail{overflow:visible}.rd-a-cloud-hail *{transform-box:view-box}.rd-a-cloud-hail .base{transform-origin:12px 12px}.rd-a-cloud-hail .badge{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:no-preference){.rd-a-cloud-hail[data-rd-animate="hover"]:hover .base,:hover>.rd-a-cloud-hail[data-rd-animate="parent"] .base,.rd-a-cloud-hail[data-rd-animate="play"] .base,.rd-a-cloud-hail[data-rd-animate="loop"] .base{animation:rd-cloud-hail-base calc(0.7s*var(--rd-speed,1)) ease-in-out}.rd-a-cloud-hail[data-rd-animate="hover"]:hover .badge,:hover>.rd-a-cloud-hail[data-rd-animate="parent"] .badge,.rd-a-cloud-hail[data-rd-animate="play"] .badge,.rd-a-cloud-hail[data-rd-animate="loop"] .badge{animation:rd-cloud-hail-badge calc(0.8s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-cloud-hail[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-cloud-hail-base{0%,100%{scale:1}40%{scale:.96}}@keyframes rd-cloud-hail-badge{0%,100%{scale:1;opacity:1}22%{scale:.1;opacity:0}62%{scale:1.3;opacity:1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="base"><path d="M8 14.5a3.6 3.6 0 0 1-.560-7.12 4.8 4.8 0 0 1 9.2-.880 3.6 3.6 0 0 1-.640 8z"/></g><g class="badge"><circle cx="8" cy="18.2" r="0.8"/><circle cx="12" cy="20.6" r="0.8"/><circle cx="16" cy="18.2" r="0.8"/></g></g></svg>
