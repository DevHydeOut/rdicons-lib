<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-coin" data-rd-animate="hover"><style>.rd-a-coin{overflow:visible}.rd-a-coin *{transform-box:view-box}.rd-a-coin .a{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-coin[data-rd-animate="hover"]:hover .a,:hover>.rd-a-coin[data-rd-animate="parent"] .a,.rd-a-coin[data-rd-animate="play"] .a,.rd-a-coin[data-rd-animate="loop"] .a{animation:rd-coin-m calc(0.8s*var(--rd-speed,1)) ease-in-out}.rd-a-coin[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-coin-m{0%,100%{scale:1}30%{scale:1.2}55%{scale:.95}75%{scale:1.07}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="5"/></g></g></svg>
