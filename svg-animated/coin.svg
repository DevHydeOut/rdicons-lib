<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-coin" data-rd-animate="hover"><style>.rd-a-coin{overflow:visible}.rd-a-coin *{transform-box:view-box}.rd-a-coin .p0{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-coin[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-coin[data-rd-animate="parent"] .p0,.rd-a-coin[data-rd-animate="play"] .p0,.rd-a-coin[data-rd-animate="loop"] .p0{animation:rd-coin-f0 calc(0.7s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-coin[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-coin-f0{0%,100%{scale:1 1}50%{scale:.1 1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g><g class="p0" style="--k:0;--s:1"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="5"/></g></g></g></svg>
