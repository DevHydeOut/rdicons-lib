<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-metronome" data-rd-animate="hover"><style>.rd-a-metronome{overflow:visible}.rd-a-metronome *{transform-box:view-box}.rd-a-metronome .a{transform-origin:12px 4px}@media (prefers-reduced-motion:no-preference){.rd-a-metronome[data-rd-animate="hover"]:hover .a,:hover>.rd-a-metronome[data-rd-animate="parent"] .a,.rd-a-metronome[data-rd-animate="play"] .a,.rd-a-metronome[data-rd-animate="loop"] .a{animation:rd-metronome-m calc(0.9s*var(--rd-speed,1)) ease-in-out}.rd-a-metronome[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-metronome-m{0%,100%{rotate:0deg}25%{rotate:16deg}50%{rotate:-12deg}75%{rotate:6deg}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><path d="M8 20.5L10 4h4l2 16.5z"/><path d="M12 16.5L17.5 5"/></g></g></svg>
