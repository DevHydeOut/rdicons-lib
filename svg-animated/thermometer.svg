<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-thermometer" data-rd-animate="hover"><style>.rd-a-thermometer{overflow:visible}.rd-a-thermometer *{transform-box:view-box}.rd-a-thermometer .p0{transform-origin:12px 16px}@media (prefers-reduced-motion:no-preference){.rd-a-thermometer[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-thermometer[data-rd-animate="parent"] .p0,.rd-a-thermometer[data-rd-animate="play"] .p0,.rd-a-thermometer[data-rd-animate="loop"] .p0{animation:rd-thermometer-f0 calc(0.8s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1);animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-thermometer[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-thermometer-f0{0%,100%{scale:1 1}45%{scale:1 1.2}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><path d="M10 14.5V5.5a2 2 0 1 1 4 0v9a4 4 0 1 1-4 0z"/><g><g class="p0" style="--k:0;--s:1"><path d="M12 9v7"/></g></g></g></svg>
