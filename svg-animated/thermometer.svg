<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-thermometer" data-rd-animate="hover"><style>.rd-a-thermometer{overflow:visible}.rd-a-thermometer *{transform-box:view-box}@media (prefers-reduced-motion:no-preference){.rd-a-thermometer[data-rd-animate="hover"]:hover .a,:hover>.rd-a-thermometer[data-rd-animate="parent"] .a,.rd-a-thermometer[data-rd-animate="play"] .a,.rd-a-thermometer[data-rd-animate="loop"] .a{animation:rd-thermometer-m calc(1s*var(--rd-speed,1)) ease-in-out}.rd-a-thermometer[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-thermometer-m{0%,100%{translate:0 0}50%{translate:2px 0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><path d="M10 14.5V5.5a2 2 0 1 1 4 0v9a4 4 0 1 1-4 0z"/><path d="M12 9v7"/></g></g></svg>
