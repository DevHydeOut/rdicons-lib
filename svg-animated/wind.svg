<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-wind" data-rd-animate="hover"><style>.rd-a-wind{overflow:visible}.rd-a-wind *{transform-box:view-box}@media (prefers-reduced-motion:no-preference){.rd-a-wind[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-wind[data-rd-animate="parent"] .p0,.rd-a-wind[data-rd-animate="play"] .p0,.rd-a-wind[data-rd-animate="loop"] .p0{animation:rd-wind-f0 calc(0.9s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-wind[data-rd-animate="hover"]:hover .p1,:hover>.rd-a-wind[data-rd-animate="parent"] .p1,.rd-a-wind[data-rd-animate="play"] .p1,.rd-a-wind[data-rd-animate="loop"] .p1{animation:rd-wind-f1 calc(0.9s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0.1s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-wind[data-rd-animate="hover"]:hover .p2,:hover>.rd-a-wind[data-rd-animate="parent"] .p2,.rd-a-wind[data-rd-animate="play"] .p2,.rd-a-wind[data-rd-animate="loop"] .p2{animation:rd-wind-f2 calc(0.9s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0.2s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-wind[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-wind-f0{0%,100%{translate:0 0}50%{translate:calc(var(--s)*2.6px) 0}}@keyframes rd-wind-f1{0%,100%{translate:0 0}50%{translate:calc(var(--s)*2.6px) 0}}@keyframes rd-wind-f2{0%,100%{translate:0 0}50%{translate:calc(var(--s)*2.6px) 0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g><g class="p0" style="--k:0;--s:1"><path d="M3.5 9.5h10.5a3 3 0 1 0-3-3"/></g></g><g><g class="p1" style="--k:0;--s:1"><path d="M3.5 14h14a3 3 0 1 1-3 3"/></g></g><g><g class="p2" style="--k:0;--s:1"><path d="M3.5 11.8h8"/></g></g></g></svg>
