<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-eye-closed" data-rd-animate="hover"><style>.rd-a-eye-closed{overflow:visible}.rd-a-eye-closed *{transform-box:view-box}.rd-a-eye-closed .p0{stroke-dasharray:1 2}@media (prefers-reduced-motion:no-preference){.rd-a-eye-closed[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-eye-closed[data-rd-animate="parent"] .p0,.rd-a-eye-closed[data-rd-animate="play"] .p0,.rd-a-eye-closed[data-rd-animate="loop"] .p0{animation:rd-eye-closed-f0 calc(0.75s*var(--rd-speed,1)) ease-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-eye-closed[data-rd-animate="hover"]:hover .p1,:hover>.rd-a-eye-closed[data-rd-animate="parent"] .p1,.rd-a-eye-closed[data-rd-animate="play"] .p1,.rd-a-eye-closed[data-rd-animate="loop"] .p1{animation:rd-eye-closed-f1 calc(0.5s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0.08s)*var(--rd-speed,1))}.rd-a-eye-closed[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-eye-closed-f0{0%{stroke-dashoffset:1.2}100%{stroke-dashoffset:0}}@keyframes rd-eye-closed-f1{0%,100%{translate:0 0}40%{translate:0 1.5px}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g><g class="p0" style="--k:0;--s:1"><path pathLength="1" d="M3.5 10.5c2.5 4 5.5 5 8.5 5s6-1 8.5-5"/></g></g><g><g class="p1" style="--k:0;--s:1"><path d="M12 15.5v2.5"/></g><g class="p1" style="--k:1;--s:1"><path d="M7 14.5l-1.5 2.5"/></g><g class="p1" style="--k:2;--s:1"><path d="M17 14.5l1.5 2.5"/></g></g></g></svg>
