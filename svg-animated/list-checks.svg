<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-list-checks" data-rd-animate="hover"><style>.rd-a-list-checks{overflow:visible}.rd-a-list-checks *{transform-box:view-box}.rd-a-list-checks .p0{stroke-dasharray:1 2}.rd-a-list-checks .p1{stroke-dasharray:1 2}@media (prefers-reduced-motion:no-preference){.rd-a-list-checks[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-list-checks[data-rd-animate="parent"] .p0,.rd-a-list-checks[data-rd-animate="play"] .p0,.rd-a-list-checks[data-rd-animate="loop"] .p0{animation:rd-list-checks-f0 calc(0.75s*var(--rd-speed,1)) ease-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-list-checks[data-rd-animate="hover"]:hover .p1,:hover>.rd-a-list-checks[data-rd-animate="parent"] .p1,.rd-a-list-checks[data-rd-animate="play"] .p1,.rd-a-list-checks[data-rd-animate="loop"] .p1{animation:rd-list-checks-f1 calc(0.75s*var(--rd-speed,1)) ease-out;animation-delay:calc((0.2s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-list-checks[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-list-checks-f0{0%{stroke-dashoffset:1.2}100%{stroke-dashoffset:0}}@keyframes rd-list-checks-f1{0%{stroke-dashoffset:1.2}100%{stroke-dashoffset:0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g><g class="p0" style="--k:0;--s:1"><path pathLength="1" d="M3.5 6.5l1.5 1.5 2.5-3M3.5 12.5l1.5 1.5 2.5-3M3.5 18.5l1.5 1.5 2.5-3"/></g></g><g><g class="p1" style="--k:0;--s:1"><path pathLength="1" d="M11 6.5h9.5M11 12.5h9.5M11 18.5h9.5"/></g></g></g></svg>
