<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-tennis-ball" data-rd-animate="hover"><style>.rd-a-tennis-ball{overflow:visible}.rd-a-tennis-ball *{transform-box:view-box}@media (prefers-reduced-motion:no-preference){.rd-a-tennis-ball[data-rd-animate="hover"]:hover .a,:hover>.rd-a-tennis-ball[data-rd-animate="parent"] .a,.rd-a-tennis-ball[data-rd-animate="play"] .a,.rd-a-tennis-ball[data-rd-animate="loop"] .a{animation:rd-tennis-ball-m calc(0.8s*var(--rd-speed,1)) ease-in-out}.rd-a-tennis-ball[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-tennis-ball-m{0%,100%{translate:0 0}30%{translate:0 -3px}55%{translate:0 0}72%{translate:0 -1px}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><circle cx="12" cy="12" r="8.5"/><path d="M5.99 5.99A9 9 0 0 1 5.99 18.01M18.01 5.99A9 9 0 0 0 18.01 18.01"/></g></g></svg>
