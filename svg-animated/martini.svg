<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-martini" data-rd-animate="hover"><style>.rd-a-martini{overflow:visible}.rd-a-martini *{transform-box:view-box}.rd-a-martini .p0{transform-origin:12px 13.5px}@media (prefers-reduced-motion:no-preference){.rd-a-martini[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-martini[data-rd-animate="parent"] .p0,.rd-a-martini[data-rd-animate="play"] .p0,.rd-a-martini[data-rd-animate="loop"] .p0{animation:rd-martini-f0 calc(0.9s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-martini[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-martini-f0{0%,100%{rotate:0deg}35%{rotate:-7deg}70%{rotate:5deg}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><path d="M12 13.5v7M8 20.5h8"/><g><g class="p0" style="--k:0;--s:1"><path d="M4 4.5h16L12 13.5z"/></g></g></g></svg>
