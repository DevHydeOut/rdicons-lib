<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-filter" data-rd-animate="hover"><style>.rd-a-filter{overflow:visible}.rd-a-filter *{transform-box:view-box}.rd-a-filter .d{stroke-dasharray:1 2}@media (prefers-reduced-motion:no-preference){.rd-a-filter[data-rd-animate="hover"]:hover .d,:hover>.rd-a-filter[data-rd-animate="parent"] .d,.rd-a-filter[data-rd-animate="play"] .d,.rd-a-filter[data-rd-animate="loop"] .d{animation:rd-filter-draw calc(0.75s*var(--rd-speed,1)) ease-out;animation-delay:calc(var(--k)*.1s*var(--rd-speed,1))}.rd-a-filter[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-filter-draw{0%{stroke-dashoffset:1.2}100%{stroke-dashoffset:0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="d" style="--k:0"><path pathLength="1" d="M4 5.5h16L14.2 12.4v5.8L9.8 20.5v-8.1z"/></g></g></svg>
