<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-circle-dot" data-rd-animate="hover"><style>.rd-a-circle-dot{overflow:visible}.rd-a-circle-dot *{transform-box:view-box}.rd-a-circle-dot .p0{transform-box:fill-box;transform-origin:center}.rd-a-circle-dot .p1{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:no-preference){.rd-a-circle-dot[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-circle-dot[data-rd-animate="parent"] .p0,.rd-a-circle-dot[data-rd-animate="play"] .p0,.rd-a-circle-dot[data-rd-animate="loop"] .p0{animation:rd-circle-dot-f0 calc(0.8s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-circle-dot[data-rd-animate="hover"]:hover .p1,:hover>.rd-a-circle-dot[data-rd-animate="parent"] .p1,.rd-a-circle-dot[data-rd-animate="play"] .p1,.rd-a-circle-dot[data-rd-animate="loop"] .p1{animation:rd-circle-dot-f1 calc(0.5s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1);animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-circle-dot[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-circle-dot-f0{0%,100%{scale:1}45%{scale:1.08}}@keyframes rd-circle-dot-f1{0%,100%{scale:1}40%{scale:1.5}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g><g class="p0" style="--k:0;--s:1"><circle cx="12" cy="12" r="8.5"/></g></g><g><g class="p1" style="--k:0;--s:1"><circle cx="12" cy="12" r="2"/></g></g></g></svg>
