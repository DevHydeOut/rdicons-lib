<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-star" data-rd-animate="hover"><style>.rd-a-star{overflow:visible}.rd-a-star *{transform-box:view-box}.rd-a-star .star{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-star[data-rd-animate="hover"]:hover .star,:hover>.rd-a-star[data-rd-animate="parent"] .star,.rd-a-star[data-rd-animate="play"] .star,.rd-a-star[data-rd-animate="loop"] .star{animation:rd-star-spin calc(0.7s*var(--rd-speed,1)) ease-in-out}.rd-a-star[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-star-spin{0%{rotate:0deg;scale:1}45%{scale:1.2}100%{rotate:72deg;scale:1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="star"><path d="M12 3.8l2.5 5.3 5.8.8-4.2 4.1 1 5.8L12 17.1l-5.1 2.7 1-5.8-4.2-4.1 5.8-.8z"/></g></g></svg>
