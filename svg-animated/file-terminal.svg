<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-file-terminal" data-rd-animate="hover"><style>.rd-a-file-terminal{overflow:visible}.rd-a-file-terminal *{transform-box:view-box}.rd-a-file-terminal .base{transform-origin:12px 12px}.rd-a-file-terminal .badge{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:no-preference){.rd-a-file-terminal[data-rd-animate="hover"]:hover .base,:hover>.rd-a-file-terminal[data-rd-animate="parent"] .base,.rd-a-file-terminal[data-rd-animate="play"] .base,.rd-a-file-terminal[data-rd-animate="loop"] .base{animation:rd-file-terminal-base calc(0.7s*var(--rd-speed,1)) ease-in-out}.rd-a-file-terminal[data-rd-animate="hover"]:hover .badge,:hover>.rd-a-file-terminal[data-rd-animate="parent"] .badge,.rd-a-file-terminal[data-rd-animate="play"] .badge,.rd-a-file-terminal[data-rd-animate="loop"] .badge{animation:rd-file-terminal-badge calc(0.8s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-file-terminal[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-file-terminal-base{0%,100%{scale:1}40%{scale:.96}}@keyframes rd-file-terminal-badge{0%,100%{scale:1;opacity:1}22%{scale:.1;opacity:0}62%{scale:1.3;opacity:1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="base"><path d="M13.5 3.5H8A3.5 3.5 0 0 0 4.5 7v10A3.5 3.5 0 0 0 8 20.5h8a3.5 3.5 0 0 0 3.5-3.5V9.5"/><path d="M13.5 3.5V7A2.5 2.5 0 0 0 16 9.5h3.5"/></g><g class="badge"><path d="M9.5 13l2 1.5-2 1.5"/><path d="M13 17h2.5"/></g></g></svg>
