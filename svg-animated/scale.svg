<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-scale" data-rd-animate="hover"><style>.rd-a-scale{overflow:visible}.rd-a-scale *{transform-box:view-box}.rd-a-scale .p0{transform-origin:12px 7px}.rd-a-scale .p2{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-scale[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-scale[data-rd-animate="parent"] .p0,.rd-a-scale[data-rd-animate="play"] .p0,.rd-a-scale[data-rd-animate="loop"] .p0{animation:rd-scale-f0 calc(0.9s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-scale[data-rd-animate="hover"]:hover .p1,:hover>.rd-a-scale[data-rd-animate="parent"] .p1,.rd-a-scale[data-rd-animate="play"] .p1,.rd-a-scale[data-rd-animate="loop"] .p1{animation:rd-scale-f1 calc(0.9s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-scale[data-rd-animate="hover"]:hover .p2,:hover>.rd-a-scale[data-rd-animate="parent"] .p2,.rd-a-scale[data-rd-animate="play"] .p2,.rd-a-scale[data-rd-animate="loop"] .p2{animation:rd-scale-f2 calc(0.9s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-scale[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-scale-f0{0%,100%{rotate:0deg}35%{rotate:-7deg}70%{rotate:5deg}}@keyframes rd-scale-f1{0%,100%{translate:0 0}45%{translate:0 calc(var(--s)*2px)}}@keyframes rd-scale-f2{0%,100%{translate:0 0}45%{translate:0 calc(var(--s)*2px)}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g><g class="p0" style="--k:0;--s:1"><path d="M12 4v16M7.5 20h9M5 7h14"/></g></g><g><g class="p1" style="--k:0;--s:1"><path d="M5 7l-3 7a3 3 0 0 0 6 0z"/></g></g><g><g class="p2" style="--k:0;--s:1"><path d="M19 7l-3 7a3 3 0 0 0 6 0z"/></g></g></g></svg>
