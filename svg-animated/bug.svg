<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-bug" data-rd-animate="hover"><style>.rd-a-bug{overflow:visible}.rd-a-bug *{transform-box:view-box}.rd-a-bug .p1{transform-origin:12px 14px}@media (prefers-reduced-motion:no-preference){.rd-a-bug[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-bug[data-rd-animate="parent"] .p0,.rd-a-bug[data-rd-animate="play"] .p0,.rd-a-bug[data-rd-animate="loop"] .p0{animation:rd-bug-f0 calc(0.9s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0.08s)*var(--rd-speed,1))}.rd-a-bug[data-rd-animate="hover"]:hover .p1,:hover>.rd-a-bug[data-rd-animate="parent"] .p1,.rd-a-bug[data-rd-animate="play"] .p1,.rd-a-bug[data-rd-animate="loop"] .p1{animation:rd-bug-f1 calc(0.8s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-bug[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-bug-f0{0%,100%{translate:0 0}50%{translate:calc(var(--s)*2.6px) 0}}@keyframes rd-bug-f1{0%,100%{scale:1}45%{scale:1.08}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g><g class="p0" style="--k:0;--s:1"><path d="M12 20v-9"/></g><g class="p0" style="--k:1;--s:-1"><path d="M9 6.5L7.5 4.5"/></g><g class="p0" style="--k:2;--s:1"><path d="M15 6.5l1.5-2"/></g><g class="p0" style="--k:3;--s:-1"><path d="M7 12H3.5"/></g><g class="p0" style="--k:4;--s:1"><path d="M17 12h3.5"/></g><g class="p0" style="--k:5;--s:-1"><path d="M7.5 16.5l-3 2"/></g><g class="p0" style="--k:6;--s:1"><path d="M16.5 16.5l3 2"/></g></g><g><g class="p1" style="--k:0;--s:1"><path d="M12 20a5 5 0 0 1-5-5v-3a5 5 0 0 1 10 0v3a5 5 0 0 1-5 5z"/></g></g></g></svg>
