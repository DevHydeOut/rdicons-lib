<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-upload" data-rd-animate="hover"><style>.rd-a-upload{overflow:visible}.rd-a-upload *{transform-box:view-box}@media (prefers-reduced-motion:no-preference){.rd-a-upload[data-rd-animate="hover"]:hover .arrow,:hover>.rd-a-upload[data-rd-animate="parent"] .arrow,.rd-a-upload[data-rd-animate="play"] .arrow,.rd-a-upload[data-rd-animate="loop"] .arrow{animation:rd-upload-rise calc(0.75s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-upload[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-upload-rise{0%,100%{translate:0 0}34%{translate:0 -2.5px}62%{translate:0 .9px}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="arrow"><path d="M12 16V5M7.5 9.5L12 5l4.5 4.5"/></g><path d="M4.5 15.5V16a4 4 0 0 0 4 4h7a4 4 0 0 0 4-4v-.5"/></g></svg>
