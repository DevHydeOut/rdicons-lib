<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-refresh" data-rd-animate="hover"><style>.rd-a-refresh{overflow:visible}.rd-a-refresh *{transform-box:view-box}.rd-a-refresh .spin{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-refresh[data-rd-animate="hover"]:hover .spin,:hover>.rd-a-refresh[data-rd-animate="parent"] .spin,.rd-a-refresh[data-rd-animate="play"] .spin,.rd-a-refresh[data-rd-animate="loop"] .spin{animation:rd-refresh-spin calc(0.8s*var(--rd-speed,1)) ease-in-out}.rd-a-refresh[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-refresh-spin{0%{rotate:0deg}100%{rotate:360deg}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="spin"><path d="M20.5 12A8.5 8.5 0 1 1 12 3.5c2.4 0 4.6.95 6.2 2.5L20.5 8"/><path d="M20.5 3.5V8H16"/></g></g></svg>
