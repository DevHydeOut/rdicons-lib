<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-rectangle" data-rd-animate="hover"><style>.rd-a-rectangle{overflow:visible}.rd-a-rectangle *{transform-box:view-box}.rd-a-rectangle .d{stroke-dasharray:1 2}@media (prefers-reduced-motion:no-preference){.rd-a-rectangle[data-rd-animate="hover"]:hover .d,:hover>.rd-a-rectangle[data-rd-animate="parent"] .d,.rd-a-rectangle[data-rd-animate="play"] .d,.rd-a-rectangle[data-rd-animate="loop"] .d{animation:rd-rectangle-draw calc(0.75s*var(--rd-speed,1)) ease-out;animation-delay:calc(var(--k)*.1s*var(--rd-speed,1))}.rd-a-rectangle[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-rectangle-draw{0%{stroke-dashoffset:1.2}100%{stroke-dashoffset:0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="d" style="--k:0"><rect pathLength="1" x="3" y="6.5" width="18" height="11" rx="3.5"/></g></g></svg>
