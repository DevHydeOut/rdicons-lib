<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-rectangle" data-rd-animate="hover"><style>.rd-a-rectangle{overflow:visible}.rd-a-rectangle *{transform-box:view-box}.rd-a-rectangle .a{transform-origin:12px 20px}@media (prefers-reduced-motion:no-preference){.rd-a-rectangle[data-rd-animate="hover"]:hover .a,:hover>.rd-a-rectangle[data-rd-animate="parent"] .a,.rd-a-rectangle[data-rd-animate="play"] .a,.rd-a-rectangle[data-rd-animate="loop"] .a{animation:rd-rectangle-m calc(0.7s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-rectangle[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-rectangle-m{0%,100%{scale:1 1}40%{scale:1.1 .86}70%{scale:.95 1.06}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><rect x="3" y="6.5" width="18" height="11" rx="3.5"/></g></g></svg>
