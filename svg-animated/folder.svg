<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-folder" data-rd-animate="hover"><style>.rd-a-folder{overflow:visible}.rd-a-folder *{transform-box:view-box}.rd-a-folder .shape{transform-origin:12px 12px}.rd-a-folder .close{stroke-dasharray:1 2;stroke-dashoffset:1.2}@media (prefers-reduced-motion:no-preference){.rd-a-folder[data-rd-animate="hover"]:hover .close,:hover>.rd-a-folder[data-rd-animate="parent"] .close,.rd-a-folder[data-rd-animate="play"] .close,.rd-a-folder[data-rd-animate="loop"] .close{animation:rd-folder-close calc(0.9s*var(--rd-speed,1)) ease-in-out}.rd-a-folder[data-rd-animate="hover"]:hover .shape,:hover>.rd-a-folder[data-rd-animate="parent"] .shape,.rd-a-folder[data-rd-animate="play"] .shape,.rd-a-folder[data-rd-animate="loop"] .shape{animation:rd-folder-seal calc(0.9s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-folder[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-folder-close{0%,100%{stroke-dashoffset:1.2}30%,68%{stroke-dashoffset:0}}@keyframes rd-folder-seal{0%,100%{scale:1}34%{scale:.95}52%{scale:1.03}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="shape"><path d="M20.13 8.61A4 4 0 0 1 20.5 10.3v6.2a4 4 0 0 1-4 4h-9a4 4 0 0 1-4-4v-9a4 4 0 0 1 4-4h1.6a3 3 0 0 1 2.2 1l.7.8a3 3 0 0 0 2.2 1h2.3a4 4 0 0 1 1.69.37"/><path class="close" pathLength="1" d="M18.19 6.67A4 4 0 0 1 20.13 8.61"/></g></g></svg>
