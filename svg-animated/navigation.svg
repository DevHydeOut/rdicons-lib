<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-navigation" data-rd-animate="hover"><style>.rd-a-navigation{overflow:visible}.rd-a-navigation *{transform-box:view-box}@media (prefers-reduced-motion:no-preference){.rd-a-navigation[data-rd-animate="hover"]:hover .a,:hover>.rd-a-navigation[data-rd-animate="parent"] .a,.rd-a-navigation[data-rd-animate="play"] .a,.rd-a-navigation[data-rd-animate="loop"] .a{animation:rd-navigation-m calc(0.7s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-navigation[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-navigation-m{0%,100%{translate:0 0}40%{translate:2.2px -2.2px}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><path d="M20 4l-7 16-2.5-6.5L4 11z"/></g></g></svg>
