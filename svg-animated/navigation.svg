<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-navigation" data-rd-animate="hover"><style>.rd-a-navigation{overflow:visible}.rd-a-navigation *{transform-box:view-box}.rd-a-navigation .d{stroke-dasharray:1 2}@media (prefers-reduced-motion:no-preference){.rd-a-navigation[data-rd-animate="hover"]:hover .d,:hover>.rd-a-navigation[data-rd-animate="parent"] .d,.rd-a-navigation[data-rd-animate="play"] .d,.rd-a-navigation[data-rd-animate="loop"] .d{animation:rd-navigation-draw calc(0.75s*var(--rd-speed,1)) ease-out;animation-delay:calc(var(--k)*.1s*var(--rd-speed,1))}.rd-a-navigation[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-navigation-draw{0%{stroke-dashoffset:1.2}100%{stroke-dashoffset:0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="d" style="--k:0"><path pathLength="1" d="M20 4l-7 16-2.5-6.5L4 11z"/></g></g></svg>
