<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-spoon" data-rd-animate="hover"><style>.rd-a-spoon{overflow:visible}.rd-a-spoon *{transform-box:view-box}.rd-a-spoon .a{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-spoon[data-rd-animate="hover"]:hover .a,:hover>.rd-a-spoon[data-rd-animate="parent"] .a,.rd-a-spoon[data-rd-animate="play"] .a,.rd-a-spoon[data-rd-animate="loop"] .a{animation:rd-spoon-m calc(0.8s*var(--rd-speed,1)) ease-in-out}.rd-a-spoon[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-spoon-m{0%,100%{rotate:0deg}35%{rotate:-12deg}70%{rotate:9deg}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><ellipse cx="12" cy="7.5" rx="3" ry="4.2"/><path d="M12 11.7v8.8"/></g></g></svg>
