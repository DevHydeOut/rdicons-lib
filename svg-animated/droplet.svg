<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-droplet" data-rd-animate="hover"><style>.rd-a-droplet{overflow:visible}.rd-a-droplet *{transform-box:view-box}@media (prefers-reduced-motion:no-preference){.rd-a-droplet[data-rd-animate="hover"]:hover .a,:hover>.rd-a-droplet[data-rd-animate="parent"] .a,.rd-a-droplet[data-rd-animate="play"] .a,.rd-a-droplet[data-rd-animate="loop"] .a{animation:rd-droplet-m calc(1s*var(--rd-speed,1)) ease-in-out}.rd-a-droplet[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-droplet-m{0%,100%{translate:0 0}50%{translate:2px 0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><path d="M12 3.5c3.5 4 6 7 6 10.5a6 6 0 0 1-12 0c0-3.5 2.5-6.5 6-10.5z"/></g></g></svg>
