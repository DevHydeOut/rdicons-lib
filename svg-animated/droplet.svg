<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-droplet" data-rd-animate="hover"><style>.rd-a-droplet{overflow:visible}.rd-a-droplet *{transform-box:view-box}@media (prefers-reduced-motion:no-preference){.rd-a-droplet[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-droplet[data-rd-animate="parent"] .p0,.rd-a-droplet[data-rd-animate="play"] .p0,.rd-a-droplet[data-rd-animate="loop"] .p0{animation:rd-droplet-f0 calc(0.8s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-droplet[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-droplet-f0{0%,100%{translate:0 0}35%{translate:0 2.4px}60%{translate:0 -.6px}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g><g class="p0" style="--k:0;--s:1"><path d="M12 3.5c3.5 4 6 7 6 10.5a6 6 0 0 1-12 0c0-3.5 2.5-6.5 6-10.5z"/></g></g></g></svg>
