<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-check-check" data-rd-animate="hover"><style>.rd-a-check-check{overflow:visible}.rd-a-check-check *{transform-box:view-box}.rd-a-check-check .d{stroke-dasharray:1 2}@media (prefers-reduced-motion:no-preference){.rd-a-check-check[data-rd-animate="hover"]:hover .d,:hover>.rd-a-check-check[data-rd-animate="parent"] .d,.rd-a-check-check[data-rd-animate="play"] .d,.rd-a-check-check[data-rd-animate="loop"] .d{animation:rd-check-check-draw calc(0.75s*var(--rd-speed,1)) ease-out;animation-delay:calc(var(--k)*.1s*var(--rd-speed,1))}.rd-a-check-check[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-check-check-draw{0%{stroke-dashoffset:1.2}100%{stroke-dashoffset:0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="d" style="--k:0"><path pathLength="1" d="M3.5 12.5l4.5 4.5 7-9"/></g><g class="d" style="--k:1"><path pathLength="1" d="M11 15l1.5 1.5 8-9"/></g></g></svg>
