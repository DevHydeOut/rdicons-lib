<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-anchor" data-rd-animate="hover"><style>.rd-a-anchor{overflow:visible}.rd-a-anchor *{transform-box:view-box}.rd-a-anchor .sw{transform-origin:12px 8px}@media (prefers-reduced-motion:no-preference){.rd-a-anchor[data-rd-animate="hover"]:hover .sw,:hover>.rd-a-anchor[data-rd-animate="parent"] .sw,.rd-a-anchor[data-rd-animate="play"] .sw,.rd-a-anchor[data-rd-animate="loop"] .sw{animation:rd-anchor-sway calc(1s*var(--rd-speed,1)) ease-in-out}.rd-a-anchor[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-anchor-sway{0%,100%{rotate:0deg}25%{rotate:12deg}55%{rotate:-8deg}80%{rotate:3deg}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><circle cx="12" cy="5.5" r="2.5"/><g class="sw"><path d="M12 8v12.5M7.5 12h9"/><path d="M4 14.5a8 8 0 0 0 16 0"/></g></g></svg>
