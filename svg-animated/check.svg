<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-check" data-rd-animate="hover"><style>.rd-a-check{overflow:visible}.rd-a-check *{transform-box:view-box}.rd-a-check .draw{stroke-dasharray:1 2;stroke-dashoffset:0}@media (prefers-reduced-motion:no-preference){.rd-a-check[data-rd-animate="hover"]:hover .draw,:hover>.rd-a-check[data-rd-animate="parent"] .draw,.rd-a-check[data-rd-animate="play"] .draw,.rd-a-check[data-rd-animate="loop"] .draw{animation:rd-check-draw calc(0.55s*var(--rd-speed,1)) ease-out}.rd-a-check[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-check-draw{0%{stroke-dashoffset:1}100%{stroke-dashoffset:0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><path class="draw" pathLength="1" d="M5 12.5l4.5 4.5L19 7.5"/></g></svg>
