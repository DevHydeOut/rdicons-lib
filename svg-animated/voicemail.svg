<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-voicemail" data-rd-animate="hover"><style>.rd-a-voicemail{overflow:visible}.rd-a-voicemail *{transform-box:view-box}.rd-a-voicemail .a{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-voicemail[data-rd-animate="hover"]:hover .a,:hover>.rd-a-voicemail[data-rd-animate="parent"] .a,.rd-a-voicemail[data-rd-animate="play"] .a,.rd-a-voicemail[data-rd-animate="loop"] .a{animation:rd-voicemail-m calc(0.7s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-voicemail[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-voicemail-m{0%,100%{scale:1}35%{scale:.88}65%{scale:1.1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><circle cx="6" cy="12" r="3"/><circle cx="18" cy="12" r="3"/><path d="M6 15h12"/></g></g></svg>
