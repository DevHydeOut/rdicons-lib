<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-underline" data-rd-animate="hover"><style>.rd-a-underline{overflow:visible}.rd-a-underline *{transform-box:view-box}.rd-a-underline .d{stroke-dasharray:1 2}@media (prefers-reduced-motion:no-preference){.rd-a-underline[data-rd-animate="hover"]:hover .d,:hover>.rd-a-underline[data-rd-animate="parent"] .d,.rd-a-underline[data-rd-animate="play"] .d,.rd-a-underline[data-rd-animate="loop"] .d{animation:rd-underline-draw calc(0.75s*var(--rd-speed,1)) ease-out;animation-delay:calc(var(--k)*.1s*var(--rd-speed,1))}.rd-a-underline[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-underline-draw{0%{stroke-dashoffset:1.2}100%{stroke-dashoffset:0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="d" style="--k:0"><path pathLength="1" d="M7 4.5v7a5 5 0 0 0 10 0v-7"/></g><g class="d" style="--k:1"><path pathLength="1" d="M5 20h14"/></g></g></svg>
