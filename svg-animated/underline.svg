<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-underline" data-rd-animate="hover"><style>.rd-a-underline{overflow:visible}.rd-a-underline *{transform-box:view-box}.rd-a-underline .a{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-underline[data-rd-animate="hover"]:hover .a,:hover>.rd-a-underline[data-rd-animate="parent"] .a,.rd-a-underline[data-rd-animate="play"] .a,.rd-a-underline[data-rd-animate="loop"] .a{animation:rd-underline-m calc(0.7s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-underline[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-underline-m{0%,100%{scale:1}35%{scale:.88}65%{scale:1.1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><path d="M7 4.5v7a5 5 0 0 0 10 0v-7M5 20h14"/></g></g></svg>
