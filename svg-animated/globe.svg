<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-globe" data-rd-animate="hover"><style>.rd-a-globe{overflow:visible}.rd-a-globe *{transform-box:view-box}.rd-a-globe .p0{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-globe[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-globe[data-rd-animate="parent"] .p0,.rd-a-globe[data-rd-animate="play"] .p0,.rd-a-globe[data-rd-animate="loop"] .p0{animation:rd-globe-f0 calc(0.7s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-globe[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-globe-f0{0%,100%{scale:1 1}50%{scale:.1 1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17"/><g><g class="p0" style="--k:0;--s:1"><path d="M12 3.5c2.5 2.3 3.7 5.2 3.7 8.5s-1.2 6.2-3.7 8.5c-2.5-2.3-3.7-5.2-3.7-8.5S9.5 5.8 12 3.5z"/></g></g></g></svg>
