<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-home" data-rd-animate="hover"><style>.rd-a-home{overflow:visible}.rd-a-home *{transform-box:view-box}.rd-a-home .shape{transform-origin:12px 12px}.rd-a-home .door{transform-origin:12px 20px}.rd-a-home .close{stroke-dasharray:1 2;stroke-dashoffset:1.2}@media (prefers-reduced-motion:no-preference){.rd-a-home[data-rd-animate="hover"]:hover .close,:hover>.rd-a-home[data-rd-animate="parent"] .close,.rd-a-home[data-rd-animate="play"] .close,.rd-a-home[data-rd-animate="loop"] .close{animation:rd-home-close calc(0.9s*var(--rd-speed,1)) ease-in-out}.rd-a-home[data-rd-animate="hover"]:hover .shape,:hover>.rd-a-home[data-rd-animate="parent"] .shape,.rd-a-home[data-rd-animate="play"] .shape,.rd-a-home[data-rd-animate="loop"] .shape{animation:rd-home-seal calc(0.9s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-home[data-rd-animate="hover"]:hover .door,:hover>.rd-a-home[data-rd-animate="parent"] .door,.rd-a-home[data-rd-animate="play"] .door,.rd-a-home[data-rd-animate="loop"] .door{animation:rd-home-door calc(0.9s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-home[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-home-close{0%,100%{stroke-dashoffset:1.2}30%,68%{stroke-dashoffset:0}}@keyframes rd-home-seal{0%,100%{scale:1}34%{scale:.95}52%{scale:1.03}}@keyframes rd-home-door{0%,100%{scale:1 1}40%{scale:1 .78}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="shape"><path d="M3 11.5l7.6-6.4a2.2 2.2 0 0 1 2.8 0l2 1.67M17.9 8.9L21 11.5"/><path class="close" pathLength="1" d="M15.4 6.77L17.9 8.9"/><path d="M5 10.2v7.3A2.5 2.5 0 0 0 7.5 20h9a2.5 2.5 0 0 0 2.5-2.5v-7.3"/><path class="door" d="M10 20v-4a1.5 1.5 0 0 1 1.5-1.5h1A1.5 1.5 0 0 1 14 16v4"/></g></g></svg>
