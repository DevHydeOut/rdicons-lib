<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-orbit" data-rd-animate="hover"><style>.rd-a-orbit{overflow:visible}.rd-a-orbit *{transform-box:view-box}.rd-a-orbit .a{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-orbit[data-rd-animate="hover"]:hover .a,:hover>.rd-a-orbit[data-rd-animate="parent"] .a,.rd-a-orbit[data-rd-animate="play"] .a,.rd-a-orbit[data-rd-animate="loop"] .a{animation:rd-orbit-m calc(0.9s*var(--rd-speed,1)) ease-in-out}.rd-a-orbit[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-orbit-m{0%{rotate:0deg}100%{rotate:360deg}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><circle cx="12" cy="12" r="1.5"/><ellipse cx="12" cy="12" rx="8.5" ry="4"/><ellipse cx="12" cy="12" rx="4" ry="8.5"/></g></g></svg>
