<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-pie-chart" data-rd-animate="hover"><style>.rd-a-pie-chart{overflow:visible}.rd-a-pie-chart *{transform-box:view-box}@media (prefers-reduced-motion:no-preference){.rd-a-pie-chart[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-pie-chart[data-rd-animate="parent"] .p0,.rd-a-pie-chart[data-rd-animate="play"] .p0,.rd-a-pie-chart[data-rd-animate="loop"] .p0{animation:rd-pie-chart-f0 calc(0.7s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1);animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-pie-chart[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-pie-chart-f0{0%,100%{translate:0 0}45%{translate:-1.3px -1.3px}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><path d="M12 3.5a8.5 8.5 0 1 0 8.5 8.5H12z"/><g><g class="p0" style="--k:0;--s:1"><path d="M15 3.9A8.5 8.5 0 0 1 20.1 9H15z"/></g></g></g></svg>
