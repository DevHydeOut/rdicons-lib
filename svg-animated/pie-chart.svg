<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-pie-chart" data-rd-animate="hover"><style>.rd-a-pie-chart{overflow:visible}.rd-a-pie-chart *{transform-box:view-box}.rd-a-pie-chart .a{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-pie-chart[data-rd-animate="hover"]:hover .a,:hover>.rd-a-pie-chart[data-rd-animate="parent"] .a,.rd-a-pie-chart[data-rd-animate="play"] .a,.rd-a-pie-chart[data-rd-animate="loop"] .a{animation:rd-pie-chart-m calc(0.7s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-pie-chart[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-pie-chart-m{0%,100%{scale:1}35%{scale:.88}65%{scale:1.1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><path d="M12 3.5a8.5 8.5 0 1 0 8.5 8.5H12z"/><path d="M15 3.9A8.5 8.5 0 0 1 20.1 9H15z"/></g></g></svg>
