<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-loader" data-rd-animate="hover"><style>.rd-a-loader{overflow:visible}.rd-a-loader *{transform-box:view-box}.rd-a-loader .spin{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-loader[data-rd-animate="hover"]:hover .spin,:hover>.rd-a-loader[data-rd-animate="parent"] .spin,.rd-a-loader[data-rd-animate="play"] .spin,.rd-a-loader[data-rd-animate="loop"] .spin{animation:rd-loader-spin calc(0.9s*var(--rd-speed,1)) linear}.rd-a-loader[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-loader-spin{0%{rotate:0deg}100%{rotate:360deg}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="spin"><path d="M12 3.5a8.5 8.5 0 1 0 8.5 8.5"/></g></g></svg>
