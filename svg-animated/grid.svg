<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-grid" data-rd-animate="hover"><style>.rd-a-grid{overflow:visible}.rd-a-grid *{transform-box:view-box}.rd-a-grid .p0{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:no-preference){.rd-a-grid[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-grid[data-rd-animate="parent"] .p0,.rd-a-grid[data-rd-animate="play"] .p0,.rd-a-grid[data-rd-animate="loop"] .p0{animation:rd-grid-f0 calc(0.5s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1);animation-delay:calc((0s + var(--k)*0.1s)*var(--rd-speed,1))}.rd-a-grid[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-grid-f0{0%,100%{scale:1}40%{scale:1.5}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g><g class="p0" style="--k:0;--s:1"><rect x="4" y="4" width="6.5" height="6.5" rx="2"/></g><g class="p0" style="--k:1;--s:1"><rect x="13.5" y="4" width="6.5" height="6.5" rx="2"/></g><g class="p0" style="--k:2;--s:1"><rect x="4" y="13.5" width="6.5" height="6.5" rx="2"/></g><g class="p0" style="--k:3;--s:1"><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="2"/></g></g></g></svg>
