<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-microwave" data-rd-animate="hover"><style>.rd-a-microwave{overflow:visible}.rd-a-microwave *{transform-box:view-box}.rd-a-microwave .a{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-microwave[data-rd-animate="hover"]:hover .a,:hover>.rd-a-microwave[data-rd-animate="parent"] .a,.rd-a-microwave[data-rd-animate="play"] .a,.rd-a-microwave[data-rd-animate="loop"] .a{animation:rd-microwave-m calc(0.7s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-microwave[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-microwave-m{0%,100%{scale:1}35%{scale:.88}65%{scale:1.1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><rect x="3.5" y="5" width="17" height="14" rx="3"/><rect x="6.5" y="8" width="8" height="8" rx="1.5"/><path d="M17.5 9h.01"/><path d="M17.5 12h.01"/><path d="M17.5 15h.01"/></g></g></svg>
