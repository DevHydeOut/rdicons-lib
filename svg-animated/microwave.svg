<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-microwave" data-rd-animate="hover"><style>.rd-a-microwave{overflow:visible}.rd-a-microwave *{transform-box:view-box}.rd-a-microwave .p1{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:no-preference){.rd-a-microwave[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-microwave[data-rd-animate="parent"] .p0,.rd-a-microwave[data-rd-animate="play"] .p0,.rd-a-microwave[data-rd-animate="loop"] .p0{animation:rd-microwave-f0 calc(0.7s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-microwave[data-rd-animate="hover"]:hover .p1,:hover>.rd-a-microwave[data-rd-animate="parent"] .p1,.rd-a-microwave[data-rd-animate="play"] .p1,.rd-a-microwave[data-rd-animate="loop"] .p1{animation:rd-microwave-f1 calc(0.5s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1);animation-delay:calc((0s + var(--k)*0.12s)*var(--rd-speed,1))}.rd-a-microwave[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-microwave-f0{0%,100%{opacity:1}40%{opacity:.15}}@keyframes rd-microwave-f1{0%,100%{scale:1}40%{scale:1.5}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><rect x="3.5" y="5" width="17" height="14" rx="3"/><g><g class="p0" style="--k:0;--s:1"><rect x="6.5" y="8" width="8" height="8" rx="1.5"/></g></g><g><g class="p1" style="--k:0;--s:1"><path d="M17.5 9h.01"/></g><g class="p1" style="--k:1;--s:1"><path d="M17.5 12h.01"/></g><g class="p1" style="--k:2;--s:1"><path d="M17.5 15h.01"/></g></g></g></svg>
