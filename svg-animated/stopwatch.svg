<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-stopwatch" data-rd-animate="hover"><style>.rd-a-stopwatch{overflow:visible}.rd-a-stopwatch *{transform-box:view-box}.rd-a-stopwatch .a{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-stopwatch[data-rd-animate="hover"]:hover .a,:hover>.rd-a-stopwatch[data-rd-animate="parent"] .a,.rd-a-stopwatch[data-rd-animate="play"] .a,.rd-a-stopwatch[data-rd-animate="loop"] .a{animation:rd-stopwatch-m calc(0.8s*var(--rd-speed,1)) ease-in-out}.rd-a-stopwatch[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-stopwatch-m{0%,100%{scale:1}30%{scale:1.2}55%{scale:.95}75%{scale:1.07}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><circle cx="12" cy="13.5" r="7.5"/><path d="M10 3h4M12 3v3M12 13.5l3-3"/><path d="M18.5 6l1.5-1.5"/></g></g></svg>
