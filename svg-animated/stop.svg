<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-stop" data-rd-animate="hover"><style>.rd-a-stop{overflow:visible}.rd-a-stop *{transform-box:view-box}.rd-a-stop .d{stroke-dasharray:1 2}@media (prefers-reduced-motion:no-preference){.rd-a-stop[data-rd-animate="hover"]:hover .d,:hover>.rd-a-stop[data-rd-animate="parent"] .d,.rd-a-stop[data-rd-animate="play"] .d,.rd-a-stop[data-rd-animate="loop"] .d{animation:rd-stop-draw calc(0.75s*var(--rd-speed,1)) ease-out;animation-delay:calc(var(--k)*.1s*var(--rd-speed,1))}.rd-a-stop[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-stop-draw{0%{stroke-dashoffset:1.2}100%{stroke-dashoffset:0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="d" style="--k:0"><rect pathLength="1" x="6" y="6" width="12" height="12" rx="2.5"/></g></g></svg>
