<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-stop" data-rd-animate="hover"><style>.rd-a-stop{overflow:visible}.rd-a-stop *{transform-box:view-box}.rd-a-stop .a{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-stop[data-rd-animate="hover"]:hover .a,:hover>.rd-a-stop[data-rd-animate="parent"] .a,.rd-a-stop[data-rd-animate="play"] .a,.rd-a-stop[data-rd-animate="loop"] .a{animation:rd-stop-m calc(0.7s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-stop[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-stop-m{0%,100%{scale:1 1}40%{scale:1.14 1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><rect x="6" y="6" width="12" height="12" rx="2.5"/></g></g></svg>
