<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-battery-low" data-rd-animate="hover"><style>.rd-a-battery-low{overflow:visible}.rd-a-battery-low *{transform-box:view-box}.rd-a-battery-low .base{transform-origin:12px 12px}.rd-a-battery-low .badge{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:no-preference){.rd-a-battery-low[data-rd-animate="hover"]:hover .base,:hover>.rd-a-battery-low[data-rd-animate="parent"] .base,.rd-a-battery-low[data-rd-animate="play"] .base,.rd-a-battery-low[data-rd-animate="loop"] .base{animation:rd-battery-low-base calc(0.7s*var(--rd-speed,1)) ease-in-out}.rd-a-battery-low[data-rd-animate="hover"]:hover .badge,:hover>.rd-a-battery-low[data-rd-animate="parent"] .badge,.rd-a-battery-low[data-rd-animate="play"] .badge,.rd-a-battery-low[data-rd-animate="loop"] .badge{animation:rd-battery-low-badge calc(0.8s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-battery-low[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-battery-low-base{0%,100%{scale:1}40%{scale:.96}}@keyframes rd-battery-low-badge{0%,100%{scale:1;opacity:1}22%{scale:.1;opacity:0}62%{scale:1.3;opacity:1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="base"><rect x="2.5" y="7.5" width="17" height="9" rx="3"/><path d="M22 11v2"/></g><g class="badge"><path d="M6.5 10.5v3"/></g></g></svg>
