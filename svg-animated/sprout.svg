<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-sprout" data-rd-animate="hover"><style>.rd-a-sprout{overflow:visible}.rd-a-sprout *{transform-box:view-box}.rd-a-sprout .p0{transform-origin:12px 20.5px}.rd-a-sprout .p1{transform-origin:12px 12.5px}.rd-a-sprout .p2{transform-origin:12px 14px}@media (prefers-reduced-motion:no-preference){.rd-a-sprout[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-sprout[data-rd-animate="parent"] .p0,.rd-a-sprout[data-rd-animate="play"] .p0,.rd-a-sprout[data-rd-animate="loop"] .p0{animation:rd-sprout-f0 calc(0.8s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1);animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-sprout[data-rd-animate="hover"]:hover .p1,:hover>.rd-a-sprout[data-rd-animate="parent"] .p1,.rd-a-sprout[data-rd-animate="play"] .p1,.rd-a-sprout[data-rd-animate="loop"] .p1{animation:rd-sprout-f1 calc(1s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-sprout[data-rd-animate="hover"]:hover .p2,:hover>.rd-a-sprout[data-rd-animate="parent"] .p2,.rd-a-sprout[data-rd-animate="play"] .p2,.rd-a-sprout[data-rd-animate="loop"] .p2{animation:rd-sprout-f2 calc(1s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0.1s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-sprout[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-sprout-f0{0%,100%{scale:1 1}45%{scale:1 1.2}}@keyframes rd-sprout-f1{0%,100%{rotate:0deg}30%{rotate:calc(var(--s)*8deg)}65%{rotate:calc(var(--s)*-6deg)}}@keyframes rd-sprout-f2{0%,100%{rotate:0deg}30%{rotate:calc(var(--s)*8deg)}65%{rotate:calc(var(--s)*-6deg)}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g><g class="p0" style="--k:0;--s:1"><path d="M12 19v-8"/></g></g><g><g class="p1" style="--k:0;--s:1"><path d="M12 11c0 -3.5 -2.5 -5.5 -6.5 -5.5c0 3.5 2.5 5.5 6.5 5.5z"/></g></g><g><g class="p2" style="--k:0;--s:1"><path d="M12 12.5c0 -3 2 -5 5.5 -5c0 3 -2 5 -5.5 5z"/></g></g></g></svg>
