<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-cloud-fog" data-rd-animate="hover"><style>.rd-a-cloud-fog{overflow:visible}.rd-a-cloud-fog *{transform-box:view-box}@media (prefers-reduced-motion:no-preference){.rd-a-cloud-fog[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-cloud-fog[data-rd-animate="parent"] .p0,.rd-a-cloud-fog[data-rd-animate="play"] .p0,.rd-a-cloud-fog[data-rd-animate="loop"] .p0{animation:rd-cloud-fog-f0 calc(1s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-cloud-fog[data-rd-animate="hover"]:hover .p1,:hover>.rd-a-cloud-fog[data-rd-animate="parent"] .p1,.rd-a-cloud-fog[data-rd-animate="play"] .p1,.rd-a-cloud-fog[data-rd-animate="loop"] .p1{animation:rd-cloud-fog-f1 calc(0.9s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0.1s)*var(--rd-speed,1))}.rd-a-cloud-fog[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-cloud-fog-f0{0%,100%{translate:0 0}50%{translate:0 -2px}}@keyframes rd-cloud-fog-f1{0%,100%{translate:0 0}50%{translate:calc(var(--s)*2.6px) 0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g><g class="p0" style="--k:0;--s:1"><path d="M8 14.5a3.6 3.6 0 0 1-.560-7.12 4.8 4.8 0 0 1 9.2-.880 3.6 3.6 0 0 1-.640 8z"/></g></g><g><g class="p1" style="--k:0;--s:1"><path d="M5 17.5h14"/></g><g class="p1" style="--k:1;--s:-1"><path d="M8 20.5h8"/></g></g></g></svg>
