<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-locate" data-rd-animate="hover"><style>.rd-a-locate{overflow:visible}.rd-a-locate *{transform-box:view-box}.rd-a-locate .p0{transform-origin:12px 12px}.rd-a-locate .p1{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:no-preference){.rd-a-locate[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-locate[data-rd-animate="parent"] .p0,.rd-a-locate[data-rd-animate="play"] .p0,.rd-a-locate[data-rd-animate="loop"] .p0{animation:rd-locate-f0 calc(0.8s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-locate[data-rd-animate="hover"]:hover .p1,:hover>.rd-a-locate[data-rd-animate="parent"] .p1,.rd-a-locate[data-rd-animate="play"] .p1,.rd-a-locate[data-rd-animate="loop"] .p1{animation:rd-locate-f1 calc(0.8s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-locate[data-rd-animate="hover"]:hover .p2,:hover>.rd-a-locate[data-rd-animate="parent"] .p2,.rd-a-locate[data-rd-animate="play"] .p2,.rd-a-locate[data-rd-animate="loop"] .p2{animation:rd-locate-f2 calc(0.7s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-locate[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-locate-f0{0%,100%{scale:1;opacity:1}50%{scale:1.25;opacity:.3}}@keyframes rd-locate-f1{0%,100%{scale:1}45%{scale:1.08}}@keyframes rd-locate-f2{0%,100%{opacity:1}40%{opacity:.15}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g><g class="p0" style="--k:0;--s:1"><circle cx="12" cy="12" r="6"/></g></g><g><g class="p1" style="--k:0;--s:1"><circle cx="12" cy="12" r="1.5"/></g></g><g><g class="p2" style="--k:0;--s:1"><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/></g></g></g></svg>
