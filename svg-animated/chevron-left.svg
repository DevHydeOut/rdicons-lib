<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-chevron-left" data-rd-animate="hover"><style>.rd-a-chevron-left{overflow:visible}.rd-a-chevron-left *{transform-box:view-box}@media (prefers-reduced-motion:no-preference){.rd-a-chevron-left[data-rd-animate="hover"]:hover .a,:hover>.rd-a-chevron-left[data-rd-animate="parent"] .a,.rd-a-chevron-left[data-rd-animate="play"] .a,.rd-a-chevron-left[data-rd-animate="loop"] .a{animation:rd-chevron-left-m calc(0.7s*var(--rd-speed,1)) cubic-bezier(.34,1.3,.5,1)}.rd-a-chevron-left[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-chevron-left-m{0%,100%{translate:0 0}40%{translate:-2.6px 0}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><path d="M14.5 5.5L8 12l6.5 6.5"/></g></g></svg>
