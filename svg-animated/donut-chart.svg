<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-donut-chart" data-rd-animate="hover"><style>.rd-a-donut-chart{overflow:visible}.rd-a-donut-chart *{transform-box:view-box}.rd-a-donut-chart .p0{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-donut-chart[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-donut-chart[data-rd-animate="parent"] .p0,.rd-a-donut-chart[data-rd-animate="play"] .p0,.rd-a-donut-chart[data-rd-animate="loop"] .p0{animation:rd-donut-chart-f0 calc(0.9s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-donut-chart[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-donut-chart-f0{0%{rotate:0deg}100%{rotate:360deg}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.5"/><g><g class="p0" style="--k:0;--s:1"><path d="M12 3.5v5M20.5 12h-5"/></g></g></g></svg>
