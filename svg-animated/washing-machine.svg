<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-washing-machine" data-rd-animate="hover"><style>.rd-a-washing-machine{overflow:visible}.rd-a-washing-machine *{transform-box:view-box}.rd-a-washing-machine .p0{transform-box:fill-box;transform-origin:center}.rd-a-washing-machine .p1{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:no-preference){.rd-a-washing-machine[data-rd-animate="hover"]:hover .p0,:hover>.rd-a-washing-machine[data-rd-animate="parent"] .p0,.rd-a-washing-machine[data-rd-animate="play"] .p0,.rd-a-washing-machine[data-rd-animate="loop"] .p0{animation:rd-washing-machine-f0 calc(0.9s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0s)*var(--rd-speed,1))}.rd-a-washing-machine[data-rd-animate="hover"]:hover .p1,:hover>.rd-a-washing-machine[data-rd-animate="parent"] .p1,.rd-a-washing-machine[data-rd-animate="play"] .p1,.rd-a-washing-machine[data-rd-animate="loop"] .p1{animation:rd-washing-machine-f1 calc(0.5s*var(--rd-speed,1)) ease-in-out;animation-delay:calc((0s + var(--k)*0.2s)*var(--rd-speed,1))}.rd-a-washing-machine[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-washing-machine-f0{0%,100%{rotate:0deg}35%{rotate:-7deg}70%{rotate:5deg}}@keyframes rd-washing-machine-f1{0%,100%{scale:1 1}45%{scale:1 .1}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><rect x="4" y="2.5" width="16" height="19" rx="3"/><g><g class="p0" style="--k:0;--s:1"><circle cx="12" cy="13" r="4.5"/></g></g><g><g class="p1" style="--k:0;--s:1"><path d="M8 6h.01"/></g><g class="p1" style="--k:1;--s:1"><path d="M11 6h.01"/></g></g></g></svg>
