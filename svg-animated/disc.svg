<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="rd-a-disc" data-rd-animate="hover"><style>.rd-a-disc{overflow:visible}.rd-a-disc *{transform-box:view-box}.rd-a-disc .a{transform-origin:12px 12px}@media (prefers-reduced-motion:no-preference){.rd-a-disc[data-rd-animate="hover"]:hover .a,:hover>.rd-a-disc[data-rd-animate="parent"] .a,.rd-a-disc[data-rd-animate="play"] .a,.rd-a-disc[data-rd-animate="loop"] .a{animation:rd-disc-m calc(0.9s*var(--rd-speed,1)) ease-in-out}.rd-a-disc[data-rd-animate="loop"] *{animation-iteration-count:infinite!important}@keyframes rd-disc-m{0%{rotate:0deg}100%{rotate:360deg}}}</style><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><g class="a"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2.5"/><path d="M16.5 12a4.5 4.5 0 0 0-4.5-4.5"/></g></g></svg>
